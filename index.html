<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الرماد الأخير — النسخة الملحمية الشاملة</title>
<style>
:root{
  --bg:#050403; --panel:#0f0b08; --panel2:#18110c; --line:#281f15;
  --ink:#f5ebd9; --dim:#9e876a; --amber:#d49742; --red:#a8382e;
  --sand:#c9a227; --blue:#4a7c8c; --green:#5a8a3a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:radial-gradient(circle at 50% -20%,#241609 0%,#050403 60%);
  color:var(--ink); font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  display:flex; justify-content:center; padding:14px 12px 70px;
  -webkit-font-smoothing:antialiased;
}
#app{width:100%; max-width:820px}

/* Topbar */
#topbar{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:12px; gap:8px; flex-wrap:wrap;
}
#chapterLabel{
  font-size:12px; letter-spacing:2px; color:var(--amber);
  font-weight:700; padding:6px 14px;
  background:linear-gradient(180deg,#1e1610,#14100c);
  border:1px solid var(--line); border-radius:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
#controls{display:flex; gap:6px; flex-wrap:wrap}
#controls button{
  background:linear-gradient(180deg,#1c1610,#14100c);
  color:var(--ink); border:1px solid var(--line); border-radius:8px;
  padding:7px 11px; font-size:12px; cursor:pointer; font-family:inherit;
  transition:all .15s; box-shadow:0 4px 10px rgba(0,0,0,.3);
}
#controls button:hover{border-color:var(--amber); background:#241a12}
#controls button.off{opacity:.45}

/* HUD */
#hud{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px}
@media(max-width:560px){ #hud{grid-template-columns:repeat(3,1fr)} }
.chip{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line); border-radius:10px;
  padding:8px 9px; display:flex; flex-direction:column; gap:4px; min-width:0;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.chip .lbl{font-size:10px; color:var(--dim); letter-spacing:.5px}
.chip .val{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar{height:5px; background:#1f1812; border-radius:99px; overflow:hidden; margin-top:2px}
.bar i{display:block; height:100%; border-radius:99px; transition:width .6s ease}

/* World Map Bar */
#worldMap{
  background:#0b0806; border:1px solid var(--line); border-radius:12px;
  padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;
  gap:8px; overflow-x:auto;
}
.map-node{font-size:11px; color:var(--dim); display:flex; align-items:center; gap:4px; white-space:nowrap}
.map-node.active{color:var(--amber); font-weight:700; text-shadow:0 0 6px rgba(212,151,66,.4)}
.map-node.passed{color:var(--green)}
.map-line{flex:1; height:1px; background:var(--line); min-width:15px}

/* Scene Card */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  overflow:hidden; margin-bottom:14px; box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#sceneImg{
  width:100%; height:200px; display:block; position:relative;
  border-bottom:1px solid var(--line); overflow:hidden;
  transition:background 1s ease;
}
#sceneImg::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.6));
}
#sceneImg .mood-icon{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:54px; opacity:.4; filter:blur(1px);
}
@media(max-width:520px){ #sceneImg{height:150px} .mood-icon{font-size:38px} }

.card-body{padding:22px 20px}
#scene{line-height:2.2; font-size:15.5px; min-height:100px}
#scene p{margin:0 0 15px; opacity:0; transform:translateY(8px); transition:all .5s ease}
#scene p:last-child{margin-bottom:0}
.speaker{color:var(--amber); font-weight:700; text-shadow:0 0 8px rgba(212,151,66,.2)}
.hl{color:var(--sand); font-weight:600}
.warn-txt{color:var(--red); font-weight:600}

/* Choices */
#choices{display:flex; flex-direction:column; gap:10px}
.choice{
  width:100%; text-align:right; cursor:pointer;
  background:linear-gradient(180deg,#1c1610,#14100c);
  color:var(--ink); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; font-size:15px; font-family:inherit; line-height:1.65;
  transition:all .2s; display:flex; align-items:center; gap:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
}
.choice:hover{
  background:linear-gradient(180deg,#281e15,#1b140f);
  border-color:var(--amber); transform:translateX(-3px);
  box-shadow:0 6px 20px rgba(212,151,66,.18);
}
.choice:active{transform:scale(.99)}
.choice .bullet{flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:var(--amber); opacity:.8; box-shadow:0 0 6px var(--amber)}
.choice .preview{font-size:11px; color:var(--dim); margin-right:auto; padding-right:8px; display:none}
.choice:hover .preview{display:inline}

/* Modals */
.modal{
  position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200;
  display:none; align-items:center; justify-content:center; padding:20px;
  animation:fadeIn .3s ease;
}
.modal.show{display:flex}
.modal-content{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:24px; max-width:600px; width:100%; max-height:80vh; overflow-y:auto;
  box-shadow:0 25px 60px rgba(0,0,0,.8);
}
.modal-content h2{margin:0 0 18px; color:var(--amber); font-size:20px}
.inv-grid, .market-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:16px}
.inv-item, .market-item{
  background:#140e0a; border:1px solid var(--line); border-radius:10px;
  padding:12px; display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center;
}
.inv-item .icon, .market-item .icon{font-size:26px}
.inv-item .name, .market-item .name{font-size:13px; font-weight:700; color:var(--ink)}
.inv-item .desc, .market-item .desc{font-size:11px; color:var(--dim); line-height:1.4}
.inv-item button, .market-item button{
  margin-top:auto; background:var(--amber); color:#000; border:none;
  padding:5px 12px; border-radius:6px; font-size:11.5px; font-weight:700; cursor:pointer;
}
.inv-item button:hover, .market-item button:hover{background:#e0a45c}
.empty-msg{color:var(--dim); font-size:14px; text-align:center; padding:24px; grid-column:1/-1}

.modal-content button.close-btn{
  background:#1c1610; color:var(--ink); border:1px solid var(--line);
  border-radius:10px; padding:10px 20px; cursor:pointer; font-family:inherit;
  margin-top:14px; width:100%; transition:all .2s;
}
.modal-content button.close-btn:hover{border-color:var(--amber); background:#281e15}

/* Companion Box */
.companion-box{
  background:#130e0a; border:1px solid var(--amber); border-radius:10px;
  padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px;
  font-size:13px; color:var(--sand);
}
.companion-box span{font-size:20px}

/* Chapter Banner */
#chapterBanner{
  position:fixed; inset:0; background:rgba(5,4,3,.94); z-index:100;
  display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  animation:fadeIn .4s ease;
}
#chapterBanner.show{display:flex}
#chapterBanner h1{color:var(--amber); font-size:26px; margin:0; text-align:center; padding:0 20px; line-height:1.6}
#chapterBanner .num{font-size:12px; color:var(--dim); letter-spacing:4px}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}

/* Endings */
.ending-h{font-size:24px; font-weight:700; margin:0 0 14px; line-height:1.5}
.ending-h.peace{color:var(--sand)}
.ending-h.dark{color:var(--red)}
.ending-h.broken{color:#8a7a5a}
.quote{
  border-right:3px solid var(--amber); padding:12px 16px;
  color:var(--dim); font-style:italic; margin:18px 0;
  background:rgba(212,151,66,.04); border-radius:0 8px 8px 0; line-height:1.8;
}
.stats-box{
  background:#0b0806; border:1px solid var(--line); border-radius:12px;
  padding:16px; margin:16px 0; font-size:13.5px; line-height:2;
}
.stats-box .row{display:flex; justify-content:space-between; padding:4px 0; color:var(--dim)}
.stats-box .row span:last-child{color:var(--ink); font-weight:600}

/* Toast */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:#18110c; border:1px solid var(--amber); color:var(--ink);
  padding:12px 20px; border-radius:12px; font-size:13.5px; z-index:150;
  transition:transform .4s ease; pointer-events:none; box-shadow:0 10px 30px rgba(0,0,0,.6);
}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="chapterLabel">الفصل الأول · دارفور</span>
    <div id="controls">
      <button id="invBtn">🎒 الحقيبة (<span id="invCount">0</span>)</button>
      <button id="marketBtn">🛒 السوق</button>
      <button id="diaryBtn">📔 المذكرات</button>
      <button id="saveBtn">💾 حفظ</button>
      <button id="loadBtn">📂 تحميل</button>
      <button id="soundBtn" onclick="toggleSound()">🔊 الصوت</button>
    </div>
  </div>

  <div id="worldMap">
    <div class="map-node" id="m-darfur">🌄 دارفور</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-desert">🏜️ الصحراء</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-market">🛒 أم درمان</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-khartoum">🏙️ الخرطوم</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-borders">🚪 الحدود</div>
  </div>

  <div id="companionDisplay"></div>

  <div id="hud"></div>

  <div class="card">
    <div id="sceneImg"><span class="mood-icon"></span></div>
    <div class="card-body"><div id="scene"></div></div>
  </div>
  <div id="choices"></div>
</div>

<div id="chapterBanner">
  <span class="num" id="chNum">الفصل</span>
  <h1 id="chTitle"></h1>
</div>

<!-- Modals -->
<div id="invModal" class="modal">
  <div class="modal-content">
    <h2>🎒 الحقيبة والمخزون</h2>
    <div id="invList" class="inv-grid"></div>
    <button class="close-btn" onclick="closeModal('invModal')">إغلاق الحقيبة</button>
  </div>
</div>

<div id="marketModal" class="modal">
  <div class="modal-content">
    <h2>🛒 سوق أم درمان التجاري</h2>
    <div id="marketList" class="market-grid"></div>
    <button class="close-btn" onclick="closeModal('marketModal')">إغلاق السوق</button>
  </div>
</div>

<div id="diaryModal" class="modal">
  <div class="modal-content">
    <h2>📔 مذكرات رحلة الرماد</h2>
    <div id="diaryList"></div>
    <button class="close-btn" onclick="closeModal('diaryModal')">إغلاق المذكرات</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   MOODS & CHAPTERS & MAP REGIONS
   ============================================================ */
const MOODS = {
  war:      { sky1:'#3a0d08', sky2:'#0a0403', icon:'🔥' },
  darfur:   { sky1:'#5c2a10', sky2:'#1a0f08', icon:'🌄' },
  attack:   { sky1:'#4a1a08', sky2:'#0f0604', icon:'⚠️' },
  desert:   { sky1:'#c98e3f', sky2:'#5c3a1a', icon:'🏜️' },
  city:     { sky1:'#1a2233', sky2:'#0a0d15', icon:'🏙️' },
  market:   { sky1:'#6a3a18', sky2:'#2a1508', icon:'🛒' },
  work:     { sky1:'#3a2a1a', sky2:'#15100a', icon:'🔧' },
  home:     { sky1:'#4a3a2a', sky2:'#1a120a', icon:'🏠' },
  prison:   { sky1:'#1a1a1a', sky2:'#050505', icon:'⛓️' },
  hope:     { sky1:'#8a6a2a', sky2:'#2a2010', icon:'✨' },
  peace:    { sky1:'#7a9a5a', sky2:'#2a3a1a', icon:'🕊️' },
  dark:     { sky1:'#1a1010', sky2:'#050303', icon:'🌑' }
};

const CHAPTERS = {
  1: 'دارفور · البدايات (٢٠٠٣)',
  2: 'طريق الهروب الصحراوي',
  3: 'سوق أم درمان · الانطلاقة',
  4: 'الخرطوم · الكفاح والرزق',
  5: 'الاستقرار والأسرة',
  6: 'الطوفان · ١٥ أبريل ٢٠٢٣',
  7: 'الحدود ومسارات النجاة',
  8: 'الخاتمة والرماد الأخير'
};

/* ============================================================
   STATE, INVENTORY & MARKET & COMPANION
   ============================================================ */
let S = {};
const SAVE_KEY = 'rimad_epic_ultimate_v7';

const ITEMS_DB = {
  water:    { name: 'قربة ماء', icon: '💧', desc: 'تروي الظمأ وتعيد الطاقة.', price: 50, use: s => { s.energy = Math.min(100, s.energy + 30); toast('💧 شربت ماءً عذباً.. انتعش جسدك.'); } },
  medicine: { name: 'إسعافات أولية', icon: '💊', desc: 'تشفى الجروح وتعيد الصحة.', price: 150, use: s => { s.health = Math.min(100, s.health + 40); toast('💊 استخدمت الأدوية.. زادت صحتك.'); } },
  tea:      { name: 'عدة شاي وبلح', icon: '🍵', desc: 'ترفع المعنويات والأمل.', price: 80, use: s => { s.hope = Math.min(100, s.hope + 25); toast('🍵 شربت شاي بالهيل.. ارتفع أملك.'); } },
  docs:     { name: 'وثائق رسمية', icon: '📜', desc: 'مستندات ملكية وحقوق.', price: 300, use: s => { toast('📜 تتأمل وثائقك.. ذكريات الكفاح.'); } }
};

function newState(){
  return {
    money: 180, health: 100, hope: 80, energy: 90, humanity: 60,
    age: 8, chapter: 1, node: 'intro',
    inventory: ['water'],
    companion: null, // { name: 'عثمان', role: 'صديق الطفولة', perk: 'يساعدك في جمع المال' }
    mapNode: 'm-darfur',
    flags: {}, diary: [],
    stats: { choices: 0, kind: 0, cruel: 0 },
    visited: []
  };
}

function addItem(s, id){
  if(!s.inventory.includes(id)){
    s.inventory.push(id);
    toast('🎁 حصلت على أداة جديدة: ' + ITEMS_DB[id].name);
    updateInvUI();
  }
}

function useItem(id){
  const it = ITEMS_DB[id];
  if(it && it.use){
    it.use(S);
    if(id !== 'docs'){
      const idx = S.inventory.indexOf(id);
      if(idx > -1) S.inventory.splice(idx, 1);
    }
    updateHUD();
    updateInvUI();
  }
}

function buyItem(id){
  const it = ITEMS_DB[id];
  if(S.money >= it.price){
    S.money -= it.price;
    addItem(S, id);
    toast('🛍️ اشتريت ' + it.name + ' بنجاح.');
    updateHUD();
    updateMarketUI();
  } else {
    toast('❌ لا تملك ما يكفي من المال للشراء.');
  }
}

function updateInvUI(){
  const list = document.getElementById('invList');
  document.getElementById('invCount').textContent = S.inventory.length;
  if(S.inventory.length === 0){
    list.innerHTML = '<div class="empty-msg">الحقيبة فارغة تماماً.</div>';
    return;
  }
  list.innerHTML = S.inventory.map(id => {
    const it = ITEMS_DB[id];
    return `
      <div class="inv-item">
        <span class="icon">${it.icon}</span>
        <span class="name">${it.name}</span>
        <span class="desc">${it.desc}</span>
        <button onclick="useItem('${id}')">استخدام</button>
      </div>
    `;
  }).join('');
}

function updateMarketUI(){
  const list = document.getElementById('marketList');
  list.innerHTML = Object.keys(ITEMS_DB).map(id => {
    const it = ITEMS_DB[id];
    return `
      <div class="market-item">
        <span class="icon">${it.icon}</span>
        <span class="name">${it.name}</span>
        <span class="desc">${it.desc}</span>
        <span style="color:var(--amber); font-weight:700; font-size:12px">${it.price} ج.س</span>
        <button onclick="buyItem('${id}')">شراء</button>
      </div>
    `;
  }).join('');
}

function updateMap(nodeId){
  S.mapNode = nodeId;
  document.querySelectorAll('.map-node').forEach(el => {
    el.classList.remove('active', 'passed');
    if(el.id === nodeId) el.classList.add('active');
  });
}

function updateCompanionUI(){
  const box = document.getElementById('companionDisplay');
  if(S.companion){
    box.style.display = 'flex';
    box.innerHTML = `<span>👥</span><div><b>رفيق الرحلة: ${S.companion.name}</b><br><small>${S.companion.perk}</small></div>`;
  } else {
    box.style.display = 'none';
  }
}

/* ============================================================
   AUDIO ENGINE & AMBIENT SOUNDS
   ============================================================ */
let audioCtx = null;
let soundOn = true;

function playTone(freq, dur=0.15, type='sine', vol=0.04){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const sfx = {
  click: () => playTone(440, 0.08, 'sine', 0.03),
  good:  () => { playTone(523, 0.12); setTimeout(()=>playTone(659,0.15),80); },
  chapter: () => { playTone(392,0.15); setTimeout(()=>playTone(523,0.2),130); setTimeout(()=>playTone(659,0.25),280); }
};

function toggleSound(){
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔊 الصوت' : '🔇 مكات';
  btn.classList.toggle('off', !soundOn);
  toast(soundOn ? 'تم تفعيل الصوت' : 'تم كتم الصوت');
}

/* ============================================================
   DOM & RENDER
   ============================================================ */
const sceneEl   = document.getElementById('scene');
const choicesEl = document.getElementById('choices');
const hudEl     = document.getElementById('hud');
const imgEl     = document.getElementById('sceneImg');
const chLabel   = document.getElementById('chapterLabel');

const scenes = {};
function def(id, opts){ scenes[id] = opts; }

function clamp(s){
  s.health   = Math.max(0, Math.min(100, s.health));
  s.hope     = Math.max(0, Math.min(100, s.hope));
  s.energy   = Math.max(0, Math.min(100, s.energy));
  s.money    = Math.max(0, s.money);
  s.humanity = Math.max(0, Math.min(100, s.humanity));
}

function addDiary(s, text, when){
  s.diary.push({ text, when: when || ('العمر: ' + s.age + ' سنة') });
}
function addStat(s, type){ s.stats[type] = (s.stats[type]||0) + 1; }

function updateHUD(){
  const repLabel = S.humanity > 65 ? 'نقي' : S.humanity < 35 ? 'قاسي' : 'متوازن';
  hudEl.innerHTML = `
    <div class="chip"><span class="lbl">العمر</span><span class="val">${S.age} سنة</span></div>
    <div class="chip"><span class="lbl">المال</span><span class="val">${S.money.toLocaleString('en-US')} ج</span></div>
    <div class="chip"><span class="lbl">الصحة</span><div class="bar"><i style="width:${S.health}%;background:var(--red)"></i></div></div>
    <div class="chip"><span class="lbl">الأمل</span><div class="bar"><i style="width:${S.hope}%;background:var(--amber)"></i></div></div>
    <div class="chip"><span class="lbl">الضمير · ${repLabel}</span><div class="bar"><i style="width:${S.humanity}%;background:var(--blue)"></i></div></div>`;
  updateInvUI();
  updateCompanionUI();
}

function showChapterBanner(ch, cb){
  const b = document.getElementById('chapterBanner');
  document.getElementById('chNum').textContent = 'الفصل ' + ch;
  document.getElementById('chTitle').textContent = CHAPTERS[ch] || '';
  b.classList.add('show');
  sfx.chapter();
  setTimeout(() => { b.classList.remove('show'); if(cb) cb(); }, 1800);
}

function setMood(mood){
  const m = MOODS[mood] || MOODS.darfur;
  imgEl.style.background = `linear-gradient(180deg, ${m.sky1} 0%, ${m.sky2} 100%)`;
  imgEl.querySelector('.mood-icon').textContent = m.icon;
}

function render(){
  const sc = scenes[S.node];
  if(!sc) return;

  if(sc.chapter && sc.chapter !== S.chapter){
    S.chapter = sc.chapter;
    chLabel.textContent = 'الفصل ' + S.chapter + ' · ' + (CHAPTERS[S.chapter]||'').split(' · ')[0];
    showChapterBanner(S.chapter);
  } else {
    chLabel.textContent = 'الفصل ' + S.chapter + ' · ' + (CHAPTERS[S.chapter]||'').split(' · ')[0];
  }

  setMood(sc.mood || 'darfur');
  if(sc.map) updateMap(sc.map);

  const text = (typeof sc.text === 'function') ? sc.text(S) : sc.text;
  sceneEl.innerHTML = text.split('\n').filter(l => l.trim()).map(l => '<p>' + l + '</p>').join('');

  sceneEl.querySelectorAll('p').forEach((p, i) => {
    setTimeout(() => { p.style.opacity = '1'; p.style.transform = 'none'; }, 60 + i * 80);
  });

  choicesEl.innerHTML = '';
  sc.choices.forEach(c => {
    if(c.if && !c.if(S)) return;
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = '<span class="bullet"></span><span>' + c.t + '</span><span class="preview">' + (c.hint||'') + '</span>';
    b.onclick = () => handleChoice(c);
    choicesEl.appendChild(b);
  });

  updateHUD();
  if(!S.visited.includes(S.node)) S.visited.push(S.node);
}

function handleChoice(c){
  sfx.click();
  if(c.do) c.do(S);
  addStat(S, 'choices');
  clamp(S);

  if(S.health <= 0 && c.to !== 'ending'){
    S.node = 'death';
  } else {
    S.node = c.to;
  }

  updateHUD();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   UI & MODAL CONTROLLERS
   ============================================================ */
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

document.getElementById('invBtn').onclick = () => openModal('invModal');
document.getElementById('marketBtn').onclick = () => { updateMarketUI(); openModal('marketModal'); };
document.getElementById('diaryBtn').onclick = () => {
  const list = document.getElementById('diaryList');
  if(S.diary.length === 0){
    list.innerHTML = '<div class="empty-msg">لم تُدون أي ذكرى بعد.</div>';
  } else {
    list.innerHTML = S.diary.map(d => `<div class="diary-entry"><div class="when">${d.when}</div>${d.text}</div>`).join('');
  }
  openModal('diaryModal');
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    toast('✅ تم حفظ تقدم اللعبة بالكامل بنجاح');
    sfx.good();
  } catch(e){ toast('❌ تعذر الحفظ'); }
}

function loadGame(){
  try{
    const data = localStorage.getItem(SAVE_KEY);
    if(!data){ toast('⚠️ لا توجد بيانات محفوظة سابقة'); return; }
    S = JSON.parse(data);
    clamp(S);
    render();
    updateInvUI();
    updateMarketUI();
    updateCompanionUI();
    toast('📂 تم استعادة تقدم اللعبة بنجاح');
    sfx.good();
  } catch(e){ toast('❌ فشل التحميل'); }
}

document.getElementById('saveBtn').onclick  = saveGame;
document.getElementById('loadBtn').onclick  = loadGame;

S = newState();
render();
updateInvUI();
updateMarketUI();
updateCompanionUI();
</script>
