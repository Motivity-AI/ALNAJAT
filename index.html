<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#15110d" media="(prefers-color-scheme:dark)">
<meta name="description" content="النجاة — لعبة قصصية عن رحلة سوداني بين حربين.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="النجاة">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23b5541c'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='%23fff' font-family='serif'%3E%D9%86%3C/text%3E%3C/svg%3E">
<title>النجاة</title>
<style>
:root{--bg:#f4efe6;--fg:#2a2118;--card:#fff;--mut:#7a6a58;--ac:#b5541c;--bd:#d9cdbb;color-scheme:light;--fs-body:clamp(15px,3.8vw,17px);--fs-title:clamp(1.8rem,7vw,2.4rem);--fs-ch:clamp(.82rem,2.8vw,.9rem);--fs-small:clamp(.72rem,2.4vw,.82rem);--fs-btn:clamp(.95rem,3.4vw,1.05rem);--r:clamp(10px,3vw,14px);--tap:max(44px,clamp(44px,12vw,52px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110d;--fg:#eee4d4;--card:#221b14;--mut:#a39482;--ac:#e0813f;--bd:#3a2f24;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI","SF Arabic","Geeza Pro","Noto Naskh Arabic",Tahoma,Arial,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:min(560px,100%);margin:0 auto;padding:clamp(10px,3vw,18px) clamp(12px,3.6vw,18px) clamp(30px,6vw,44px)}
h1{font-size:var(--fs-title);margin:clamp(18px,5vw,30px) 0 6px;color:var(--ac);line-height:1.15}
.ch{font-size:var(--fs-ch);color:var(--ac);margin:4px 0 10px;font-weight:700;line-height:1.5}
.st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:clamp(8px,2.6vw,12px);font-size:var(--fs-small)}
@media (min-width:480px){.st{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;transition:width .4s ease}
.tx{font-size:var(--fs-body);line-height:1.9;margin:clamp(14px,4vw,22px) 2px;white-space:pre-line;word-wrap:break-word;overflow-wrap:break-word;animation:f .5s}
.btn{display:block;width:100%;text-align:right;margin:8px 0;padding:clamp(12px,3.8vw,16px) clamp(12px,4vw,16px);font:inherit;font-size:var(--fs-btn);background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;min-height:var(--tap);touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:border-color .15s,transform .05s}
.btn:hover{border-color:var(--ac)}
.btn:active{transform:scale(.985);border-color:var(--ac)}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn.pri{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.pri{background:var(--ac);color:#fff;border:0;text-align:center}
.art{width:100%;height:auto;aspect-ratio:360/150;border-radius:var(--r);display:block;margin:10px 0 0;border:1px solid var(--bd)}
.fact{background:var(--card);border-inline-start:4px solid var(--ac);padding:clamp(8px,2.4vw,12px) clamp(10px,3vw,14px);border-radius:8px;font-size:var(--fs-small);line-height:1.75;color:var(--mut);margin:6px 0 12px}
#mb{position:fixed;inset-block-start:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1.1rem;cursor:pointer;z-index:5;touch-action:manipulation}
#mb:active{transform:scale(.92)}
.bt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding-inline-end:calc(var(--tap) + 8px)}
.bt button{font:inherit;font-size:var(--fs-small);padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;min-height:36px;touch-action:manipulation;white-space:nowrap}
.bt button:active{transform:scale(.96);border-color:var(--ac)}
#pn{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:9;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#pn.on{display:flex}
#pn>div{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:var(--r);padding:clamp(14px,4vw,20px);max-width:min(520px,100%);width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.it2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:var(--fs-small);flex-wrap:wrap}
.it2 button{min-height:36px;padding:6px 12px;font-size:var(--fs-small)}
#cb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,6,.94);color:#f0c27a;font-size:clamp(1.1rem,4vw,1.6rem);font-weight:700;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .5s;z-index:8;line-height:1.5}
#cb.show{opacity:1}
#tt{position:fixed;inset-block-end:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:var(--fs-small);opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:min(90%,480px);text-align:center;line-height:1.5}
#tt.on{opacity:1}
.mp{display:flex;align-items:center;gap:4px;font-size:clamp(.62rem,2.2vw,.72rem);color:var(--mut);margin:0 0 8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mp::-webkit-scrollbar{display:none}
.mp .on{color:var(--ac);font-weight:700}
.mp .ps{color:#3a8f6b}
.mp i{flex:1;min-width:8px;height:1px;background:var(--bd)}
.cp{background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:var(--fs-small);line-height:1.6;word-wrap:break-word}
.ccard{display:inline-block;background:var(--bd);padding:2px 8px;border-radius:8px;font-size:var(--fs-small);margin:2px 2px}
#ptc{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.pt{position:absolute;width:2px;height:2px;background:var(--ac);border-radius:50%;opacity:0;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(-20px);opacity:0}10%{opacity:.4}100%{transform:translateY(100vh);opacity:0}}
.warn{position:sticky;inset-block-start:0;z-index:4;margin:0 0 8px;padding:8px 12px;border-radius:10px;font-size:var(--fs-small);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;animation:f .4s}
.warn.y{background:#7a5a10;color:#fff}
.warn.r{background:#8f1e1e;color:#fff}
.warn button{background:#fff;color:#000;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:var(--fs-small);min-height:32px}
.risk{float:inline-start;background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;font-size:.7rem;margin-inline-start:6px}
.mut{color:var(--mut);font-size:var(--fs-small);line-height:1.8}
.end{border:1px solid var(--ac);border-radius:12px;padding:6px 14px}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[dir=ltr] .bt{padding-inline-end:0;padding-inline-start:calc(var(--tap) + 8px)}
[dir=ltr] .btn{text-align:left}
[dir=ltr] .fact{border-inline-start:4px solid var(--ac);border-inline-end:0}
@media (max-width:360px){#app{padding:8px 10px 24px}.st{font-size:.72rem;padding:6px}.bar{height:6px}.bt button{padding:6px 8px}}
@media (max-height:520px) and (orientation:landscape){.art{aspect-ratio:auto;height:90px}#app{padding-top:6px}h1{margin-top:8px;font-size:1.5rem}.tx{margin:10px 2px;line-height:1.7}#pn>div{max-height:calc(100vh - 20px)}}
@media (min-width:768px){#app{max-width:640px;padding-top:24px;padding-bottom:48px}.st{grid-template-columns:repeat(4,minmax(0,1fr))}.bt button{padding:8px 14px}}
@media (min-width:1024px){#app{max-width:720px}.tx{line-height:2.05}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}#ptc{display:none}}
body.perf-low .pt{display:none}
body.perf-low .bar i{transition:none}
</style>
</head>
<body>
<div id="ptc"></div>
<div id="app"></div>
<div id="pn" onclick="if(event.target===this)this.classList.remove('on')"></div>
<div id="cb"></div>
<div id="tt"></div>
<button id="mb" onclick="snd()" aria-label="الموسيقى">🔇</button>
<script>
/* ==================== DEVICE DETECTION ==================== */
const DEV=(()=>{
  const cores=navigator.hardwareConcurrency||2;
  const mem=navigator.deviceMemory||4;
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const isAndroid=/Android/.test(navigator.userAgent);
  const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
  const isLow=cores<=2||mem<=2;
  return {cores,mem,isIOS,isAndroid,isTouch,isLow};
})();
if(DEV.isLow) document.body.classList.add('perf-low');
const PARTICLE_COUNT=DEV.isLow?0:12;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ==================== STORY DATA (Arabic) ==================== */
const S={
d0:["الفصل الأول: دارفور","وُلدتَ في قرية قرب الفاشر، بين أشجار الهجليج وحقول الدخن. في ليلة الحصاد وضع أبوك في يدك سبحته الخشبية القديمة وقال: «ما دمتَ تحفظ اسمك واسم قريتك، فلن تضيع».\n\nكانت أمك تغني في الفناء، والنار تفوح بالقهوة والبخور... ثم جاء الصيف الذي تغيّر فيه كل شيء.",[["علّق السبحة حول عنقك","d0b",{p:10,F:"sb"}],["ضعها في جيبك واركض للعب","d0b",{}]]],
d1:["","أنت طفل في دارفور. كل صباح تستيقظ على صوت الرصاص ودوي الانفجارات. الليلة الماضية احترق بيت جيرانكم.\n\nقال أبوك بصوت منخفض: «لا بقاء هنا. سنرحل نحو النجاة قبل الفجر».",[["ساعد أمك في حمل الخبز والماء","d2",{f:10,F:"water"}],["ودّع كلبك الصغير","d2",{p:5}]]],
d2:["","مشيتم ليلتين. في المنعطف الثالث ظهرت سيارات بلا لوحات، وفوقها رجال ملثمون بالسلاح: الجنجويد.",[["اختبئ خلف الصخرة","d2b",{}],["تمسّك بيد أمك","d2b",{p:-5}]]],
d3:["","علت الصرخات والطلقات. وحين هدأ كل شيء، لم يبق من أسرتك أحد غيرك.\n\nأنت وحدك الآن.",[["ابقَ مختبئًا حتى يبتعدوا","jd",{p:-25,h:-10}],["اركض نحو الأشجار","jd",{p:-25,h:-20}]]],
d4:["","وراء الشجر رأيت سيارة لاند كروزر ورجلًا بزي عسكري يتحدث بالهاتف. إنه «المارشال»، يجنّد الجنجويد لحساب جهات في الجيش لزعزعة المنطقة.",[["تسلّل إلى صندوق السيارة","d5",{}],["اخرج وتوسّل إليه","x1",{}]]],
d5:["","من شقّ الصندوق سمعته يقول إنه ذاهب إلى الخرطوم: يرفع تقاريره ويستلم عمولاته وسلاحه. السيارة تهتز على الطريق، وعطشك يشتد.",[["اشرب من قارورة مهملة وخذ حقيبة إسعاف وجدتها في الصندوق","d5b",{f:10,F:"med"}],["اصبر على العطش","d5b",{f:-15,h:-10}],["اسحب دفترًا جلديًا صغيرًا لمحتَه بجانبك دون أن يراك","d5b",{p:5,F:"ldg"}]]],
d6:["","بعد أيام وصلتم العاصمة. توقفت السيارة قرب سوق. لصغر حجمك لم يلحظك أحد.\n\nقفزت وجريت.",[["تابع","m0",{}]]],
m1:["الفصل الثاني: الخرطوم","سوق صاخب. ناس تضحك وتشتري وتبيع. لا قتل ولا موت!\n\nلكن بطنك يؤلمك.",[["اطلب المال من المارة","m2",{}],["ابحث عن عمل","m3",{}]]],
m2:["","مرّ العشرات. بعضهم أشاح بوجهه، وبعضهم قال: «يلا يا ولد». لم يعطك أحد شيئًا.",[["جرّب العمل بدل التسوّل","m2b",{f:-10,p:-10}]]],
m3:["","عرض عليك صاحب مطعم صغير غسل الصحون مقابل وجبة وبعض الجنيهات.",[["اعمل بإخلاص","m3b",{f:30,m:30,h:-5}],["اعمل واخطف وجبة إضافية","m3b",{f:40,m:20,p:-5}]]],
m4:["","بعد مدة طردك صاحب المطعم، لأنه أراد مكانك لقريب له.",[["ارحل بصمت","m4b",{p:-5}],["احتجّ عليه","m4b",{p:-10,h:-5}]]],
s1:["","اشتريت بما جمعته مواد تنظيف بالتجزئة: صابون وكلور ومعطّر، وجلست على الرصيف. صار الرصيف بيتك.",[["اجلس قرب المسجد","s1b",{m:40}],["جُب الأحياء","s1b",{m:30,h:-10}]]],
s2:["","مرّت سنتان من الصيف الحارق والمطر والجوع. صار معك مبلغ لا بأس به.",[["ادّخر المبلغ","s2b",{m:20,f:-10}],["اشترِ بضاعة ووزّعها على من عرفتهم؛ يدفعون لك كل يوم","s2b",{m:50,p:10}]]],
s3:["","بعد سنة اشتريت دراجة، وصرت تبيع التسالي والفول السوداني والدوم والقنقليز، وتنام في الطرقات.",[["اعمل ليلًا ونهارًا","s3b",{m:60,h:-15}],["اعمل وخذ قسطًا من الراحة","s3b",{m:40,h:5}]]],
s4:["","بعد سنين الكفاح اشتريت ركشة وبدأت تنقل الناس.",[["انقلهم بإنصاف","s4b",{m:50,p:10}],["ارفع الأجرة على المضطرين","s4b",{m:80,p:-10}]]],
s5:["","ثم جاء اليوم الذي اشتريت فيه حافلة صغيرة «كريز». سنين وسنين وأنت تعمل عليها، ثم اشتريت بيتًا في أطراف العاصمة وحفظتَ وثائق ملكيتهما في حقيبتك.",[["تابع","s5b",{h:5,F:"docs"}]]],
s6:["","اجتهدت وتزوجت، ورُزقت بأبناء. كان البيت يضحك. نسيت أن الحزن يمكن أن يعود.\n\nوفكرت أن تشتري حافلة ثانية.",[["تابع","s6b",{}]]],
r1:["الفصل الثالث: ديسمبر","في ديسمبر 2018 اختفى الخبز من الأفران وطالت صفوف الوقود وارتفعت الأسعار. خرج الناس إلى الشوارع يهتفون: «حرية، سلام، وعدالة».\n\nتقف حافلتك قرب الميدان، وشبان كثيرون يركضون بإصابات.",[["انقل الجرحى مجانًا","r1b",{p:10,h:-10,F:"hero"}],["واصل عملك لتحمي رزقك","r1b",{m:40}]]],
r2:["","في أبريل 2019 سقط حكم البشير، وامتلأ الميدان أمام القيادة العامة بالخيام والأغاني والرسوم على الجدران. لأول مرة منذ طفولتك شعرت أن الخوف يمكن أن يُهزم.\n\nثم في الثالث من يونيو فُضّ الاعتصام بالرصاص وسقط كثيرون.",[["احتفظ بالأمل رغم كل شيء","r2b",{p:10}],["أغلق قلبك: السياسة لا تطعم أحدًا","r2b",{p:-10}]]],
q1:["","رمضان 2023. الشائعات تسري: حشود عسكرية في الأحياء، وتحرّكات ليلية، وتوتر بين الجيش وقوات الدعم السريع. الجيران يتهامسون ويخزّنون.",[["خزّن ماءً وطعامًا ووقودًا","q1b",{m:-30,F:"st"}],["لا تقلق، وأعدّ عيدًا جميلًا لأسرتك","q1b",{p:5}]]],
w1:["الفصل الرابع: الحرب مرة أخرى","في اليوم الذي اشتريتها فيه، اندلعت الحرب في الخرطوم.\n\nنفس الدوي. نفس الرائحة. نفس الخوف الذي هربت منه طفلًا.",[["ابقَ في البيت مع أسرتك","v1",{}],["اهرب بهم من الحي","v1",{}]]],
w2:["","اقتحمت المجموعات المسلحة الحي. سُرق كل ما تملك، حتى الحافلتان. طُردتم من منزلكم.\n\nوفي ساعات لا توصف فقدت زوجتك وأولادك.",[["قاوم بيدين خاليتين","x2",{}],["لا تقاوم لتبقى حيًا","e1",{p:-30}]]],
d5b:["","وسط العتمة تحرّك شيء بجانبك: ولد في سنك يُدعى عثمان، كان مختبئًا قبلك بين الأكياس وعيناه واسعتان من الخوف. همس:\n— «لا تتحرك... إن سمعنا الرجال قتلونا».\nكان يرتجف من العطش.",[["اقتسم معه قربة الماء","d5c",{p:10,F:"os",X:"water"},"water"],["اطلب منه أن يبقى معك وإن لم تملك ماءً","d5c",{p:5,F:"os"}],["ابتعد وراقبه بحذر","d5c",{p:-5}]]],
u1:["","أم درمان صباحًا: رائحة البهارات والجلود وصيحات الباعة. عند باب السوق وجدتَ ثلاث فرص في يوم واحد، ولا تتسع قوتك إلا لواحدة.",[["احمل بضائع التجار على ظهرك: تعب لكنه مال","u2",{m:60,h:-10,f:-5}],["ساعد بائعة عجوز في فرش بضاعتها مقابل وجبة وكلمة طيبة","u2",{f:20,p:10,F:"zn"}],["بِع المناديل والبخور في الزحام","u2",{m:35,p:5}]]],
u2:["","عند الغروب جلستَ تعدّ ما كسبتَ. مرّ بك رجل يبيع الدراجات المستعملة وقال: «الشاب الذي يدّخر اليوم يركب غدًا».",[["ادّخر لشراء دراجة","u3",{m:20}],["أعطِ جزءًا من مالك لمن هو أحوج منك","u3",{m:-20,p:15}]]],
g1:["","في غرفة طوارئ الحي جلس شبان من لجنة المقاومة حول كشف بأسماء الأسر: من يحتاج دواءً، من فقد أباه، من ينقصه الماء. قالت لك فتاة بحقيبة ظهر:\n— «ما معنا مال، معنا بعضنا. تعال».",[["وزّع الطعام والماء على البيوت الجريحة","g2",{f:-5,h:-5,p:15,F:"er"}],["ساعد في تسجيل الأسماء والأدوية لينتقل المرضى","g2",{p:12,F:"er"}]]],
k1:["الفصل: ود مدني","وصلتَ ود مدني بعد أيام من الطريق. المدينة التي كانت هادئة امتلأت بنازحي الخرطوم: المدارس مأوًى، وعلى الأرصفة أسر تنام، والأسعار تتضاعف كل أسبوع. لكن الناس هنا فتحوا بيوتهم وأبوابهم.\n\nولأول مرة منذ شهور سمعتَ ضحكة طفل.",[["افتح كشك شاي صغيرًا عند محطة الحافلات","jk",{m:25,p:10,F:"ks"}],["ساعد الأستاذة هالة في تعليم أطفال المأوى القراءة","jk",{p:15,F:"hl"}],["انتظر هدوءًا لا يجيء","jk",{p:-5}]]],
k2:["","ديسمبر 2023. بدأ الهمس: الجيش ينسحب، والدعم السريع على مشارف الجزيرة. ثم انفجر الخبر عند الفجر. خرج الناس مرة ثانية إلى الطرق: أمهات يحملن صغارهن، وشيوخ على العربات، وسيارات تتزاحم على الجسر.\n\nمن أول مرة شعرتَ أن الأرض تتحرك من تحتك.",[["اهرب مع آخر الحافلات نحو القضارف","gd",{h:-10,f:-10}],["ساعد عجوزًا لا تقوى على المشي حتى تلحق بالقافلة","gd",{h:-15,f:-10,p:15,F:"el"}],["اختبئ في المدرسة وانتظر أن يمرّ الوقت","w3",{p:-10}]]],
gd:["","وصلتَ القضارف ليلًا. استقبلتك مدرسة صارت مأوًى، ونام الناس على الأرض متجاورين. جلس إلى جوارك شاب يحمل راديو صغيرًا يلتقط نشرة الأخبار: هدنة؟ مفاوضات؟ لا أحد يعرف.\n\nقال لك المتطوعون: «الحرب بعيدة هنا، والخوف قريب».",[["ابقَ في المأوى وساعد المتطوعين","jg",{f:5,p:10}],["واصل نحو الحدود بحثًا عن عبور","bd",{h:-5}]]],
fs1:["الفصل: الفاشر","وصلتَ الفاشر بعد أسابيع من الطريق. المدينة التي وُلدتَ قربها محاصرة منذ شهور: لا قوافل تدخل، والسوق شبه خالٍ، والناس يطبخون أوراق الأشجار وعلف الحيوانات. طفل بجانب الطريق يسأل بصوت خافت: «معك خبز؟».",[["اقتسم ما معك مع الطفل وأمه","jf",{f:-15,p:10,F:"fk"}],["اتجه مباشرة نحو غرفة الطوارئ","jf",{p:5}]]],
fs2:["","في زقاق ضيق وجدتَ مطبخًا جماعيًا تديره غرفة طوارئ. قالت لك طبيبة شابة:\n— «ما معنا إلا قدر واحد وصبر. نحتاج متبرعين بالدم».\nعلى سرير خشبي رجل يتنفس بصعوبة.",[["تبرّع بدمك لإنقاذ المصاب ولو أنهكك ذلك","fs2b",{h:-30,p:15,F:"sac"}],["وزّع الطعام والماء على المنتظرين","fs2b",{f:-10,p:12,F:"fk"}],["خذ ما تحتاجه وارحل قبل أن يشتد الحصار","fs2b",{f:15,p:-10}]]],
fs3:["","دوّت المدافع من جديد. اقتحمت القوات الأطراف، وتحدثت التقارير لاحقًا عن مجازر وهروب جماعي. خرج الناس في الظلام يحملون صغارهم وما استطاعوا.\nنظرتَ خلفك آخر مرة، ثم تذكّرتَ وصية أبيك: «لا تلتفت».",[["ضمّد جراح من بجانبك بحقيبة الإسعاف","bd",{h:-5,p:15,F:"fk",X:"med"},"med"],["امضِ مع الجموع نحو الحدود","bd",{h:-10,f:-10}]]],
s5b:["","ليلة ممطرة على طريق أم درمان. أوقف الحافلةَ ثلاثةُ شبان ملثمين وطلبوا المفاتيح. في المقعد الخلفي امرأة حامل وطفلان نائمان، والمطر يطرق السقف.\nقال أحدهم: «انزل بهدوء ولا يصيبك شيء».",[["حاورهم: «أنا من دارفور وأعرف الجوع، فخذوا ما شئتم من جيبي واتركوا الحافلة»","r1",{p:15,F:"hum"},null,.6],["اضغط على الوقود وانطلق بأقصى سرعة","r1",{p:5},null,.5],["سلّمهم المفاتيح واحمِ من في الحافلة","r1",{m:-80,p:-10}]]],
q4:["","في الصباح نادوك إلى غرفة القائد: رجل بدين خلف مكتب خشبي، وعلى المكتب علبة سجائر ومسدس وراديو يبثّ أخبارًا. نظر إليك طويلًا وقال: «أنت من دارفور؟ لهجتك تفضحك».\nكان الصمت أثقل من الضرب.",[["أخرج الدفتر الجلدي وضعه على المكتب","p4",{p:20,h:10,F:"ld2",X:"ldg"},"ldg"],["أخرج سبحة أبيك واذكر اسمه","p4",{p:15},"sb"],["قل إنك سائق لا شأن لك","p4",{p:-5}],["حدّثه عن أبنائك الذين فقدتهم","p4",{p:10,h:-5}]]],
d3b:["","في اليوم الثالث لمحتَ راعيًا عجوزًا اسمه آدم يسوق عنزات هزيلة. ناولك حفنة تمر وقال: «يا ولدي، أرى سيارة بلا لوحات تمرّ كل أسبوع. لا تقترب من الرجال الذين يضحكون وبأيديهم أسلحة».",[["اسمع نصيحته وابقَ معه ليلة","d4",{p:10,f:10,F:"ad"}],["اشكره وامضِ وحدك","d4",{}]]],
s6c:["","يوم جمعة على ضفة النيل عند المقرن، حيث يلتقي الأزرق بالأبيض. يوسف يطارد كرة، ومريم تبني بيتًا من الرمل وتقول: «هذا بيتنا الجديد يا بابا». ضحكت آمنة بصوت عالٍ لأول مرة منذ شهور.",[["اشترِ لهم الآيس كريم وعلّمهم السباحة","s6d",{p:12,m:-15,F:"joy"}],["ابقَ على العتبة تحسب الديون","s6d",{m:20,p:-5}]]],
d0b:["","جدّتك حواء تجلس تحت شجرة الهجليج وتحكي للأطفال حكاية «الشجرة التي لا تُقطع»: كلما قطعها الغزاة نبتت من جذورها.\n— «الناس مثلها يا ولدي. اقطعهم ينبتون في مكان آخر».\nثم تهمس: «إن اضطررتَ للرحيل فاحمل اسمك معك».",[["اسألها: وماذا لو لم تبقَ لي جذور؟","d0c",{p:10,F:"gr"}],["ضع رأسك على كتفها صامتًا","d0c",{p:5,h:5}]]],
m3b:["","في المطبخ كان الطباخ عمّ إدريس، عجوز بلا أسنان تقريبًا، يراقبك وأنت تغسل. في آخر الليل ناولك صحنًا من العدس وقال:\n— «تغسل كأنك تهرب من شيء. الرزق صبر يا ولد. من أين أنت؟»\nلم تعرف هل تقول الحقيقة.",[["احكِ له كل شيء عن دارفور","m3c",{p:10,f:10,F:"id"}],["قل إنك يتيم من الأطراف وكفى","m3c",{p:-5}]]],
s1b:["","في الليالي الباردة كان ينام بجانبك على الرصيف ولد في سنك اسمه سلمان، يبيع المناديل. اقتسم معك غطاءً ممزقًا وقال:\n— «في الشارع من لا أحد له يصير أخًا لمن لا أحد له».",[["اقتسم معه ما تربحه كل يوم","js",{m:-15,p:15,F:"sl"}],["احتفظ بمالك: الأمان أولًا","js",{m:10,p:-10}]]],
s6b:["","مساء الجمعة جلست زوجتك آمنة على عتبة الدار والأولاد، يوسف ومريم، يتسابقون في حلّ واجباتهم تحت ضوء المصباح. سألتك بهدوء:\n— «أراك أحيانًا تحدّق في الفراغ. ما الذي تحمله وحدك؟»\nضحك الصغار من بعيد، وكان قلبك ثقيلًا.",[["احكِ لها عن دارفور وعن أهلك","s6c",{p:15,F:"told"}],["ابتسم وغيّر الحديث: الماضي ماضٍ","s6c",{p:-5}]]],
h1:["","في فصل من المدرسة حوّل متطوعون غرفة إلى مستشفى ميداني بلا كهرباء، يعملون على ضوء الهواتف. نادتك الطبيبة الشابة نهى بعينين محمرّتين من السهر:\n— «أحتاج يدين إضافيتين. المصابون كثر والدواء لا يكفي».\nرأيت طفلًا محمومًا وأمه تبكي.",[["ساعد في حمل المصابين وتهدئة الأطفال","h2",{h:-10,p:15,F:"dr"}],["ابتعد: لا طاقة لك على رؤية المزيد","h2",{p:-10,h:5}]]],
q3:["","جاءوا بفتى في الخامسة عشرة اسمه ياسر، يرتجف. ضربه حارس لأنه طلب ماءً. نظر إليك كمن يبحث عن أبٍ يحتمي به.",[["ضمّه إليك وتحمّل الضرب عنه","p2",{h:-15,p:20,F:"ys"}],["ابتعد حتى لا تُضرب","p2",{p:-15}]]],
z1:["","في الطريق مررت بحيّك القديم: سور بيتك مثقوب بالرصاص والباب مخلوع. وجدتَ في الركن حقيبة مدرسية صغيرة مغطاة بالغبار عليها اسم «مريم».\n\nجلستَ على العتبة طويلًا.",[["احملها معك","o1c",{p:10,F:"bag"}],["اتركها: لا تحتمل أن تحملها","o1c",{p:-5}]]],
bd:["","وقفتَ أمام مفترق الطرق الأخير. ثلاث وجهات، ولكل منها ثمنها:",[["🇪🇬 شمالًا نحو مصر مع وثائقك","jb",{h:-10,f:-10,C:"eg",F:"b"},"docs"],["🇪🇬 شمالًا نحو مصر بلا وثائق، عبر مهرّب","jb",{h:-25,f:-20,C:"eg",F:"b"},"!docs"],["🇹🇩 غربًا نحو تشاد عبر أرض دارفور","jb",{h:-20,f:-15,p:10,C:"td",F:"b"}],["🇸🇸 جنوبًا مع النيل الأبيض نحو جنوب السودان","jb",{h:-15,f:-15,p:5,C:"ss",F:"b"}]]],
e1:["الحصار والنزوح","لجأتَ مع عشرات الهاربين إلى مدرسة مهجورة في الحي. انقطعت الكهرباء ثم المياه ثم شبكة الهاتف، وصارت الأسواق نهبًا.\n\nجاءتك جارتك أم حسن، امرأة ستينية كانت تبيع الشاي عند ناصية الشارع، وفي يدها وعاء صغير:\n— «يا ولدي، البئر عند آخر الحي ما زال فيه ماء، لكن القنّاصة يراقبون الطريق. حفيدي عطشان».\n\nنظرتَ إلى جالونك شبه الفارغ.",[["شاركها مياهك واذهب معها إلى البئر","je",{f:-10,h:-10,p:15,F:"um"}],["اعتذر: لا يكفيك أنت","je",{p:-15,f:5}],["انضم إلى غرفة طوارئ الحي التي بدأها الشباب","g1",{p:10}]]],
e2:["","اجتمع الناس على حافلة صغيرة نحو ود مدني. عند الحاجز الأخير وقف شاب مسلح يطلب الهويات والهواتف، ثم نظر إلى وجهك وقال بنبرة تتغيّر:\n— «من أين أنت؟».\n\nصمت الركاب.",[["أجب بهدوء وبلا تحدٍّ","t1",{h:-10}],["اعرض وثائقك لتثبت من أنت","t1",{p:5},"docs"],["ارفع صوتك محتجًّا","x4",{}],["قف بين أم حسن وبينه واحمِها","t1",{p:15,h:-15},"um"]]],
q2:["","في الليل همس لك رجل نحيل بنظارات مكسورة:\n— «أنا الأستاذ صلاح، كنت مدرّس تاريخ في أم درمان. هنا يريدون أن ننسى أسماءنا، فلنحفظها. أنا صلاح. وأنت؟»",[["قل له اسمك واسم قريتك كما علّمك أبوك","q3",{p:15}],["اصمت، فالثقة هنا خطر","q3",{p:-5}]]],
w3:["","اقتادك الجنجويد إلى معسكر وسجنوك فيه. لا أحد يعرف أنك هنا.",[["تابع","v3",{}]]],
p1:["الفصل الخامس: السجن","زنزانة مزدحمة، رغيف واحد لكل خمسة رجال. بجانبك جريح يئنّ.",[["اقتسم رغيفك معه","q2",{f:-15,p:15,F:"sh"}],["كل رغيفك وحدك","q2",{f:10,p:-15}]]],
p2:["","جاء حارس يبحث عن من يحفر خندقًا، والمتخلّف يُضرب.",[["تطوّع للعمل","jp",{f:15,h:-20}],["اختبئ بين الناس","jp",{h:-10,p:-5}]]],
p3:["","حارس شاب منهك يجلس بعيدًا ويحدّث نفسه. يبدو أنه تعب من هذه الحرب.",[["حدّثه بهدوء وذكّره بأمّه","q4",{p:15}],["اسرق مفتاحه","p4",{p:10,h:5},null,.4,"x3"],["تظاهر بالمرض","q4",{h:-5}],["أخرج سبحة أبيك وحدّثه عن أبيك","q4",{p:20},"sb"]]],
p4:["","في الليل أصاب قصف جدار السجن، وانفتحت ثغرة صغيرة.",[["اهرب الآن","z0",{h:-15},null,.65,"x8"],["انتظر، وخطّط مع رفيقين","z0",{p:10,h:-5}]]],
o1:["الفصل السادس: الخرطوم الجريحة","خرجت إلى مدينة مدمّرة. لا بيت ولا مال ولا أسرة. الجوع ينهش.",[["اذهب إلى مطبخ جماعي (تكية) يديره متطوعون","z1",{f:25,p:10}],["ابحث عن طعام بين الأنقاض","z1",{f:10,h:-15}]]],
o2:["","اشتد الحصار وقلّ الغذاء. تسمع همسًا عن مفاوضات وهدنة، وربما سلام.",[["ساعد المتطوعين في توزيع الماء والخبز","fin",{p:15,f:5,h:-10}],["اعبر الحدود: اختر وجهتك","bd",{p:5}],["اجلس وانتظر","fin",{p:-10}],["عُد نحو الفاشر مسقط رأسك لتبحث عمّن بقي","fs1",{h:-10,f:-10,p:5}]]]

N("d0c","تحت شجرة الطلح كان الأستاذ بابكر يعلّم الأطفال الحروف بقطعة فحم على لوح خشبي. كتبتَ اسمك لأول مرة وضحك الصبية.\n— «من يعرف أن يكتب اسمه لا يستطيع أحد أن ينتزعه منه».","d0d","تتعلم الحروف بجدّ","تتشاجر مع صديقك طارق على اللوح",{p:5},{p:-3});
N("d0d","في المساء جلستَ مع صديقك طارق على سطح الدار تعدّان النجوم. قال: «حين أكبر سأصير طيارًا وآخذك إلى الخرطوم». لم يكن أحدكما يعرف أن هذا المساء هو الأخير.","d1","وعدته بأن تلقاه يومًا","ابتسمتَ ولم تقل شيئًا",{p:5,F:"tq"},{});
N("d2b","قبل أن تنقضّ العصابة همست لك أمك: «إن ضعنا فاذهب إلى خالك في الفاشر. اسمه موسى».","d3","احفظ الاسم في قلبك","قل لها: لن نضيع",{p:3,F:"kh"},{p:5});
N("d5c","عند حاجز في الطريق أوقف المسلحون السيارة وطلبوا إتاوة. وضع المارشال حزمة نقود في يد القائد وضحكا معًا. أدركتَ أن الدولة التي في الأخبار ليست التي يراها الناس.","d5d","اكتم أنفاسك ولا تتحرك","اختلس النظر لتحفظ الوجوه",{},{p:3});
N("d5d","طال الليل في الصندوق. سمعتَ أنين طفل بعيد فاضطربت. تذكرتَ أمك: «اجرِ.. لا تلتفت»، فضممتَ السبحة على صدرك.","d6","ابكِ بصمت","احفظ الطريق: أين انعطفنا؟ كم مرّ من الوقت؟",{p:-5,h:-2},{p:5});
N("m0","هبطتَ من السيارة والمدينة تدور بك. أول ما رأيته شيئًا لم تره في حياتك: إشارة مرور حمراء، وكل السيارات تقف معًا بلا أمر من أحد.","m1","تحدّق مذهولًا","تمسح وجهك وتمشي",{p:3},{});
N("m2b","رأيتَ صبيًا يسرق محفظة من رجل مشغول، ثم نظر إليك وقال: «لا تخبر أحدًا!»","m3","تصمت","تحذّر الرجل",{p:-3},{p:5,h:-5});
N("m3c","ذات يوم جاء مفتش البلدية يسأل عن أوراق العمال. أخفاك عمّ إدريس في المخزن بين أكياس الدقيق حتى مضى.","m4","اشكره","اسأله عن أهله",{p:5},{p:3});
N("m4b","هطل المطر ليلتها ولم يكن لك مأوى. التجأتَ تحت جسر مع متشردين آخرين، وأعطاك رجل نصف كيس بلاستيك تتقي به البلل.","s1","اشكره واجلس بجانبه","ابتعد وابحث عن زاوية لك",{p:8,h:-3},{h:-8});
N("s1c","جاء رجل يعرض عليك العمل في ورشة براتب ثابت، لكن بلا حرية: من الفجر إلى الليل.","s2","اقبل","ارفض وابقَ حرًا",{m:40,p:-3},{p:5});

function trackChapter(n){const ch=CHAPTERS.find(c=>c.id===n);if(!ch)return;const u=unlockedChapters();if(!u.includes(n)){u.push(n);try{localStorage.setItem("najat_chapters",JSON.stringify(u))}catch(e){};if(u.length>1)toast("📖 "+(LG==="en"?"Chapter unlocked":"فُتح فصل جديد"))}}
function chapterLabel(n){const cur=CHAPTERS.find(c=>c.id===n);if(cur)return LG==="en"?cur.en:cur.ar;const pri=CHAPTERS.filter(c=>MPI(c.id)<=MPI(n));const near=pri[pri.length-1];return near?(LG==="en"?near.en:near.ar):"—"}

/* ==================== SAVES ==================== */
const SAVE_KEY="najat_saves_v2";
function getSaves(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"{}")}catch(e){return{}}}
function writeSaves(o){try{localStorage.setItem(SAVE_KEY,JSON.stringify(o));return true}catch(e){toast("⚠️ مساحة التخزين ممتلئة");return false}}
function cloneState(){return {s:{...s,dy:[...(s.dy||[])],jc:{...(s.jc||{})}},snap:snap?{id:snap.id,s:{...snap.s,dy:[...(snap.s.dy||[])],jc:{...(snap.s.jc||{})}}}:null,id,time:Date.now()}}
let autoSaveTimer=0;
function autoSave(){clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>{if(!s||!id)return;const sv=getSaves();sv.auto=cloneState();writeSaves(sv)},250)}
function sv(){showSlots("save")}
function ld(){showSlots("load")}
function showSlots(mode){
  const saves=getSaves();const e=document.getElementById("pn");
  const title=mode==="save"?(LG==="en"?"Save Game":"حفظ اللعبة"):(LG==="en"?"Load Game":"تحميل اللعبة");
  let h=`<h3>${mode==="save"?"💾":"📂"} ${title}</h3>`;
  if(mode==="load"&&saves.auto){
    const chName=chapterLabel(saves.auto.id);
    const date=new Date(saves.auto.time).toLocaleString(LG==="en"?"en":"ar");
    h+=`<div class="it2" style="background:rgba(181,84,28,.08);border-radius:8px;padding:10px;margin-bottom:6px"><span><b>⚡ ${LG==="en"?"Auto-save":"الحفظ التلقائي"}</b><br><small>${chName}<br>${date}<br>❤ ${saves.auto.s.h} · 🍞 ${saves.auto.s.f} · 💰 ${saves.auto.s.m}</small></span><button class="btn pri" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="loadFromSlot('auto')">${LG==="en"?"Load":"تحميل"}</button></div>`;
  }
  for(let i=1;i<=3;i++){
    const key="slot"+i;const sl=saves[key];
    const label=LG==="en"?`Slot ${i}`:`الخانة ${i}`;
    if(sl){
      const chName=chapterLabel(sl.id);const date=new Date(sl.time).toLocaleString(LG==="en"?"en":"ar");
      h+=`<div class="it2"><span><b>${label}</b><br><small>${chName}<br>${date}<br>❤ ${sl.s.h} · 🍞 ${sl.s.f} · 💰 ${sl.s.m}</small></span><div style="display:flex;gap:4px;flex-wrap:wrap">${mode==="save"?`<button class="btn" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="saveToSlot(${i})">${LG==="en"?"Overwrite":"استبدال"}</button>`:""}${mode==="load"?`<button class="btn pri" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="loadFromSlot('${key}')">${LG==="en"?"Load":"تحميل"}</button>`:""}<button class="btn" style="width:auto;margin:0;min-height:36px;padding:6px 10px" onclick="delSlot('${key}')" aria-label="Delete">🗑️</button></div></div>`;
    } else {
      h+=`<div class="it2" style="opacity:.7"><span><b>${label}</b><br><small>${LG==="en"?"Empty":"فارغ"}</small></span>${mode==="save"?`<button class="btn" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="saveToSlot(${i})">${LG==="en"?"Save here":"احفظ هنا"}</button>`:""}</div>`;
    }
  }
  h+=`<button class="btn pri" onclick="document.getElementById('pn').classList.remove('on')">${LG==="en"?"Close":"إغلاق"}</button>`;
  e.innerHTML=`<div>${h}</div>`;e.classList.add("on");
}
function saveToSlot(n){if(!s||!id){toast(LG==="en"?"Nothing to save":"لا يوجد ما يُحفظ");return}const svs=getSaves();svs["slot"+n]=cloneState();if(writeSaves(svs)){toast((LG==="en"?"✅ Saved to slot ":"✅ حُفظ في الخانة ")+n);showSlots("load")}}
function loadFromSlot(key){
  const svs=getSaves();const sl=svs[key];
  if(!sl){toast(LG==="en"?"Empty slot":"الخانة فارغة");return}
  s={...sl.s,dy:[...(sl.s.dy||[])],jc:{...(sl.s.jc||{})}};s.e??=90;s.c??=60;id=sl.id;
  snap=sl.snap?{id:sl.snap.id,s:{...sl.snap.s,dy:[...(sl.snap.s.dy||[])],jc:{...(sl.snap.s.jc||{})}}}:null;
  document.getElementById("pn").classList.remove("on");
  renderNode(id);toast(LG==="en"?"📂 Loaded":"📂 تم التحميل");
}
function delSlot(key){const msg=LG==="en"?"Delete this save?":"حذف هذا الحفظ؟";if(!confirm(msg))return;const svs=getSaves();delete svs[key];writeSaves(svs);showSlots("load")}
function continueGame(){const svs=getSaves();const all=[];if(svs.auto)all.push({key:"auto",...svs.auto});["slot1","slot2","slot3"].forEach(k=>{if(svs[k])all.push({key:k,...svs[k]})});if(!all.length){toast(LG==="en"?"No save found":"لا يوجد حفظ");return}all.sort((a,b)=>b.time-a.time);loadFromSlot(all[0].key)}
(function migrateOld(){try{const old=localStorage.getItem("najat");if(!old)return;const svs=getSaves();if(svs.slot1||svs.auto)return;const d=JSON.parse(old);if(d&&d.s&&d.id){svs.slot1={s:d.s,snap:{id:d.id,s:{...d.s}},id:d.id,time:Date.now()};writeSaves(svs);toast("📦 نُقل حفظك القديم إلى الخانة 1")}}catch(e){}})();
/* ==================== ENGLISH TRANSLATIONS (all ~98 scenes) ==================== */
const EN={
d0:["You were born in a village near Al-Fashir, among heglig trees and millet fields. On harvest night your father placed his old wooden prayer beads in your hand and said: “As long as you remember your name and your village, you will not be lost.”\n\nYour mother sang in the courtyard, the fire smelling of coffee and incense... then came the summer that changed everything.",["Hang the beads around your neck","Put them in your pocket and run off to play"]],
d0b:["Your grandmother Hawa sits under the heglig tree telling children the tale of 'the tree that cannot be cut': whenever invaders cut it, it grows back from its roots.\n— 'People are like it, my son. Cut them down and they grow elsewhere.'\nThen she whispers: 'If you must leave, carry your name with you.'",["Ask her: what if I have no roots left?","Rest your head on her shoulder in silence"]],
d0c:["Under the talh tree, Ustadh Babakr taught children letters with charcoal on a wooden board. You wrote your name for the first time and the boys laughed.\n— 'Whoever knows how to write his name, no one can take it from him.'",["Learn letters diligently","Fight with your friend Tariq over the board"]],
d0d:["In the evening you sat with your friend Tariq on the roof counting stars. He said: 'When I grow up I'll be a pilot and take you to Khartoum.' Neither of you knew this evening would be the last.",["Promise him you'll meet one day","Smile and say nothing"]],
d1:["You are a child in Darfur. Every morning you wake to gunfire and explosions. Last night your neighbors' house burned.\n\nYour father said quietly: 'We cannot stay. We leave before dawn.'",["Help your mother carry bread and water","Say goodbye to your puppy"]],
d2:["You walked two nights. At the third bend, cars with no plates appeared, masked men with weapons above them: the Janjaweed.",["Hide behind the rock","Hold your mother's hand tight"]],
d2b:["Before the gang descended, your mother whispered: 'If we're separated, go to your uncle in Al-Fashir. His name is Musa.'",["Keep the name in your heart","Tell her: we won't be lost"]],
d3:["Screams and gunshots rose. When it went quiet, no one of your family was left but you.\n\nYou are alone now.",["Stay hidden until they leave","Run toward the trees"]],
d3b:["On the third day you noticed an old herder named Adam driving thin goats. He handed you a handful of dates and said: 'My son, I see a car with no plates pass every week. Don't go near men who laugh with weapons in their hands.'",["Listen to his advice and stay with him a night","Thank him and continue alone"]],
d4:["Behind the trees you saw a Land Cruiser and a man in uniform on the phone. He is the 'Marshal', recruiting Janjaweed for factions in the army to destabilize the region.",["Sneak into the car trunk","Come out and beg him"]],
d5:["Through a gap in the trunk you heard him say he was heading to Khartoum: filing reports and collecting commissions and weapons. The car shakes on the road; your thirst grows.",["Drink from a discarded bottle and take a first-aid kit","Endure the thirst","Slip out a small leather notebook"]],
d5b:["In the dark, something moved beside you: a boy your age named Uthman, hiding before you, eyes wide with fear. He whispered:\n— 'Don't move... if the men hear us, they'll kill us.'\nHe was trembling with thirst.",["Share your water flask with him","Ask him to stay with you even without water","Move away and watch him carefully"]],
d5c:["At a checkpoint the gunmen stopped the car and demanded a toll. The Marshal placed a bundle of cash in the commander's hand and they laughed together. You realized the state in the news is not the one people see.",["Hold your breath and don't move","Steal a look to memorize faces"]],
d5d:["The night dragged on in the trunk. You heard a distant child's moan and grew agitated. You remembered your mother: 'Run... don't look back.' You pressed the prayer beads to your chest.",["Weep silently","Memorize the route: where did we turn? how much time passed?"]],
d6:["After days you reached the capital. The car stopped near a market. Too small to be noticed, you jumped out and ran.",["Continue"]],
m0:["You climbed out of the car and the city spun. The first thing you saw was something you'd never seen: a red traffic light, and all the cars stopping together with no order from anyone.",["Stare in astonishment","Wipe your face and walk"]],
m1:["A noisy market. People laughing, buying, selling. No killing, no death!\n\nBut your stomach hurts.",["Ask passersby for money","Look for work"]],
m2:["Dozens passed. Some turned away, some said 'Yalla boy.' No one gave you anything.",["Try work instead of begging"]],
m2b:["You saw a boy steal a wallet from a busy man, then look at you and say: 'Don't tell anyone!'",["Stay silent","Warn the man"]],
m3:["A small restaurant owner offered you dishwashing for a meal and some pounds.",["Work honestly","Work and sneak an extra meal"]],
m3b:["In the kitchen, the cook Uncle Idris — nearly toothless — watched you wash. Late at night he handed you a plate of lentils and said:\n— 'You wash like you're running from something. Livelihood is patience, boy. Where are you from?'\nYou didn't know whether to tell the truth.",["Tell him everything about Darfur","Say you're just an orphan from the outskirts"]],
m3c:["One day the municipality inspector came asking about work permits. Uncle Idris hid you in the storeroom between flour sacks until he left.",["Thank him","Ask about his family"]],
m4:["After a while the restaurant owner dismissed you, wanting your place for a relative.",["Leave in silence","Protest"]],
m4b:["It rained that night and you had no shelter. You took refuge under a bridge with other homeless, and a man gave you half a plastic bag to shield from the rain.",["Thank him and sit beside him","Move away and find a corner of your own"]],
s1:["With what you saved you bought cleaning supplies in retail: soap, chlorine, and perfume, and sat on the pavement. The pavement became your home.",["Sit near the mosque","Walk the neighborhoods"]],
s1b:["On cold nights, a boy your age named Salman, who sold tissues, slept beside you on the pavement. He shared a torn blanket and said:\n— 'On the street, the one with no one becomes a brother to the one with no one.'",["Share with him what you earn each day","Keep your money: safety first"]],
s1c:["A man offered you work in a workshop at a fixed wage, but with no freedom: dawn to dusk.",["Accept","Refuse and stay free"]],
s2:["Two years passed of scorching summer, rain, and hunger. You had a decent sum.",["Save the money","Buy goods and distribute them to those you know; they pay you daily"]],
s2b:["A merchant offered a high-interest loan to expand your trade. He said: 'The opportunity won't come again.'",["Refuse: no debts","Accept"]],
s3:["After a year you bought a bicycle, selling snacks, peanuts, doum, and qanqliz, sleeping on the roads.",["Work day and night","Work and rest a little"]],
s3b:["On the bicycle a speeding car hit you at a bend. You got up with a cut on your knee.",["Tend the wound and rest two days","Keep working despite the pain"]],
s4:["After years of struggle you bought a rickshaw and began carrying people.",["Carry them fairly","Raise the fare on those forced to ride"]],
s4b:["In the rickshaw a bleeding woman climbed in and asked for the nearest hospital. The road was crowded.",["Cut through traffic carefully","Take the rough back road"]],
s4c:["A month later the woman came with a bag of fruit: 'My baby was born after you brought me.' You didn't understand why you wept.",["Refuse the fruit","Accept it and smile"]],
s5:["Then came the day you bought a small 'Kreiz' bus. Years on years working on it, then you bought a house on the capital's edge, keeping both ownership documents in your bag.",["Continue"]],
s5b:["A rainy night on the Omdurman road. Three masked youths stopped the bus and demanded the keys. In the back seat a pregnant woman and two sleeping children; rain tapped the roof.\nOne said: 'Get down quietly and no harm will come.'",["Talk to them: 'I'm from Darfur and know hunger. Take what you want from my pocket and leave the bus.'","Floor the accelerator and speed away","Hand over the keys and protect those inside"]],
s6:["You worked hard and married, and were blessed with children. The house laughed. You forgot that sorrow could return.\n\nAnd you thought of buying a second bus.",["Continue"]],
s6b:["Friday evening, your wife Amina sat on the doorstep while Yusuf and Maryam raced through homework under the lamp. She asked quietly:\n— 'Sometimes I see you staring into space. What are you carrying alone?'\nThe children laughed in the distance, and your heart was heavy.",["Tell her about Darfur and your family","Smile and change the subject: the past is past"]],
s6c:["A Friday on the Nile bank at Al-Mogran, where the Blue and White meet. Yusuf chases a ball, Maryam builds a sand house saying 'This is our new home, Papa.' Amina laughed out loud for the first time in months.",["Buy them ice cream and teach them to swim","Stay at the threshold counting debts"]],
s6d:["Yusuf was born on a rainy night and Maryam came two years after. You held each in your rough hands and whispered their names into their ears as your father once did.",["Write their names on the wall","Hang your father's prayer beads above their bed"]],
r1:["Chapter 3: December","In December 2018 bread vanished from bakeries, fuel queues lengthened, and prices soared. People poured into the streets chanting: 'Freedom, peace, and justice.'\n\nYour bus stands near the square, and many youths run by wounded.",["Carry the wounded for free","Continue your work to protect your livelihood"]],
r1b:["In the square at night a young man sang in a hoarse voice and people echoed. A student handed you a can of paint: 'Paint what you dream on the wall.'",["Draw a tree","Write your father's name"]],
r2:["In April 2019 al-Bashir's rule fell, and the square before the General Command filled with tents, songs, and graffiti. For the first time since childhood you felt fear could be defeated.\n\nThen on June 3 the sit-in was dispersed with bullets and many fell.",["Keep hope despite everything","Close your heart: politics feeds no one"]],
r2b:["Years later in the vegetable market, a woman arguing politely with a cheating scale vendor caught your eye. It was Amina.\n— 'Don't stare — I know I'm staring.'",["Smile and apologize","Help her carry her bags"]],
q1:["Ramadan 2023. Rumors spread: military crowds in neighborhoods, night movements, tension between the army and the RSF. Neighbors whisper and stock up.",["Stock water, food, and fuel","Don't worry, and prepare a beautiful Eid for your family"]],
q1b:["The day before the war, you held a simple dinner: lentils, bread, and tea. Maryam laughed as she spilled the tea, and Yusuf slept on your shoulder.",["Wish the day would last","Capture every face in your memory"]],
w1:["Chapter 4: War Again","The day you bought it, war broke out in Khartoum.\n\nThe same roar. The same smell. The same fear you fled as a child.",["Stay home with your family","Flee the neighborhood with them"]],
v1:["At dawn the internet cut and the walls shook. Your neighbors' voice came: 'War!' The children dressed, weeping.",["Hold Amina's hand","Check the doors and gather documents"]],
v2:["On the fourth night, armed men stormed the neighborhood. You heard violent knocking at the door.",["Open the door to protect the family","Hide with your family in the back room"]],
w2:["Armed groups stormed the neighborhood. Everything you owned was stolen, even both buses. You were driven from your home.\n\nIn hours beyond describing you lost your wife and children.",["Resist with bare hands","Do not resist, to stay alive"]],
w3:["The Janjaweed took you to a camp and imprisoned you there. No one knows you are here.",["Continue"]],
v3:["You were thrown into a dark truck bed with other men. The road was long and the air heavy; one whispered: 'My name is Hamid, I was a teacher.' You felt you were not alone.",["Introduce yourself","Stay silent and watch"]],
u1:["Omdurman at morning: the smell of spices and leather, the calls of vendors. At the market gate you found three chances in one day, but your strength can only carry one.",["Carry merchants' goods on your back: tiring but pays","Help an old woman set up her stall for a meal and a kind word","Sell tissues and incense in the crowd"]],
u2:["At sunset you counted your earnings. A man selling used bicycles passed by and said: 'The youth who saves today rides tomorrow.'",["Save up to buy a bicycle","Give part of your money to someone needier"]],
u3:["Eid came. Vendors hung small flags on the pavement and you adjusted your only clothes. A family passed and their little girl gave you a piece of candy.",["Share it with Salman","Keep it for a coming day"]],
u4:["Suddenly municipal vehicles rushed in: 'The sweep!' Vendors fled, tables overturned, and one of them grabbed your hand.",["Leave your goods and run","Carry as much as you can and run"]],
g1:["In the neighborhood's emergency room, young men from the Resistance Committee sat around a list of families: who needs medicine, who lost their father, who lacks water. A girl with a backpack told you:\n— 'We have no money, we have each other. Come.'",["Distribute food and water to wounded homes","Help record names and medicines so patients get through"]],
g2:["You wrote on the wall the names of families needing medicine. A boy came and asked: 'Will you stay with us?'",["Promise you will stay","Tell him: I'll do what I can"]],
h1:["In a school classroom, volunteers turned a room into a field hospital with no electricity, working by phone light. Young Dr. Noha, eyes red from sleeplessness, called you:\n— 'I need extra hands. The wounded are many and the medicine is not enough.'\nYou saw a feverish child and his mother weeping.",["Help carry the wounded and calm the children","Step away: you can't bear to see more"]],

e1:["Chapter: Siege and Displacement","You and dozens of escapees took refuge in an abandoned school in the neighborhood. Power, then water, then the phone network cut off; markets were looted.\n\nYour neighbor Umm Hasan, a sixty-year-old who sold tea at the corner, came with a small bowl:\n— 'My son, the well at the end of the neighborhood still has water, but the sniper watches the road. My grandson is thirsty.'\n\nYou looked at your nearly empty jerrycan.",["Share your water and go with her to the well","Apologize: it's barely enough for you","Join the neighborhood emergency room the youth started"]],

/* ==================== TRANSLATION HELPERS ==================== */
let LG="ar";
try{LG=localStorage.getItem("najat_lang")||"ar"}catch(e){}
function tr(t){return LG==="en"&&UI[t]?UI[t]:t}
function txt(n){if(LG==="en"&&EN[n])return EN[n][0];return S[n]?S[n][1]:""}
function choiceLabel(n,i){
  if(LG==="en"&&EN[n]&&EN[n][1]&&EN[n][1][i])return EN[n][1][i];
  const c=S[n]&&S[n][2]&&S[n][2][i];
  return c?c[0]:"";
}
function statL(k){const m={h:["الصحة","Health"],f:["الشبع","Food"],p:["الأمل","Hope"],e:["الطاقة","Energy"],c:["الضمير","Conscience"],m:["المال","Money"]};return LG==="en"?m[k][1]:m[k][0]}
function statColor(k,v){if(["h","f","p","e","c"].includes(k)){if(v>=60)return "#3a8f6b";if(v>=30)return "#c9a227";return "#b33a3a"}return "#b5541c"}

/* ==================== STATE + EFFECTS ==================== */
let s=null,id=null,snap=null,curChoices=[];
function cloneS(o){return o?{...o,dy:[...(o.dy||[])],jc:{...(o.jc||{})}}:null}
function applyEffects(eff){
  if(!eff)return;
  for(const k in eff){
    const v=eff[k];
    if(k==="F"){s[v]=true}
    else if(k==="X"){s[v]=false}
    else if(k==="C"){s.C=v}
    else{s[k]=(s[k]||0)+v}
  }
  s.h=Math.max(0,Math.min(100,s.h||0));
  s.f=Math.max(0,Math.min(100,s.f||0));
  s.p=Math.max(0,Math.min(100,s.p||0));
  s.e=Math.max(0,Math.min(100,s.e||0));
  s.c=Math.max(0,Math.min(100,s.c||0));
  s.m=Math.max(0,s.m||0);
}
function avail(c){
  const cond=c[3];
  if(!cond)return true;
  if(typeof cond==="string"){if(cond[0]==="!")return !s[cond.slice(1)];return !!s[cond]}
  return true;
}

/* ==================== ART FUNCTION ==================== */
function art(n){
  const k=K(n),c=AC[k]||AC.desert;
  return `<svg class="art" viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="360" height="150" fill="url(#g)"/>${AE[k]||""}${(s&&s.h<35)?`<rect width="360" height="150" fill="#400" opacity=".28"/>`:""}${k==="war"||k==="night"?ASH:""}</svg>`;
}

/* ==================== RENDERING ==================== */
function statBar(k){const v=s[k]||0;return `<div><div style="display:flex;justify-content:space-between"><span>${statL(k)}</span><span>${v}</span></div><div class="bar"><i style="width:${v}%;background:${statColor(k,v)}"></i></div></div>`}
function renderStats(){return `<div class="st">${statBar("h")}${statBar("f")}${statBar("p")}${statBar("e")}${statBar("c")}<div><div style="display:flex;justify-content:space-between"><span>${statL("m")}</span><span>${s.m||0}</span></div></div></div>`}
function topBar(){return `<div class="bt">
  <button onclick="openJournal()">${tr("📔 المذكرات")}</button>
  <button onclick="openShop()">${tr("🛒 السوق")}</button>
  <button onclick="openTimeline()">${tr("🕰️ الأحداث")}</button>
  <button onclick="sv()">${tr("💾 حفظ")}</button>
  <button onclick="ld()">${tr("📂 تحميل")}</button>
  <button onclick="undo()">↩️</button>
  <button onclick="showMenu()">☰</button>
</div>`}
function renderNode(nid){
  if(!S[nid]){toast("⚠️ عقدة غير موجودة");return}
  id=nid;trackChapter(nid);mood(K(nid));
  if(DY[nid]&&!(s.dy||[]).includes(DY[nid])){s.dy=s.dy||[];s.dy.push(DY[nid])}
  if(AH[nid])ach(AH[nid]);
  autoSave();
  const node=S[nid];
  let title=node[0]||chapterLabel(nid);
  let text=txt(nid).replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>");
  curChoices=(node[2]||[]).filter(avail);
  let chHtml="";
  curChoices.forEach((c,i)=>{
    const risk=c[4]?"<span class='risk'>⚠️</span>":"";
    chHtml+=`<button class="btn" onclick="choose(${i})">${choiceLabel(nid,i)}${risk}</button>`;
  });
  const comps=companionsOf().map(companionCard).join(" ");
  const fact=F[nid]?`<div class="fact">${LG==="en"?(FE[nid]||F[nid]):F[nid]}</div>`:"";
  document.getElementById("app").innerHTML=`
    ${topBar()}
    <h1>${LG==="en"?"Survival":"النجاة"}</h1>
    <div class="ch">${title}</div>
    ${renderStats()}
    ${comps?`<div style="margin:6px 0">${comps}</div>`:""}
    ${art(nid)}
    ${fact}
    <div class="tx">${text}</div>
    ${chHtml}
  `;
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ==================== CHOOSE (with X death fix) ==================== */
function choose(i){
  const c=curChoices[i];
  if(!c)return;
  snap={id,s:cloneS(s)};
  const aid=companionAid(id);
  if(aid.acting.length){
    for(const k in aid.total)s[k]=(s[k]||0)+aid.total[k];
    toast("🤝 "+aid.acting.map(x=>COMP[x][LG==="en"?"en":"ar"]).join("، "));
  }
  let next=c[1];
  applyEffects(c[2]);
  if(c[4]&&Math.random()>c[4]&&c[5])next=c[5];
  if(next&&next[0]==="@"){
    const lid=next.slice(1);
    s.jc[lid]=(s.jc[lid]||0)+1;
    if(s.jc[lid]>=LP[lid].d)next=LP[lid].n;
    else{renderNode(lid);return}
  }
  if(next&&X[next]){renderDeath(next);return}
  if(next==="fin"){finish();return}
  if(!S[next]){toast("⚠️ نهاية غير متوقعة");showMenu();return}
  renderNode(next);
}

/* ==================== UNDO ==================== */
function undo(){
  if(!snap){toast(LG==="en"?"Nothing to undo":"لا يوجد ما يمكن التراجع عنه");return}
  s=cloneS(snap.s);id=snap.id;snap=null;renderNode(id);
  toast(LG==="en"?"↩️ Undone":"↩️ تم التراجع");
}

/* ==================== DEATH SCREEN ==================== */
function renderDeath(key){
  mk("death");
  const meta=END_META.death;
  const msg=LG==="en"?(X_EN[key]||X[key]||""):(X[key]||"");
  document.getElementById("app").innerHTML=`
    ${topBar()}
    <div class="end" style="text-align:center;margin-top:20px">
      <div style="font-size:3rem">${meta.icon}</div>
      <h1>${LG==="en"?meta.en:meta.ar}</h1>
      <div class="tx" style="text-align:right">${msg}</div>
      ${renderStats()}
      <button class="btn pri" onclick="startGame()">${LG==="en"?"Play again":"إعادة اللعب"}</button>
      <button class="btn" onclick="undo()">↩️ ${LG==="en"?"Undo last choice":"تراجع"}</button>
      <button class="btn" onclick="showMenu()">${LG==="en"?"Main menu":"القائمة الرئيسية"}</button>
    </div>
  `;
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ==================== FINISH (with s.sac fix) ==================== */
function finish(){
  let key="witness";
  if(s.sac)key="martyr";
  else if(s.ldg)key="ledger";
  else if(s.er)key="er";
  else if(s.C)key="border";
  else if(s.p>=70)key="peace";
  else if(s.p<=20)key="heart";
  else if(s.f<=0||s.h<=0)key="hunger";
  else if((s.dy||[]).length>20)key="witness";
  else if(s.p<=35)key="death";
  renderEnding(key);
}

/* ==================== ENDING ==================== */
function renderEnding(key){
  mk(key);
  const meta=END_META[key]||END_META.witness;
  const body=LG==="en"?(ENDINGS_EN[key]||ENDINGS_EN.witness)():(ENDINGS[key]||ENDINGS.witness)();
  document.getElementById("app").innerHTML=`
    ${topBar()}
    <div class="end" style="text-align:center;margin-top:20px">
      <div style="font-size:3rem">${meta.icon}</div>
      <h1>${LG==="en"?meta.en:meta.ar}</h1>
      <div class="tx" style="text-align:right">${body}</div>
      ${renderStats()}
      <button class="btn pri" onclick="startGame()">${LG==="en"?"Play again":"إعادة اللعب"}</button>
      <button class="btn" onclick="showMenu()">${LG==="en"?"Main menu":"القائمة الرئيسية"}</button>
      <button class="btn" onclick="openJournal()">${tr("📔 المذكرات")}</button>
    </div>
  `;
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ==================== MENU ==================== */
function showMenu(){
  id=null;s=null;snap=null;
  const saves=getSaves();
  const hasSave=!!(saves.auto||saves.slot1||saves.slot2||saves.slot3);
  document.getElementById("app").innerHTML=`
    <h1>${LG==="en"?"Survival":"النجاة"}</h1>
    <p class="ch">${LG==="en"?"A story of a Sudanese journey between two wars.":"لعبة قصصية عن رحلة سوداني بين حربين."}</p>
    <button class="btn pri" onclick="startGame()">${LG==="en"?"New game":"بدء جديدة"}</button>
    <button class="btn" onclick="continueGame()" ${hasSave?"":"disabled style='opacity:.45'"}>${LG==="en"?"Continue":"متابعة"}</button>
    <button class="btn" onclick="openJournal()">${tr("📔 المذكرات")}</button>
    <button class="btn" onclick="openSettings()">${LG==="en"?"Settings":"الإعدادات"}</button>
    <button class="btn" onclick="openAbout()">${LG==="en"?"About":"عن اللعبة"}</button>
    <button class="btn" onclick="toggleLang()">${LG==="en"?"العربية":"English"}</button>
    <div class="mut" style="text-align:center;margin-top:20px">${LG==="en"?"A work of interactive fiction inspired by real events.":"عمل روائي تفاعلي مستوحى من أحداث حقيقية."}</div>
  `;
}
function startGame(){
  s={h:100,f:100,p:50,e:100,c:60,m:0,dy:[],jc:{}};
  id="d0";snap=null;
  document.getElementById("pn").classList.remove("on");
  renderNode("d0");
}

/* ==================== PANELS ==================== */
function openJournal(){
  const e=document.getElementById("pn");
  const comps=companionsOf();
  let h=`<h3>${tr("📔 المذكرات")}</h3>`;
  h+=`<div class="mut">${LG==="en"?"Companions":"الرفاق"}</div>`;
  h+=comps.length?comps.map(k=>`<div class="it2"><span>${COMP[k].icon} <b>${LG==="en"?COMP[k].en:COMP[k].ar}</b><br><small>${LG==="en"?COMP[k].enRole:COMP[k].arRole}</small></span></div>`).join(""):`<div class="mut">${LG==="en"?"No companions yet.":"لا رفاق بعد."}</div>`;
  h+=`<div class="mut" style="margin-top:10px">${LG==="en"?"Journal":"اليوميات"}</div>`;
  const dy=s&&s.dy?s.dy:[];
  h+=dy.length?dy.map(d=>`<div class="it2"><span>${d}</span></div>`).join(""):`<div class="mut">${LG==="en"?"Empty.":"فارغ."}</div>`;
  const achs=ld2("najat_ach");
  h+=`<div class="mut" style="margin-top:10px">${LG==="en"?"Achievements":"الأوسمة"}</div>`;
  if(achs.length){h+=achs.map(a=>{const m=EG.find(x=>x[0]===a);return m?`<div class="it2"><span>${m[1]} ${m[2]}</span></div>`:""}).join("");}
  else h+=`<div class="mut">${LG==="en"?"None yet.":"لا شيء بعد."}</div>`;
  h+=`<button class="btn pri" onclick="document.getElementById('pn').classList.remove('on')">${tr("إغلاق")}</button>`;
  e.innerHTML=`<div>${h}</div>`;e.classList.add("on");
}
function openShop(){
  const e=document.getElementById("pn");
  let h=`<h3>${tr("🛒 السوق")}</h3><div class="mut">${LG==="en"?"Money":"المال"}: ${s?s.m||0:0}</div>`;
  for(const k in IT){
    if(k==="docs")continue;
    const it=IT[k];
    h+=`<div class="it2"><span>${it[0]} <b>${it[1]}</b><br><small>${it[2]}</small></span>
      <button class="btn" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="buyItem('${k}')">${tr("اشترِ")} ${PR[k]}</button></div>`;
  }
  h+=`<button class="btn pri" onclick="document.getElementById('pn').classList.remove('on')">${tr("إغلاق")}</button>`;
  e.innerHTML=`<div>${h}</div>`;e.classList.add("on");
}
function buyItem(k){
  if(!s){toast(LG==="en"?"Start a game first":"ابدأ اللعبة أولًا");return}
  if((s.m||0)<PR[k]){toast(LG==="en"?"Not enough money":"مالك لا يكفي");return}
  s.m-=PR[k];s[k]=true;
  toast("✅ "+IT[k][1]+" "+(LG==="en"?"bought":"تم الشراء"));
  openShop();autoSave();
}
function openTimeline(){
  const e=document.getElementById("pn");
  let h=`<h3>${tr("🕰️ الأحداث")}</h3>`;
  h+=TL.map(t=>`<div class="it2"><span><b>${t[1]}</b><br>${t[2]}</span></div>`).join("");
  h+=`<button class="btn pri" onclick="document.getElementById('pn').classList.remove('on')">${tr("إغلاق")}</button>`;
  e.innerHTML=`<div>${h}</div>`;e.classList.add("on");
}
function openSettings(){
  const e=document.getElementById("pn");
  let h=`<h3>${LG==="en"?"Settings":"الإعدادات"}</h3>`;
  h+=`<div class="it2"><span>${LG==="en"?"Language":"اللغة"}</span><button class="btn" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="toggleLang();openSettings()">${LG==="en"?"العربية":"English"}</button></div>`;
  h+=`<div class="it2"><span>${LG==="en"?"Music":"الموسيقى"}</span><button class="btn" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="snd();openSettings()">${mu?"🔊":"🔇"}</button></div>`;
  h+=`<div class="it2"><span>${LG==="en"?"Reset progress":"مسح التقدم"}</span><button class="btn" style="width:auto;margin:0;min-height:36px;padding:6px 12px" onclick="if(confirm('${LG==="en"?"Delete all saves and achievements?":"حذف كل الحفظ والأوسمة؟"}')){localStorage.removeItem('najat_saves_v2');localStorage.removeItem('najat_ach');localStorage.removeItem('najat_eg');localStorage.removeItem('najat_chapters');toast('🗑️');document.getElementById('pn').classList.remove('on');showMenu()}">${LG==="en"?"Reset":"مسح"}</button></div>`;
  h+=`<button class="btn pri" onclick="document.getElementById('pn').classList.remove('on')">${tr("إغلاق")}</button>`;
  e.innerHTML=`<div>${h}</div>`;e.classList.add("on");
}
function openAbout(){
  const e=document.getElementById("pn");
  e.innerHTML=`<div>
    <h3>${LG==="en"?"About":"عن اللعبة"}</h3>
    <div class="mut" style="line-height:1.9">
      ${LG==="en"?"Survival is an interactive fiction game about a Sudanese child who flees Darfur, builds a life in Khartoum, and faces war again. It is inspired by real events but is a work of fiction. All characters are fictional.":"«النجاة» لعبة قصصية تفاعلية عن طفل سوداني يهرب من دارفور، يبني حياة في الخرطوم، ثم يواجه الحرب مرة أخرى. مستوحاة من أحداث حقيقية لكنها عمل خيالي، وكل الشخصيات خيالية."}
      <br><br>${LG==="en"?"Made with respect for the people of Sudan.":"صُنعت باحترام لأهل السودان."}
    </div>
    <button class="btn pri" onclick="document.getElementById('pn').classList.remove('on')">${tr("إغلاق")}</button>
  </div>`;e.classList.add("on");
}

/* ==================== LANGUAGE + AUDIO + PARTICLES ==================== */
function toggleLang(){
  LG=LG==="en"?"ar":"en";
  try{localStorage.setItem("najat_lang",LG)}catch(e){}
  document.documentElement.setAttribute("dir",LG==="en"?"ltr":"rtl");
  document.documentElement.setAttribute("lang",LG);
  if(s&&id)renderNode(id);else showMenu();
  toast(LG==="en"?"English":"العربية");
}
function updateMusicBtn(){const b=document.getElementById("mb");if(b)b.textContent=mu?"🔊":"🔇"}
function genParticles(){
  const c=document.getElementById("ptc");
  if(!c||PARTICLE_COUNT<=0)return;
  let h="";
  for(let i=0;i<PARTICLE_COUNT;i++){
    const l=Math.random()*100,d=5+Math.random()*10,dl=Math.random()*10;
    h+=`<div class="pt" style="left:${l}%;animation-duration:${d}s;animation-delay:${dl}s"></div>`;
  }
  c.innerHTML=h;
}

/* ==================== BOOT ==================== */
window.addEventListener("load",()=>{
  document.documentElement.setAttribute("dir",LG==="en"?"ltr":"rtl");
  document.documentElement.setAttribute("lang",LG);
  genParticles();
  updateMusicBtn();
  showMenu();
});
document.addEventListener("click",()=>{unlockAudio()},{once:true});
</script>
