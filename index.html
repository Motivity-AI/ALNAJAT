<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرماد الأخير — ملحمة النجاة</title>
<style>
:root{
  --bg:#050403;--panel:#0f0b08;--panel2:#18110c;--line:#281f15;
  --ink:#f5ebd9;--dim:#9e876a;--amber:#d49742;--red:#a8382e;
  --sand:#c9a227;--blue:#4a7c8c;--green:#5a8a3a;--violet:#7a5c8a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(circle at 50% -20%,#241609 0%,#050403 60%);
  color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  display:flex;justify-content:center;padding:14px 12px 70px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
#particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:var(--amber);border-radius:50%;opacity:0;animation:fall linear infinite;box-shadow:0 0 3px var(--amber)}
@keyframes fall{0%{transform:translateY(-20px);opacity:0}10%{opacity:.4}90%{opacity:.2}100%{transform:translateY(100vh) translateX(30px);opacity:0}}
#app{width:100%;max-width:820px;position:relative;z-index:2}

#topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px;flex-wrap:wrap}
#chapterLabel{font-size:11px;letter-spacing:2px;color:var(--amber);font-weight:700;padding:6px 12px;background:linear-gradient(180deg,#1e1610,#14100c);border:1px solid var(--line);border-radius:20px;white-space:nowrap}
#controls{display:flex;gap:5px;flex-wrap:wrap}
#controls button{background:linear-gradient(180deg,#1c1610,#14100c);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
#controls button:hover{border-color:var(--amber);background:#241a12}
#controls button.off{opacity:.45}

#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
@media(max-width:560px){#hud{grid-template-columns:repeat(3,1fr)}}
.chip{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:9px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:all .3s}
.chip.crit{border-color:var(--red);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,56,46,.4)}50%{box-shadow:0 0 0 6px rgba(168,56,46,0)}}
.chip .lbl{font-size:9px;color:var(--dim);letter-spacing:.3px}
.chip .val{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:#1f1812;border-radius:99px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .55s ease}

#worldMap{background:#0b0806;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:4px;overflow-x:auto}
.map-node{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:3px;white-space:nowrap}
.map-node.active{color:var(--amber);font-weight:700;text-shadow:0 0 6px rgba(212,151,66,.4)}
.map-line{flex:1;height:1px;background:var(--line);min-width:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 55px rgba(0,0,0,.6)}
#sceneImg{width:100%;height:200px;position:relative;border-bottom:1px solid var(--line);overflow:hidden;transition:background 1.1s ease}
#sceneImg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.65))}
#sceneImg .mood-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:54px;opacity:.42;filter:blur(1px);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-56%)}}
@media(max-width:520px){#sceneImg{height:150px}.mood-icon{font-size:38px}}
.avatar{position:absolute;bottom:10px;right:12px;width:46px;height:46px;background:linear-gradient(135deg,#2a1a10,#1a1008);border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2}
.card-body{padding:22px 20px}
#scene{line-height:2.15;font-size:15.5px;min-height:90px}
#scene p{margin:0 0 15px;opacity:0;transform:translateY(6px);transition:all .5s ease}
#scene p:last-child{margin-bottom:0}
.speaker{color:var(--amber);font-weight:700}
.hl{color:var(--sand);font-weight:600}
.warn-txt{color:var(--red);font-weight:600}
.thought{display:block;background:rgba(122,92,138,.08);border-right:2px solid var(--violet);padding:8px 12px;border-radius:0 6px 6px 0;font-style:italic;color:#b8a8c8;font-size:13.5px;margin:8px 0}
.fact{background:rgba(74,124,140,.06);border-right:2px solid var(--blue);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:#9ab8c8;margin:10px 0;line-height:1.8}

#choices{display:flex;flex-direction:column;gap:8px}
.choice{width:100%;text-align:right;cursor:pointer;background:linear-gradient(180deg,#1c1610,#14100c);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14.5px;font-family:inherit;line-height:1.6;transition:all .2s;display:flex;align-items:center;gap:10px}
.choice:hover{background:linear-gradient(180deg,#281e15,#1b140f);border-color:var(--amber);transform:translateX(-3px)}
.choice .bullet{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--amber);opacity:.8}
.choice .preview{font-size:10.5px;color:var(--dim);margin-right:auto;padding-right:6px;display:none}
.choice:hover .preview{display:inline}
.choice.req{opacity:.5;cursor:not-allowed}
.choice.req:hover{transform:none;border-color:var(--line);background:linear-gradient(180deg,#1c1610,#14100c)}

#companionDisplay{margin-bottom:10px;display:none}
.companion-box{background:#130e0a;border:1px solid var(--amber);border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sand)}
.companion-box.wounded{border-color:var(--red);color:#e0a8a8}
.companion-box span{font-size:18px}
.companion-box .status{font-size:10.5px;color:var(--dim);margin-top:2px}

#chapterBanner{position:fixed;inset:0;background:rgba(5,4,3,.95);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;animation:fadeIn .4s ease}
#chapterBanner.show{display:flex}
#chapterBanner h1{color:var(--amber);font-size:24px;margin:0;text-align:center;padding:0 18px;line-height:1.6}
#chapterBanner .num{font-size:11px;color:var(--dim);letter-spacing:3px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn .3s ease}
.modal.show{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:600px;width:100%;max-height:82vh;overflow-y:auto}
.modal-content h2{margin:0 0 14px;color:var(--amber);font-size:18px}
.inv-grid,.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.inv-item,.market-item{background:#140e0a;border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.inv-item .icon,.market-item .icon{font-size:22px}
.inv-item .name,.market-item .name{font-size:12px;font-weight:700}
.inv-item .desc,.market-item .desc{font-size:10.5px;color:var(--dim);line-height:1.35}
.inv-item button,.market-item button{margin-top:auto;background:var(--amber);color:#000;border:none;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}
.inv-item button:disabled{background:#3a2a1a;color:var(--dim);cursor:not-allowed}
.empty-msg{color:var(--dim);font-size:13px;text-align:center;padding:20px;grid-column:1/-1}
.modal-content button.close-btn{background:#1c1610;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 18px;cursor:pointer;font-family:inherit;margin-top:10px;width:100%}
.modal-content button.close-btn:hover{border-color:var(--amber)}
.diary-entry{border-right:2px solid var(--amber);padding:8px 12px;margin-bottom:8px;font-size:13px;line-height:1.85;color:var(--dim);background:rgba(212,151,66,.02);border-radius:0 7px 7px 0}
.diary-entry .when{color:var(--amber);font-size:11px;margin-bottom:3px;font-weight:700}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.ach-item{background:#140e0a;border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center}
.ach-item.unlocked{border-color:var(--amber);background:rgba(212,151,66,.06)}
.ach-item.locked{opacity:.4}
.ach-item .ic{font-size:22px;margin-bottom:3px}
.ach-item .tt{font-size:11px;font-weight:700}
.ach-item .ds{font-size:9.5px;color:var(--dim);margin-top:2px}

.eg-grid{display:grid;gap:8px}
.eg-item{background:#140e0a;border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;gap:10px;align-items:center}
.eg-item.found{border-color:var(--amber)}
.eg-item.locked{opacity:.4}
.eg-item .ic{font-size:26px}
.eg-item .tt{font-weight:700;font-size:13px;margin-bottom:2px}
.eg-item .ds{font-size:11px;color:var(--dim)}

.ending-h{font-size:22px;font-weight:700;margin:0 0 12px;line-height:1.5}
.ending-h.peace{color:var(--sand)}
.ending-h.dark{color:var(--red)}
.ending-h.broken{color:#8a7a5a}
.ending-h.martyr{color:var(--green)}
.quote{border-right:3px solid var(--amber);padding:10px 14px;color:var(--dim);font-style:italic;margin:14px 0;background:rgba(212,151,66,.04);border-radius:0 8px 8px 0;line-height:1.75}
.stats-box{background:#0b0806;border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;font-size:12.5px;line-height:1.9}
.stats-box .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--dim)}
.stats-box .row span:last-child{color:var(--ink);font-weight:600}
.analysis{background:rgba(122,92,138,.06);border:1px solid rgba(122,92,138,.3);border-radius:9px;padding:12px;margin:12px 0;font-size:13px;line-height:1.85;color:#c8b8d8}
.analysis h4{margin:0 0 6px;color:var(--violet);font-size:14px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#18110c;border:1px solid var(--amber);color:var(--ink);padding:10px 18px;border-radius:11px;font-size:12.5px;z-index:150;transition:transform .4s ease;pointer-events:none;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

#achPop{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-120px);background:linear-gradient(135deg,#2a1a10,#1a1008);border:2px solid var(--amber);padding:12px 20px;border-radius:12px;z-index:180;display:flex;align-items:center;gap:10px;box-shadow:0 15px 40px rgba(0,0,0,.7);transition:transform .5s cubic-bezier(.4,0,.2,1);pointer-events:none}
#achPop.show{transform:translateX(-50%) translateY(0)}
#achPop .ic{font-size:28px}
#achPop .tx{font-size:12px}
#achPop .tx strong{display:block;color:var(--amber);font-size:13px}
</style>
</head>
<body>
<div id="particles"></div>
<div id="app">
  <div id="topbar">
    <span id="chapterLabel">الفصل الأول · دارفور</span>
    <div id="controls">
      <button id="invBtn">🎒 (<span id="invCount">0</span>)</button>
      <button id="marketBtn">🛒</button>
      <button id="diaryBtn">📔</button>
      <button id="achBtn">🏆</button>
      <button id="egBtn">🎭</button>
      <button id="saveBtn">💾</button>
      <button id="loadBtn">📂</button>
      <button id="soundBtn">🔊</button>
    </div>
  </div>

  <div id="worldMap">
    <div class="map-node" id="m-darfur">🌄 دارفور</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-desert">🏜️ الصحراء</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-market">🛒 أم درمان</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-khartoum">🏙️ الخرطوم</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-fasher">🔥 الفاشر</div>
    <div class="map-line"></div>
    <div class="map-node" id="m-borders">🚪 الحدود</div>
  </div>

  <div id="companionDisplay"></div>
  <div id="hud"></div>

  <div class="card">
    <div id="sceneImg"><span class="mood-icon"></span><div class="avatar" id="avatarIcon">👦</div></div>
    <div class="card-body"><div id="scene"></div></div>
  </div>
  <div id="choices"></div>
</div>

<div id="chapterBanner"><span class="num" id="chNum"></span><h1 id="chTitle"></h1></div>

<div id="invModal" class="modal"><div class="modal-content">
  <h2>🎒 الحقيبة</h2>
  <div id="invList" class="inv-grid"></div>
  <button class="close-btn" onclick="closeModal('invModal')">إغلاق</button>
</div></div>

<div id="marketModal" class="modal"><div class="modal-content">
  <h2>🛒 السوق</h2>
  <div id="marketList" class="market-grid"></div>
  <button class="close-btn" onclick="closeModal('marketModal')">إغلاق</button>
</div></div>

<div id="diaryModal" class="modal"><div class="modal-content">
  <h2>📔 مذكرات الرحلة</h2>
  <div id="diaryList"></div>
  <button class="close-btn" onclick="closeModal('diaryModal')">إغلاق</button>
</div></div>

<div id="achModal" class="modal"><div class="modal-content">
  <h2>🏆 الإنجازات</h2>
  <div id="achGrid" class="ach-grid"></div>
  <button class="close-btn" onclick="closeModal('achModal')">إغلاق</button>
</div></div>

<div id="egModal" class="modal"><div class="modal-content">
  <h2>🎭 معرض النهايات</h2>
  <div id="egGrid" class="eg-grid"></div>
  <button class="close-btn" onclick="closeModal('egModal')">إغلاق</button>
</div></div>

<div id="achPop"><span class="ic">🏆</span><div class="tx"><strong>إنجاز!</strong><span id="achPopTxt"></span></div></div>
<div id="toast"></div>

<script>
/* ================= MOODS ================= */
const MOODS={
  war:{sky1:'#3a0d08',sky2:'#0a0403',icon:'🔥'},
  darfur:{sky1:'#5c2a10',sky2:'#1a0f08',icon:'🌄'},
  attack:{sky1:'#4a1a08',sky2:'#0f0604',icon:'⚠️'},
  desert:{sky1:'#c98e3f',sky2:'#5c3a1a',icon:'🏜️'},
  city:{sky1:'#1a2233',sky2:'#0a0d15',icon:'🏙️'},
  market:{sky1:'#6a3a18',sky2:'#2a1508',icon:'🛒'},
  work:{sky1:'#3a2a1a',sky2:'#15100a',icon:'🔧'},
  home:{sky1:'#4a3a2a',sky2:'#1a120a',icon:'🏠'},
  prison:{sky1:'#1a1a1a',sky2:'#050505',icon:'⛓️'},
  hope:{sky1:'#8a6a2a',sky2:'#2a2010',icon:'✨'},
  peace:{sky1:'#7a9a5a',sky2:'#2a3a1a',icon:'🕊️'},
  dark:{sky1:'#1a1010',sky2:'#050303',icon:'🌑'},
  famine:{sky1:'#5a3a10',sky2:'#1a0f05',icon:'🍂'},
  border:{sky1:'#8a7040',sky2:'#2a2010',icon:'🚪'}
};

const CHAPTERS={
  1:'دارفور · ٢٠٠٣',
  2:'الطريق إلى الخرطوم',
  3:'أم درمان · الرصيف',
  4:'الخرطوم · الصعود',
  5:'البيت والأسرة',
  6:'١٥ أبريل ٢٠٢٣',
  7:'الفاشر · الحصار',
  8:'غرف الطوارئ',
  9:'الحدود',
  10:'الخاتمة'
};

const AVATARS={child:'👦',teen:'🧑',adult:'👨',elder:'👴',prisoner:'🧔'};

/* ================= ITEMS ================= */
const ITEMS={
  water:{name:'قربة ماء',icon:'💧',desc:'+٣٠ ماء. ضرورية للبقاء.',price:40,use:s=>{s.water=Math.min(100,s.water+30);toast('💧 شربت ماءً.. ارتوى جسدك.')}},
  food:{name:'كسرة وملاح',icon:'🍲',desc:'+٣٥ شبع. تسد الجوع.',price:80,use:s=>{s.food=Math.min(100,s.food+35);toast('🍲 أكلت.. سكن جوعك.')}},
  medicine:{name:'دواء',icon:'💊',desc:'+٤٠ صحة. تعالج الجروح.',price:150,use:s=>{s.health=Math.min(100,s.health+40);toast('💊 تعافيت.')}},
  tea:{name:'شاي وبلح',icon:'🍵',desc:'+٢٠ أمل. ترفع المعنويات.',price:60,use:s=>{s.hope=Math.min(100,s.hope+20);toast('🍵 شاي بالهيل.. ارتفع أملك.')}},
  blanket:{name:'بطانية',icon:'🛏️',desc:'+٢٥ طاقة. دفء الليل.',price:120,use:s=>{s.energy=Math.min(100,s.energy+25);toast('🛏️ دفء.. استعدت طاقتك.')}}
};

/* ================= ACHIEVEMENTS ================= */
const ACHS={
  survive_darfur:{icon:'🌅',title:'نجاة دارفور',desc:'خرجت من قريتك'},
  reach_khartoum:{icon:'🏙️',title:'الوصول',desc:'بلغت الخرطوم'},
  find_uthman:{icon:'👦',title:'الرفيق',desc:'أنقذت عثمان'},
  uthman_alive:{icon:'🤝',title:'رفيق الدرب',desc:'عثمان نجا معك'},
  uthman_lost:{icon:'💔',title:'الفقد',desc:'فقدت عثمان'},
  build_empire:{icon:'🚌',title:'الكريز',desc:'امتلكت حافلتك'},
  family:{icon:'💍',title:'الأسرة',desc:'تزوجت وأنجبت'},
  lost_all:{icon:'🔥',title:'الخسارة',desc:'فقدت كل شيء'},
  fasher:{icon:'🔥',title:'الفاشر',desc:'شهدت الحصار'},
  err_join:{icon:'🤲',title:'غرفة الطوارئ',desc:'انضممت للمتطوعين'},
  save_someone:{icon:'💚',title:'التضحية',desc:'أنقذت حياة'},
  end_witness:{icon:'📖',title:'الشاهد',desc:'نهاية الشاهد'},
  end_crossing:{icon:'🚪',title:'العبور',desc:'نهاية العبور'},
  end_renewed:{icon:'🌱',title:'من جديد',desc:'نهاية البداية'},
  end_broken:{icon:'💔',title:'المنكسر',desc:'نهاية الضياع'},
  end_martyr:{icon:'🌹',title:'التضحية',desc:'نهاية الشهادة'},
  end_ash:{icon:'🥀',title:'الرماد',desc:'نهاية الفناء'}
};

/* ================= ENDINGS GALLERY ================= */
const ENDINGS=[
  {id:'witness',icon:'📖',title:'الشاهد',desc:'حفظت الأسماء'},
  {id:'crossing',icon:'🚪',title:'العبور',desc:'عبرت الحدود'},
  {id:'renewed',icon:'🌱',title:'من جديد',desc:'نجوت وحدك'},
  {id:'broken',icon:'💔',title:'المنكسر',desc:'نجا جسدك لا روحك'},
  {id:'martyr',icon:'🌹',title:'التضحية',desc:'أنقذت غيرك'},
  {id:'ash',icon:'🥀',title:'الرماد',desc:'لم تنجُ'}
];

/* ================= STATE ================= */
let S={};
const SAVE_KEY='rimad_v11_save';
const ACH_KEY='rimad_v11_ach';
const EG_KEY='rimad_v11_eg';

function newState(){
  return{
    water:70,food:70,health:100,hope:75,energy:80,humanity:60,
    money:180,age:8,chapter:1,node:'intro',
    inventory:['water','food'],
    uthman:null, // {name:'عثمان',bond:100,wounded:false,alive:true}
    flags:{},diary:[],stats:{choices:0,kind:0,cruel:0},mapNode:'m-darfur'
  };
}

function getAch(){try{return JSON.parse(localStorage.getItem(ACH_KEY)||'[]')}catch(e){return[]}}
function unlockAch(k){
  const a=getAch();
  if(a.includes(k))return;
  a.push(k);localStorage.setItem(ACH_KEY,JSON.stringify(a));
  showAchPop(ACHS[k]);
}
function showAchPop(a){
  if(!a)return;
  const p=document.getElementById('achPop');
  document.getElementById('achPopTxt').textContent=a.title+' — '+a.desc;
  p.querySelector('.ic').textContent=a.icon;
  p.classList.add('show');tone(659,.12);setTimeout(()=>tone(880,.15),120);
  setTimeout(()=>p.classList.remove('show'),2600);
}
function getEg(){try{return JSON.parse(localStorage.getItem(EG_KEY)||'[]')}catch(e){return[]}}
function markEnding(id){
  const f=getEg();

/* ================= AUDIO ================= */
let audioCtx=null,soundOn=true,amb=[];
function tone(f,d=0.15,t='sine',v=0.035){
  if(!soundOn)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function stopAmb(){amb.forEach(n=>{try{n.o.stop();n.l.stop()}catch(e){}});amb=[]}
function startAmb(m){
  if(!soundOn)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    stopAmb();
    const map={war:[110,165],darfur:[146,220],desert:[164,246],city:[196,294],market:[174,261],work:[130,195],home:[220,330],prison:[98,147],hope:[261,392],peace:[329,440],dark:[110,165],famine:[87,130],border:[164,220]};
    const f=map[m]||map.darfur;
    f.forEach((fr,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),l=audioCtx.createOscillator(),lg=audioCtx.createGain();
      o.type='sine';o.frequency.value=fr;
      g.gain.setValueAtTime(.006,audioCtx.currentTime);
      l.frequency.value=.1+i*.05;lg.gain.value=1.3;
      l.connect(lg);lg.connect(o.frequency);l.start();
      o.connect(g);g.connect(audioCtx.destination);o.start();
      amb.push({o,g,l});
    });
  }catch(e){}
}

/* Resource drain per scene */
function drain(){
  S.water=Math.max(0,S.water-5);
  S.food=Math.max(0,S.food-4);
  if(S.uthman&&S.uthman.alive){
    S.water=Math.max(0,S.water-3);
    S.food=Math.max(0,S.food-2);
  }
  if(S.water===0){S.health=Math.max(0,S.health-8);toast('⚠️ عطش شديد! صحتك تنهار.')}
  if(S.food===0){S.health=Math.max(0,S.health-6);toast('⚠️ جوع قاتل! صحتك تنهار.')}
  // Uthman's wounds worsen if not treated
  if(S.uthman&&S.uthman.alive&&S.uthman.wounded){
    S.uthman.bond=Math.max(0,S.uthman.bond-3);
    if(S.uthman.bond<=0){S.uthman.alive=false;toast('💔 عثمان مات متأثراً بجراحه.');unlockAch('uthman_lost')}
  }
}

function render(){
  const sc=scenes[S.node];if(!sc)return;
  if(sc.chapter&&sc.chapter!==S.chapter){S.chapter=sc.chapter;showBanner(S.chapter)}
  chLabel.textContent='الفصل '+S.chapter+' · '+(CHAPTERS[S.chapter]||'').split(' · ')[0];
  setMood(sc.mood||'darfur');
  if(sc.map)setMap(sc.map);

  const txt=typeof sc.text==='function'?sc.text(S):sc.text;
  sceneEl.innerHTML=txt.split('\n').filter(l=>l.trim()).map(l=>`<p>${l}</p>`).join('');
  sceneEl.querySelectorAll('p').forEach((p,i)=>setTimeout(()=>{p.style.opacity='1';p.style.transform='none'},50+i*80));

  choicesEl.innerHTML='';
  sc.choices.forEach(c=>{
    if(c.if&&!c.if(S))return;
    const b=document.createElement('button');
    b.className='choice';
    const dis=c.lock&&c.lock(S);
    if(dis)b.classList.add('req');
    b.innerHTML=`<span class="bullet"></span><span>${c.t}</span><span class="preview">${c.hint||''}</span>`;
    if(!dis)b.onclick=()=>handleChoice(c);
    choicesEl.appendChild(b);
  });

  updateHUD();
}

function handleChoice(c){
  tone(440,.08);
  if(c.do)c.do(S);
  S.stats.choices++;clamp(S);

  // Check death
  if(S.health<=0&&c.to!=='ending'){S.node='death';updateHUD();render();return}

  // Drain resources
  drain();
  if(S.health<=0){S.node='death';updateHUD();render();return}

  S.node=c.to;
  updateHUD();render();window.scrollTo({top:0,behavior:'smooth'});
}

def('beg',{chapter:3,mood:'market',map:'m-market',
text:`في اليوم الثاني، توقف رجل عجوز. أعطاك نصف رغيف. لم يقل شيئاً. مشى.

تعلّمت أسماء الزبائن. تعلّمت كيف يعدّ الرجل نقوده.

في الليلة الأخيرة، ناولك صحناً من العدس وقال:
<span class="speaker">«تغسل كأنك تهرب من شيء. الرزق صبر يا ولد. من أين أنت؟»</span>

def('uthman_meet',{chapter:3,mood:'market',map:'m-market',

في الليل، يجلس المتطوعون ويتحدثون عن الشهداء.
قال أحدهم: <span class="speaker">«خالد الزبير. تذكرونه؟ اعتُقل داخل معتقلات استخبارات الجيش. لم يعد.»</span>

صمت طويل.
ثم قال آخر: <span class="speaker">«نحن نكتب أسماءنا كل يوم. لأننا لا نعرف إن كنا سنراها غداً.»</span>

<span class="thought">💭 أنا أيضاً أصبحت أكتب اسمي كل صباح.</span>

<span class="thought">💭 عثمان بجانبي. لا يتكلم. فقط يحمل الماء.</span>

في أحد الأيام، جاء جريح على محفة. كان شاباً في العشرين. أصابته شظية في بطنه.
الطبيبة الشابة نظرت إليك. <span class="speaker">«تحتاج دماً. أنت O سالب؟»</span>
لم تعرف. لكنك مددت ذراعك.`,
choices:[
{t:'تتبرع بالدم للجريح',do:s=>{
  s.health-=15;s.humanity+=15;s.hope+=10;
  addDiary(s,'تبرعت بالدم في غرفة الطوارئ.','الفاشر');
  unlockAch('save_someone');
},to:'fasher_fall',hint:'تضحية'},
{t:'تعتذر وتستمر في عملك',do:s=>{s.hope-=3},to:'fasher_fall',hint:'محايد'}]});

def('fasher_fall',{chapter:8,mood:'dark',map:'m-fasher',
text:`في أواخر أكتوبر ٢٠٢٥، سقطت الفاشر.

قوات الدعم السريع اجتاحت المدينة.
بعثة الأمم المتحدة لتقصي الحقائق وجدت <span class="warn-txt">«مؤشرات إبادة جماعية»</span>.
تحدثت التقارير عن عمليات قتل جماعي، واغتصاب ممنهج، وإعدام ٣١٩ شخصاً على الأقل في المخيم أو أثناء محاولتهم الفرار.

كنت هناك.
رأيت ما رأيت.
ولم تستطع أن تفعل شيئاً.

<span class="thought">💭 خرجت من دارفور طفلاً. وأعود إليها في الخمسين. والجحيم نفسه.</span>`,
choices:[
{t:'تحاول الفرار في الفوضى',do:s=>{s.health-=25;s.hope-=20;s.water-=15},to:'escape_fasher',hint:'صحة --'},
{t:'تختبئ مع عثمان وتنتظر',do:s=>{
  s.health-=15;s.hope-=15;s.humanity-=5;
  if(s.uthman&&s.uthman.alive){s.uthman.wounded=true;s.uthman.bond-=10}
},to:'escape_fasher',hint:'أمل --، عثمان مصاب'}]});

def('escape_fasher',{chapter:8,mood:'desert',map:'m-fasher',
text:`خرجت من الفاشر. أو ما تبقّى منها.

في الطريق إلى طويلة، رأيت عائلات تدفن أطفالها على جانب الطريق.
عند كل نقطة تفتيش، يطلب المسلحون مالاً. قال أحدهم: <span class="speaker">«خمسمائة ألف. أو ارجع.»</span>

لم يكن معك ما يكفي. لكنك عبرت. لا تعرف كيف.

<span class="thought">💭 في كل نقطة تفتيش، كانت يدك ترتجف. لكنك عبرت.</span>`,
choices:[
{t:'تواصل السير نحو الحدود',do:s=>{s.health-=10;s.energy-=20;s.hope-=5},to:'borders',hint:'طاقة --'}]});

def('checkpoint_bribe',{chapter:7,mood:'attack',map:'m-fasher',
text:`عند نقطة التفتيش، أوقفك شاب مسلح. لم يكن أكبر من ابنك.

نظر إلى وجهك، ثم إلى حقيبتك.
<span class="speaker">«تدفع. أو ترجع.»</span>

كانت هذه هي اللحظة التي تختبر فيها كل شيء تعلمته في ثلاثين سنة.`,
choices:[
{t:'تدفع ما تبقّى',do:s=>{s.money=Math.max(0,s.money-500);s.health-=5},to:'escape_fasher',hint:'مال -'},
{t:'تحاول المرور بلا دفع',do:s=>{s.health-=20;s.hope-=10},to:'escape_fasher',hint:'صحة --'}]});

def('border_direct',{chapter:9,mood:'border',map:'m-borders',
text:`اتجهت غرباً نحو تشاد قبل أن تدخل الفاشر.

الطريق عبر دارفور يعرفك. أنت من هنا.
لكن الأرض التي عرفتها طفلاً لم تعد هي.
القرى التي مررت بها طفلاً صارت رماداً.

<span class="thought">💭 أرى في كل قرية محروقة، قريتي. أرى في كل طفل هارب، نفسي.</span>`,
choices:[
{t:'تواصل نحو الحدود',do:s=>{
  s.flags.border='west';s.hope+=15;s.health-=15;
  addDiary(s,'عدت غرباً نحو تشاد.','الحدود');
},to:'borders'}]});

def('borders',{chapter:9,mood:'border',map:'m-borders',
text:function(s){
const os=s.uthman&&s.uthman.alive?'\n\nعثمان بجانبك. لم يتكلم منذ أيام. أنت تعرف أنه يفكر في نفس الشيء الذي تفكر فيه: أين نذهب؟':'';
return `وقفت أمام مفترق الطرق الأخير.

🇪🇬 <b>مصر</b> — عبرت نحو ١.٥ مليون سوداني إلى مصر. الطريق طويل، والمعبر مزدحم.
🇹🇩 <b>تشاد</b> — ٨٦٣ ألفاً إلى تشاد. قريبة من دارفور. لكن المخيمات مكتظة.
🇸🇸 <b>جنوب السودان</b> — ٣٧١ ألفاً. النيل الأبيض طريق طويل ومستنقعات.

أكثر من ٤ ملايين سوداني لجأوا إلى الدول المجاورة منذ أبريل ٢٠٢٣.

<span class="thought">💭 أي طريق تختار؟ وأي ثمن تدفع؟</span>${os}`;
},
choices:[
{t:'🇪🇬 شمالاً نحو مصر — مع وثائقك',if:s=>s.inventory.includes('docs')||s.flags.has_docs,do:s=>{s.flags.border='north';s.hope+=20;s.health-=15;s.water-=10;addDiary(s,'عبرت نحو مصر بوثائقي.','الحدود')},to:'ending',hint:'أمان مستقر'},
{t:'🇪🇬 شمالاً نحو مصر — بلا وثائق، مع مهرّب',if:s=>!(s.inventory.includes('docs')||s.flags.has_docs),do:s=>{s.flags.border='north';s.hope+=10;s.health-=25;s.money=Math.max(0,s.money-300);addDiary(s,'عبرت نحو مصر بلا وثائق.','الحدود')},to:'ending',hint:'خطر'},
{t:'🇹🇩 غرباً نحو تشاد — عبر أرض دارفور',do:s=>{s.flags.border='west';s.hope+=15;s.health-=20;s.water-=15;addDiary(s,'عدت غرباً نحو تشاد.','الحدود')},to:'ending',hint:'عودة للجذور'},
{t:'🇸🇸 جنوباً نحو جنوب السودان — مع النيل',do:s=>{s.flags.border='south';s.hope+=10;s.health-=20;s.energy-=20;s.water-=15;addDiary(s,'نزلت جنوباً عبر النيل.','الحدود')},to:'ending',hint:'طريق النيل'}]});

/* ============================================================
   ENDINGS
   ============================================================ */
def('ending',{chapter:10,mood:'hope',map:'m-borders',
text:function(s){
  const uthAlive=s.uthman&&s.uthman.alive;
  const score=s.hope+s.humanity+(uthAlive?20:0)+(s.flags.joined_err?15:0)+(s.flags.fair?8:0);

  const sBox=`<div class="stats-box">
    <div class="row"><span>القرارات</span><span>${s.stats.choices}</span></div>
    <div class="row"><span>عثمان</span><span>${uthAlive?(s.uthman.wounded?'حي مصاب':'حي'):'مفقود'}</span></div>
    <div class="row"><span>غرفة الطوارئ</span><span>${s.flags.joined_err?'نعم':'لا'}</span></div>
    <div class="row"><span>الأمل</span><span>${s.hope}%</span></div>
    <div class="row"><span>الإنسانية</span><span>${s.humanity}%</span></div>
    <div class="row"><span>العمر</span><span>${s.age}</span></div>
  </div>`;

  const analysis=`<div class="analysis"><h4>🔍 من أنت بعد كل هذا؟</h4>
${s.humanity>=70?'حافظت على إنسانيتك رغم كل شيء. في مكان لا يرحم، اخترت أن تبقى إنساناً. هذا نادر. هذا بطولي.':
s.humanity>=45?'وازنت بين النجاة والضمير. لم تكن ملاكاً، ولم تكن وحشاً. كنت إنساناً في حرب.':
'النجاة أخذت منك الكثير. لكنك نجوت. أحياناً هذا كل ما يمكن فعله.'}
</div>`;

  // MARTYR — you died but saved someone
  if(s.flags.sacrifice){
    markEnding('martyr');unlockAch('end_martyr');
    return `<div class="ending-h martyr">🌹 التضحية</div>
        لم تصل إلى الحدود.

        في غرفة الطوارئ، حين نظرت الطبيبة إليك وسألت عن الدم، لم تتردد. وحين سألوك أن تحمل جريحاً نحو السيارة، حملته.

        ثم سقطت.

        عثمان بجانبك. كان يبكي. لم تتكلم. فقط نظرت إليه وابتسمت.

        <span class="thought">💭 أنت تعرف أنك أنقذت أحداً. هذا يكفي.</span>

        <span class="quote">«بعض الناس لا يعيشون ليروا السلام. يعيشون ليصنعوه لغيرهم.»</span>
        ${sBox}${analysis}`;
  }

  // WITNESS — high humanity, ERR, uthman alive
  if(score>=115&&uthAlive&&s.flags.joined_err){
    markEnding('witness');unlockAch('end_witness');unlockAch('uthman_alive');
    return `<div class="ending-h peace">📖 الشاهد</div>
        عبرت الحدود. عثمان بجانبك.

        لكنك لم تتوقف. بدأت تكتب.

        أسماء من رأيت. أسماء من فقدت. أسماء من ساعدوك.
        اسم خالد الزبير. اسم الحاج محمود. اسم الفتاة التي كانت في غرفة الطوارئ.

        في المخيم، جلست كل صباح ومساء، وبدأت تحكي.

        حين سألك طفل: <span class="speaker">«من أنت؟»</span>
        قلت: <span class="speaker">«أنا من قرية قرب الفاشر. وهذه حكايتنا.»</span>

        لم تعد تنجو لنفسك فقط. صرت تحفظ الأسماء كما قال أبوك قبل ثلاثين سنة:
        <span class="speaker">«ما دمتَ تحفظ اسمك واسم قريتك، فلن تضيع.»</span>

        <span class="quote">«النجاة ليست أن تبقى حياً فقط. النجاة أن تحفظ الأسماء.»</span>
        ${sBox}${analysis}`;
  }

  // RENEWED — survived with Uthman but didn't join ERR
  if(uthAlive&&score>=70){
    markEnding('renewed');unlockAch('end_renewed');unlockAch('uthman_alive');
    return `<div class="ending-h peace">🌱 من جديد</div>
        عبرت الحدود. عثمان بجانبك.

        في المخيم، بدأت من جديد. أنت تعرف كيف تبدأ من جديد — فعلتها قبل ثلاثين سنة.

        عثمان بجانبك. ما زال شاباً. لكنه تعب. أنت أيضاً.

        في ليلة من الليالي، قال: <span class="speaker">«خمس عشرة سنة معك. أنت أخي.»</span>
        ثم صمت.

        بدأتما تفكران في المستقبل. في العودة. في البناء من جديد.
        لأنك تعرف: من نجا يحمل أمانة من لم ينجُ.

        <span class="quote">«بعض البشر يولدون مرتين: مرة من أمهاتهم، ومرة من رحم الحروب.»</span>
        ${sBox}${analysis}`;
  }

  // CROSSING — survived, uthman lost
  if(score>=55&&!uthAlive){
    markEnding('crossing');unlockAch('end_crossing');unlockAch('uthman_lost');
    return `<div class="ending-h peace">🚪 العبور</div>
        عبرت الحدود. وحدك.

        عثمان ليس بجانبك. أين هو؟ لا تعرف.
        ربما في الفاشر. ربما في مقبرة جماعية. ربما على طريق طويل.

        في المخيم، أعطاك المتطوعون ماءً وخبزاً وبطانية.
        جلست وحدك ليلة كاملة.

        ثم في الصباح التالي، بدأت تزرع.

        لأن عثمان كان سيقول لك: <span class="speaker">«قمت معي من الشارع. لن أتركك في النار.»</span>
        وهو لم يتركك. لكنك تركته. أو هكذا تشعر.

        <span class="quote">«من نجوا يحملون أمانة من لم ينجوا. هذا ما يعنيه أن تعيش.»</span>
        ${sBox}${analysis}`;
  }

  // BROKEN — survived with low humanity
  if(score<55){
    markEnding('broken');unlockAch('end_broken');
    return `<div class="ending-h broken">💔 المنكسر</div>
        عبرت الحدود. لكنك لم تعد أنت.

        الحرب أخذت آمنة. أخذت محمد ومريم. أخذت الحافلة والبيت.
        ثم أخذت شيئاً آخر: إنسانيتك.

        في المخيم، صرت تجلس وحدك. لا تتكلم. لا تبكي.
        تشاهد الآخرين يبنون ولا تبني.

        صرت تمشي في طرقات المدينة، تنظر إلى الأطفال، وترى فيهم وجوهاً لن تعود.

        <span class="quote">«بعض النجاة أقسى من الموت. بعض الناجين لا ينجون فعلاً.»</span>
        ${sBox}${analysis}`;
  }

  // Default to witness-lite
  markEnding('renewed');unlockAch('end_renewed');
  return `<div class="ending-h peace">🌱 من جديد</div>
      عبرت الحدود. جسدك هناك. روحك لا تزال تحاول.

      <span class="quote">«في السودان، هناك من يعيش هذا كل يوم. تذكرهم. ولا تدع الرماد ينسيك وجوههم.»</span>
      ${sBox}${analysis}`;
},
choices:[{t:'ابدأ من جديد',do:s=>{Object.assign(s,newState());updateHUD();updateCompUI();},to:'intro'}]});

def('death',{chapter:10,mood:'dark',map:'m-borders',
text:function(s){
  if(s.uthman&&s.uthman.alive){
    return `<div class="ending-h dark">🥀 الرماد الأخير</div>
        انهار جسدك.

        عثمان كان بجانبك. حاول. صرخ. حمل جسدك. لكنك كنت قد رحلت.

        <span class="thought">💭 لم تقل له وداعاً. لم تستطع.</span>

        <span class="quote">«بعض الناس لا يعيشون ليروا السلام. لكنهم يعيشون ليصنعوا من سيصنعه.»</span>`;
  }
  return `<div class="ending-h dark">🥀 الرماد الأخير</div>
      انهار جسدك.

      سقطت على رمال الطريق، أو في زاوية زنزانة، أو بين أنقاض بيتك.

      لا أحد كان بجانبك. لا أحد سيعرف أنك كنت هنا.

      <span class="quote">«في السودان، هناك من يموت كل يوم بلا اسم. تذكرهم. تذكر أنهم كانوا هنا.»</span>`;
},
choices:[{t:'حاول مرة أخرى',do:s=>{Object.assign(s,newState());updateHUD();updateCompUI();},to:'intro'}]});

initParticles();
S=newState();
render();
updateHUD();
updateCompUI();
</script>
