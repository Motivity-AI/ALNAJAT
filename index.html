<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>النجاة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4efe6;--fg:#2a2118;--card:#fff;--mut:#7a6a58;--ac:#b5541c;--bd:#d9cdbb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110d;--fg:#eee4d4;--card:#221b14;--mut:#a39482;--ac:#e0813f;--bd:#3a2f24;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px 30px}
h1{font-size:2.2rem;margin:30px 0 6px;color:var(--ac)}
.ch{font-size:.85rem;color:var(--ac);margin:4px 0 10px;font-weight:bold}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:.8rem}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;transition:width .5s}
.tx{font-size:1.1rem;line-height:2;margin:18px 2px;white-space:pre-line;animation:f .6s}
.btn{display:block;width:100%;text-align:right;margin:9px 0;padding:14px;font:inherit;font-size:1rem;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;cursor:pointer}
.btn:active{border-color:var(--ac)}
.art{width:100%;border-radius:14px;display:block;margin:10px 0 0;border:1px solid var(--bd)}
.fact{background:var(--card);border-right:4px solid var(--ac);padding:10px 12px;border-radius:8px;font-size:.88rem;line-height:1.8;color:var(--mut);margin:6px 0 12px}
#mb{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1.1rem;cursor:pointer;z-index:5}
.bt{display:flex;gap:6px;margin:0 0 8px 46px;flex-wrap:wrap}
.bt button{font:inherit;font-size:.78rem;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
#pn{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#pn.on{display:flex}
#pn>div{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto}
.it2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
#cb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,6,.92);color:#f0c27a;font-size:1.6rem;font-weight:bold;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .5s;z-index:8}
#cb.show{opacity:1}
#tt{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:90%;text-align:center}
#tt.on{opacity:1}
.mp{display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--mut);margin:0 0 8px;overflow-x:auto;white-space:nowrap}
.mp .on{color:var(--ac);font-weight:bold}.mp .ps{color:#3a8f6b}.mp i{flex:1;height:1px;background:var(--bd);min-width:8px}
.cp{background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:.82rem}
#ptc{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.pt{position:absolute;width:2px;height:2px;background:var(--ac);border-radius:50%;opacity:0;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(-20px);opacity:0}10%{opacity:.4}100%{transform:translateY(100vh);opacity:0}}
[dir=ltr] .bt{margin:0 46px 8px 0}
[dir=ltr] #mb{left:auto;right:12px}
[dir=ltr] .btn{text-align:left}
[dir=ltr] .fact{border-right:0;border-left:4px solid var(--ac)}
.pri{background:var(--ac);color:#fff;border:0;text-align:center}
.mut{color:var(--mut);font-size:.9rem;line-height:1.8}
.end{border:1px solid var(--ac);border-radius:12px;padding:6px 14px}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
</style>
</head>
<body>
<div id="ptc"></div><div id="app"></div><div id="pn" onclick="if(event.target===this)this.classList.remove('on')"></div><div id="cb"></div><div id="tt"></div><button id="mb" onclick="snd()" aria-label="الموسيقى">🔇</button>
<script>
const S={
d0:["الفصل الأول: دارفور","وُلدتَ في قرية قرب الفاشر، بين أشجار الهجليج وحقول الدخن. في ليلة الحصاد وضع أبوك في يدك سبحته الخشبية القديمة وقال: «ما دمتَ تحفظ اسمك واسم قريتك، فلن تضيع».\n\nكانت أمك تغني في الفناء، والنار تفوح بالقهوة والبخور... ثم جاء الصيف الذي تغيّر فيه كل شيء.",[["علّق السبحة حول عنقك","d0b",{p:10,F:"sb"}],["ضعها في جيبك واركض للعب","d0b",{}]]],
d1:["","أنت طفل في دارفور. كل صباح تستيقظ على صوت الرصاص ودوي الانفجارات. الليلة الماضية احترق بيت جيرانكم.\n\nقال أبوك بصوت منخفض: «لا بقاء هنا. سنرحل نحو النجاة قبل الفجر».",[["ساعد أمك في حمل الخبز والماء","d2",{f:10,F:"water"}],["ودّع كلبك الصغير","d2",{p:5}]]],
d2:["","مشيتم ليلتين. في المنعطف الثالث ظهرت سيارات بلا لوحات، وفوقها رجال ملثمون بالسلاح: الجنجويد.",[["اختبئ خلف الصخرة","d3",{}],["تمسّك بيد أمك","d3",{p:-5}]]],
d3:["","علت الصرخات والطلقات. وحين هدأ كل شيء، لم يبق من أسرتك أحد غيرك.\n\nأنت وحدك الآن.",[["ابقَ مختبئًا حتى يبتعدوا","jd",{p:-25,h:-10}],["اركض نحو الأشجار","jd",{p:-25,h:-20}]]],
d4:["","وراء الشجر رأيت سيارة لاند كروزر ورجلًا بزي عسكري يتحدث بالهاتف. إنه «المارشال»، يجنّد الجنجويد لحساب جهات في الجيش لزعزعة المنطقة.",[["تسلّل إلى صندوق السيارة","d5",{}],["اخرج وتوسّل إليه","x1",{}]]],
d5:["","من شقّ الصندوق سمعته يقول إنه ذاهب إلى الخرطوم: يرفع تقاريره ويستلم عمولاته وسلاحه. السيارة تهتز على الطريق، وعطشك يشتد.",[["اشرب من قارورة مهملة وخذ حقيبة إسعاف وجدتها في الصندوق","d5b",{f:10,F:"med"}],["اصبر على العطش","d5b",{f:-15,h:-10}],["اسحب دفترًا جلديًا صغيرًا لمحتَه بجانبك دون أن يراك","d5b",{p:5,F:"ldg"}]]],
d6:["","بعد أيام وصلتم العاصمة. توقفت السيارة قرب سوق. لصغر حجمك لم يلحظك أحد.\n\nقفزت وجريت.",[["تابع","m1",{}]]],
m1:["الفصل الثاني: الخرطوم","سوق صاخب. ناس تضحك وتشتري وتبيع. لا قتل ولا موت!\n\nلكن بطنك يؤلمك.",[["اطلب المال من المارة","m2",{}],["ابحث عن عمل","m3",{}]]],
m2:["","مرّ العشرات. بعضهم أشاح بوجهه، وبعضهم قال: «يلا يا ولد». لم يعطك أحد شيئًا.",[["جرّب العمل بدل التسوّل","m3",{f:-10,p:-10}]]],
m3:["","عرض عليك صاحب مطعم صغير غسل الصحون مقابل وجبة وبعض الجنيهات.",[["اعمل بإخلاص","m3b",{f:30,m:30,h:-5}],["اعمل واخطف وجبة إضافية","m3b",{f:40,m:20,p:-5}]]],
m4:["","بعد مدة طردك صاحب المطعم، لأنه أراد مكانك لقريب له.",[["ارحل بصمت","s1",{p:-5}],["احتجّ عليه","s1",{p:-10,h:-5}]]],
s1:["","اشتريت بما جمعته مواد تنظيف بالتجزئة: صابون وكلور ومعطّر، وجلست على الرصيف. صار الرصيف بيتك.",[["اجلس قرب المسجد","s1b",{m:40}],["جُب الأحياء","s1b",{m:30,h:-10}]]],
s2:["","مرّت سنتان من الصيف الحارق والمطر والجوع. صار معك مبلغ لا بأس به.",[["ادّخر المبلغ","u1",{m:20,f:-10}],["اشترِ بضاعة ووزّعها على من عرفتهم؛ يدفعون لك كل يوم","u1",{m:50,p:10}]]],
s3:["","بعد سنة اشتريت دراجة، وصرت تبيع التسالي والفول السوداني والدوم والقنقليز، وتنام في الطرقات.",[["اعمل ليلًا ونهارًا","s4",{m:60,h:-15}],["اعمل وخذ قسطًا من الراحة","s4",{m:40,h:5}]]],
s4:["","بعد سنين الكفاح اشتريت ركشة وبدأت تنقل الناس.",[["انقلهم بإنصاف","s5",{m:50,p:10}],["ارفع الأجرة على المضطرين","s5",{m:80,p:-10}]]],
s5:["","ثم جاء اليوم الذي اشتريت فيه حافلة صغيرة «كريز». سنين وسنين وأنت تعمل عليها، ثم اشتريت بيتًا في أطراف العاصمة وحفظتَ وثائق ملكيتهما في حقيبتك.",[["تابع","s5b",{h:5,F:"docs"}]]],
s6:["","اجتهدت وتزوجت، ورُزقت بأبناء. كان البيت يضحك. نسيت أن الحزن يمكن أن يعود.\n\nوفكرت أن تشتري حافلة ثانية.",[["تابع","s6b",{}]]],
r1:["الفصل الثالث: ديسمبر","في ديسمبر 2018 اختفى الخبز من الأفران وطالت صفوف الوقود وارتفعت الأسعار. خرج الناس إلى الشوارع يهتفون: «حرية، سلام، وعدالة».\n\nتقف حافلتك قرب الميدان، وشبان كثيرون يركضون بإصابات.",[["انقل الجرحى مجانًا","r2",{p:10,h:-10,F:"hero"}],["واصل عملك لتحمي رزقك","r2",{m:40}]]],
r2:["","في أبريل 2019 سقط حكم البشير، وامتلأ الميدان أمام القيادة العامة بالخيام والأغاني والرسوم على الجدران. لأول مرة منذ طفولتك شعرت أن الخوف يمكن أن يُهزم.\n\nثم في الثالث من يونيو فُضّ الاعتصام بالرصاص وسقط كثيرون.",[["احتفظ بالأمل رغم كل شيء","s6",{p:10}],["أغلق قلبك: السياسة لا تطعم أحدًا","s6",{p:-10}]]],
q1:["","رمضان 2023. الشائعات تسري: حشود عسكرية في الأحياء، وتحرّكات ليلية، وتوتر بين الجيش وقوات الدعم السريع. الجيران يتهامسون ويخزّنون.",[["خزّن ماءً وطعامًا ووقودًا","w1",{m:-30,F:"st"}],["لا تقلق، وأعدّ عيدًا جميلًا لأسرتك","w1",{p:5}]]],
w1:["الفصل الرابع: الحرب مرة أخرى","في اليوم الذي اشتريتها فيه، اندلعت الحرب في الخرطوم.\n\nنفس الدوي. نفس الرائحة. نفس الخوف الذي هربت منه طفلًا.",[["ابقَ في البيت مع أسرتك","jw",{}],["اهرب بهم من الحي","jw",{}]]],
w2:["","اقتحمت المجموعات المسلحة الحي. سُرق كل ما تملك، حتى الحافلتان. طُردتم من منزلكم.\n\nوفي ساعات لا توصف فقدت زوجتك وأولادك.",[["قاوم بيدين خاليتين","x2",{}],["لا تقاوم لتبقى حيًا","e1",{p:-30}]]],
d5b:["","وسط العتمة تحرّك شيء بجانبك: ولد في سنك يُدعى عثمان، كان مختبئًا قبلك بين الأكياس وعيناه واسعتان من الخوف. همس:\n— «لا تتحرك... إن سمعنا الرجال قتلونا».\nكان يرتجف من العطش.",[["اقتسم معه قربة الماء","d6",{p:10,F:"os",X:"water"},"water"],["اطلب منه أن يبقى معك وإن لم تملك ماءً","d6",{p:5,F:"os"}],["ابتعد وراقبه بحذر","d6",{p:-5}]]],
u1:["","أم درمان صباحًا: رائحة البهارات والجلود وصيحات الباعة. عند باب السوق وجدتَ ثلاث فرص في يوم واحد، ولا تتسع قوتك إلا لواحدة.",[["احمل بضائع التجار على ظهرك: تعب لكنه مال","u2",{m:60,h:-10,f:-5}],["ساعد بائعة عجوز في فرش بضاعتها مقابل وجبة وكلمة طيبة","u2",{f:20,p:10,F:"zn"}],["بِع المناديل والبخور في الزحام","u2",{m:35,p:5}]]],
u2:["","عند الغروب جلستَ تعدّ ما كسبتَ. مرّ بك رجل يبيع الدراجات المستعملة وقال: «الشاب الذي يدّخر اليوم يركب غدًا».",[["ادّخر لشراء دراجة","s3",{m:20}],["أعطِ جزءًا من مالك لمن هو أحوج منك","s3",{m:-20,p:15}]]],
g1:["","في غرفة طوارئ الحي جلس شبان من لجنة المقاومة حول كشف بأسماء الأسر: من يحتاج دواءً، من فقد أباه، من ينقصه الماء. قالت لك فتاة بحقيبة ظهر:\n— «ما معنا مال، معنا بعضنا. تعال».",[["وزّع الطعام والماء على البيوت الجريحة","h1",{f:-5,h:-5,p:15,F:"er"}],["ساعد في تسجيل الأسماء والأدوية لينتقل المرضى","h1",{p:12,F:"er"}]]],
k1:["الفصل: ود مدني","وصلتَ ود مدني بعد أيام من الطريق. المدينة التي كانت هادئة امتلأت بنازحي الخرطوم: المدارس مأوًى، وعلى الأرصفة أسر تنام، والأسعار تتضاعف كل أسبوع. لكن الناس هنا فتحوا بيوتهم وأبوابهم.\n\nولأول مرة منذ شهور سمعتَ ضحكة طفل.",[["افتح كشك شاي صغيرًا عند محطة الحافلات","jk",{m:25,p:10,F:"ks"}],["ساعد الأستاذة هالة في تعليم أطفال المأوى القراءة","jk",{p:15,F:"hl"}],["انتظر هدوءًا لا يجيء","jk",{p:-5}]]],
k2:["","ديسمبر 2023. بدأ الهمس: الجيش ينسحب، والدعم السريع على مشارف الجزيرة. ثم انفجر الخبر عند الفجر. خرج الناس مرة ثانية إلى الطرق: أمهات يحملن صغارهن، وشيوخ على العربات، وسيارات تتزاحم على الجسر.\n\nمن أول مرة شعرتَ أن الأرض تتحرك من تحتك.",[["اهرب مع آخر الحافلات نحو القضارف","gd",{h:-10,f:-10}],["ساعد عجوزًا لا تقوى على المشي حتى تلحق بالقافلة","gd",{h:-15,f:-10,p:15,F:"el"}],["اختبئ في المدرسة وانتظر أن يمرّ الوقت","w3",{p:-10}]]],
gd:["","وصلتَ القضارف ليلًا. استقبلتك مدرسة صارت مأوًى، ونام الناس على الأرض متجاورين. جلس إلى جوارك شاب يحمل راديو صغيرًا يلتقط نشرة الأخبار: هدنة؟ مفاوضات؟ لا أحد يعرف.\n\nقال لك المتطوعون: «الحرب بعيدة هنا، والخوف قريب».",[["ابقَ في المأوى وساعد المتطوعين","fin",{f:5,p:10}],["واصل نحو الحدود بحثًا عن عبور","bd",{h:-5}]]],
fs1:["الفصل: الفاشر","وصلتَ الفاشر بعد أسابيع من الطريق. المدينة التي وُلدتَ قربها محاصرة منذ شهور: لا قوافل تدخل، والسوق شبه خالٍ، والناس يطبخون أوراق الأشجار وعلف الحيوانات. طفل بجانب الطريق يسأل بصوت خافت: «معك خبز؟».",[["اقتسم ما معك مع الطفل وأمه","jf",{f:-15,p:10,F:"fk"}],["اتجه مباشرة نحو غرفة الطوارئ","jf",{p:5}]]],
fs2:["","في زقاق ضيق وجدتَ مطبخًا جماعيًا تديره غرفة طوارئ. قالت لك طبيبة شابة:\n— «ما معنا إلا قدر واحد وصبر. نحتاج متبرعين بالدم».\nعلى سرير خشبي رجل يتنفس بصعوبة.",[["تبرّع بدمك لإنقاذ المصاب ولو أنهكك ذلك","fs3",{h:-30,p:15,F:"sac"}],["وزّع الطعام والماء على المنتظرين","fs3",{f:-10,p:12,F:"fk"}],["خذ ما تحتاجه وارحل قبل أن يشتد الحصار","fs3",{f:15,p:-10}]]],
fs3:["","دوّت المدافع من جديد. اقتحمت القوات الأطراف، وتحدثت التقارير لاحقًا عن مجازر وهروب جماعي. خرج الناس في الظلام يحملون صغارهم وما استطاعوا.\nنظرتَ خلفك آخر مرة، ثم تذكّرتَ وصية أبيك: «لا تلتفت».",[["ضمّد جراح من بجانبك بحقيبة الإسعاف","bd",{h:-5,p:15,F:"fk",X:"med"},"med"],["امضِ مع الجموع نحو الحدود","bd",{h:-10,f:-10}]]],
s5b:["","ليلة ممطرة على طريق أم درمان. أوقف الحافلةَ ثلاثةُ شبان ملثمين وطلبوا المفاتيح. في المقعد الخلفي امرأة حامل وطفلان نائمان، والمطر يطرق السقف.\nقال أحدهم: «انزل بهدوء ولا يصيبك شيء».",[["حاورهم: «أنا من دارفور وأعرف الجوع، فخذوا ما شئتم من جيبي واتركوا الحافلة»","r1",{p:15,F:"hum"},null,.6],["اضغط على الوقود وانطلق بأقصى سرعة","r1",{p:5},null,.5],["سلّمهم المفاتيح واحمِ من في الحافلة","r1",{m:-80,p:-10}]]],
q4:["","في الصباح نادوك إلى غرفة القائد: رجل بدين خلف مكتب خشبي، وعلى المكتب علبة سجائر ومسدس وراديو يبثّ أخبارًا. نظر إليك طويلًا وقال: «أنت من دارفور؟ لهجتك تفضحك».\nكان الصمت أثقل من الضرب.",[["أخرج الدفتر الجلدي وضعه على المكتب","p4",{p:20,h:10,F:"ld2",X:"ldg"},"ldg"],["أخرج سبحة أبيك واذكر اسمه","p4",{p:15},"sb"],["قل إنك سائق لا شأن لك","p4",{p:-5}],["حدّثه عن أبنائك الذين فقدتهم","p4",{p:10,h:-5}]]],
d3b:["","في اليوم الثالث لمحتَ راعيًا عجوزًا اسمه آدم يسوق عنزات هزيلة. ناولك حفنة تمر وقال: «يا ولدي، أرى سيارة بلا لوحات تمرّ كل أسبوع. لا تقترب من الرجال الذين يضحكون وبأيديهم أسلحة».",[["اسمع نصيحته وابقَ معه ليلة","d4",{p:10,f:10,F:"ad"}],["اشكره وامضِ وحدك","d4",{}]]],
s6c:["","يوم جمعة على ضفة النيل عند المقرن، حيث يلتقي الأزرق بالأبيض. يوسف يطارد كرة، ومريم تبني بيتًا من الرمل وتقول: «هذا بيتنا الجديد يا بابا». ضحكت آمنة بصوت عالٍ لأول مرة منذ شهور.",[["اشترِ لهم الآيس كريم وعلّمهم السباحة","q1",{p:12,m:-15,F:"joy"}],["ابقَ على العتبة تحسب الديون","q1",{m:20,p:-5}]]],
d0b:["","جدّتك حواء تجلس تحت شجرة الهجليج وتحكي للأطفال حكاية «الشجرة التي لا تُقطع»: كلما قطعها الغزاة نبتت من جذورها.\n— «الناس مثلها يا ولدي. اقطعهم ينبتون في مكان آخر».\nثم تهمس: «إن اضطررتَ للرحيل فاحمل اسمك معك».",[["اسألها: وماذا لو لم تبقَ لي جذور؟","d1",{p:10,F:"gr"}],["ضع رأسك على كتفها صامتًا","d1",{p:5,h:5}]]],
m3b:["","في المطبخ كان الطباخ عمّ إدريس، عجوز بلا أسنان تقريبًا، يراقبك وأنت تغسل. في آخر الليل ناولك صحنًا من العدس وقال:\n— «تغسل كأنك تهرب من شيء. الرزق صبر يا ولد. من أين أنت؟»\nلم تعرف هل تقول الحقيقة.",[["احكِ له كل شيء عن دارفور","m4",{p:10,f:10,F:"id tea"}],["قل إنك يتيم من الأطراف وكفى","m4",{p:-5}]]],
s1b:["","في الليالي الباردة كان ينام بجانبك على الرصيف ولد في سنك اسمه سلمان، يبيع المناديل. اقتسم معك غطاءً ممزقًا وقال:\n— «في الشارع من لا أحد له يصير أخًا لمن لا أحد له».",[["اقتسم معه ما تربحه كل يوم","js",{m:-15,p:15,F:"sl"}],["احتفظ بمالك: الأمان أولًا","js",{m:10,p:-10}]]],
s6b:["","مساء الجمعة جلست زوجتك آمنة على عتبة الدار والأولاد، يوسف ومريم، يتسابقون في حلّ واجباتهم تحت ضوء المصباح. سألتك بهدوء:\n— «أراك أحيانًا تحدّق في الفراغ. ما الذي تحمله وحدك؟»\nضحك الصغار من بعيد، وكان قلبك ثقيلًا.",[["احكِ لها عن دارفور وعن أهلك","s6c",{p:15,F:"told"}],["ابتسم وغيّر الحديث: الماضي ماضٍ","s6c",{p:-5}]]],
h1:["","في فصل من المدرسة حوّل متطوعون غرفة إلى مستشفى ميداني بلا كهرباء، يعملون على ضوء الهواتف. نادتك الطبيبة الشابة نهى بعينين محمرّتين من السهر:\n— «أحتاج يدين إضافيتين. المصابون كثر والدواء لا يكفي».\nرأيت طفلًا محمومًا وأمه تبكي.",[["ساعد في حمل المصابين وتهدئة الأطفال","e2",{h:-10,p:15,F:"dr"}],["ابتعد: لا طاقة لك على رؤية المزيد","e2",{p:-10,h:5}]]],
q3:["","جاءوا بفتى في الخامسة عشرة اسمه ياسر، يرتجف. ضربه حارس لأنه طلب ماءً. نظر إليك كمن يبحث عن أبٍ يحتمي به.",[["ضمّه إليك وتحمّل الضرب عنه","p2",{h:-15,p:20,F:"ys"}],["ابتعد حتى لا تُضرب","p2",{p:-15}]]],
z1:["","في الطريق مررت بحيّك القديم: سور بيتك مثقوب بالرصاص والباب مخلوع. وجدتَ في الركن حقيبة مدرسية صغيرة مغطاة بالغبار عليها اسم «مريم».\n\nجلستَ على العتبة طويلًا.",[["احملها معك","o2",{p:10,F:"bag"}],["اتركها: لا تحتمل أن تحملها","o2",{p:-5}]]],

e1:["الحصار والنزوح","لجأتَ مع عشرات الهاربين إلى مدرسة مهجورة في الحي. انقطعت الكهرباء ثم المياه ثم شبكة الهاتف، وصارت الأسواق نهبًا.\n\nجاءتك جارتك أم حسن، امرأة ستينية كانت تبيع الشاي عند ناصية الشارع، وفي يدها وعاء صغير:\n— «يا ولدي، البئر عند آخر الحي ما زال فيه ماء، لكن القنّاصة يراقبون الطريق. حفيدي عطشان».\n\nنظرتَ إلى جالونك شبه الفارغ.",[["شاركها مياهك واذهب معها إلى البئر","je",{f:-10,h:-10,p:15,F:"um"}],["اعتذر: لا يكفيك أنت","je",{p:-15,f:5}],["انضم إلى غرفة طوارئ الحي التي بدأها الشباب","g1",{p:10}]]],
e2:["","اجتمع الناس على حافلة صغيرة نحو ود مدني. عند الحاجز الأخير وقف شاب مسلح يطلب الهويات والهواتف، ثم نظر إلى وجهك وقال بنبرة تتغيّر:\n— «من أين أنت؟».\n\nصمت الركاب.",[["أجب بهدوء وبلا تحدٍّ","k1",{h:-10}],["اعرض وثائقك لتثبت من أنت","k1",{p:5},"docs"],["ارفع صوتك محتجًّا","x4",{}],["قف بين أم حسن وبينه واحمِها","k1",{p:15,h:-15},"um"]]],
q2:["","في الليل همس لك رجل نحيل بنظارات مكسورة:\n— «أنا الأستاذ صلاح، كنت مدرّس تاريخ في أم درمان. هنا يريدون أن ننسى أسماءنا، فلنحفظها. أنا صلاح. وأنت؟»",[["قل له اسمك واسم قريتك كما علّمك أبوك","q3",{p:15}],["اصمت، فالثقة هنا خطر","q3",{p:-5}]]],

const F={d1:"منذ 2003 اندلع نزاع دارفور، وارتبطت ميليشيات الجنجويد بعمليات قتل وتهجير واسعة بحق المدنيين؛ قُدّر أن مئات الآلاف قُتلوا ونزح ملايين.",m1:"الخرطوم تلتقي فيها النيلان الأزرق والأبيض عند المقرن، وقصدها كثيرون هربًا من حروب الأقاليم.",s2:"الباعة المتجولون وستات الشاي والاقتصاد غير الرسمي يعيلون جزءًا كبيرًا من الأسر السودانية.",r2:"أطاحت الاحتجاجات التي بدأت في ديسمبر 2018 بحكم عمر البشير في أبريل 2019، وفُضّ اعتصام القيادة العامة بعنف في 3 يونيو 2019.",w1:"اندلع القتال بين الجيش وقوات الدعم السريع في 15 أبريل 2023، وانتقل إلى أحياء الخرطوم السكنية، ونزح لاحقًا ملايين السودانيين داخل البلاد وخارجها.",h1:"خرجت نسبة كبيرة من المستشفيات في مناطق القتال عن الخدمة، وعمل أطباء ومتطوعون في ظروف قاسية.",bd:"عبر ملايين السودانيين إلى مصر وتشاد وجنوب السودان وغيرها هربًا من الحرب، وواجه كثيرون طرقًا شاقة وانتظارًا طويلًا عند المعابر.",k1:"استقبلت ود مدني بعد اندلاع الحرب مئات الآلاف من نازحي الخرطوم، وكانت من أكثر المدن أمانًا قبل سقوطها.",k2:"في ديسمبر 2023 دخلت قوات الدعم السريع ولاية الجزيرة وسقطت ود مدني، فنزح مئات الآلاف مرة ثانية.",gd:"أكدت جهات دولية في 2024 حدوث مجاعة في مخيم زمزم بشمال دارفور، وقدّرت وكالات أممية أن ملايين السودانيين يحتاجون إلى غذاء عاجل.",w2:"رعت السعودية وأمريكا محادثات جدة في 2023، لكن الهدن المتتالية انهارت مرارًا.",p1:"وثّقت منظمات حقوقية احتجازًا تعسفيًا وظروفًا قاسية في أماكن الاحتجاز بمناطق القتال.",o2:"تفشّت الكوليرا وحمى الضنك في مناطق النزوح، وانقطع الإنترنت والاتصالات عن البلاد لفترات.",fs1:"حاصرت قوات الدعم السريع الفاشر منذ مايو 2024 وانقطعت عنها الإمدادات، وتحدثت جهات أممية عن مجاعة في مخيمات حولها.",fs3:"تحدثت تقارير أممية وحقوقية عن مجازر وانتهاكات واسعة بعد دخول قوات الدعم السريع الفاشر في أواخر 2025.",e2:"تحدثت تقارير حقوقية عن انتهاكات وتوقيفات تعسفية عند الحواجز خلال الحرب.",o1:"أقام شباب لجان المقاومة غرف الطوارئ، وهي مبادرات تطوعية وفّرت الغذاء والدواء والإجلاء للمدنيين، ورُشّحت لجائزة نوبل للسلام."};

const RS=["e2","k1","z1","o2","bd","fs1","jd","js","je","jp","jb","jf","jk","jw"],RV=[["مرّت بك قافلة نازحين، فأعطتك امرأة كسرة خبز دون أن تسأل.",{f:12,p:5}],["هبّت عاصفة غبار أخفت الطريق وأتعبتك.",{h:-8,f:-5}],["التقط راديو قديم عند بائع خبر هدنة قصيرة، فابتسم الناس لأول مرة منذ أيام.",{p:10}],["سمعتَ رصاصًا بعيدًا فاختبأتَ ساعة في خراب مظلم.",{p:-6,e:-8}],["دلّك فتى على بئر قريبة لم يكن يعرفها أحد.",{f:8,h:5}],["وجدتَ على جانب الطريق حذاءً صغيرًا وحيدًا. وقفتَ عنده لحظة ثم أكملت.",{p:-8}]];

function go(n){
 xt="";s.vs=s.vs||{};s.vs[n]=1;if(AH[n])ach(AH[n]);if(DY[n]&&!s.dy.includes(DY[n]))s.dy.push(DY[n]);

 if(n==="u2"&&s.zn){s.p=cl(s.p+10);xt="\n\nجاءتك ستّ الشاي زينب بكوب شاي بالنعناع وقالت: «يا ولدي، المدينة تأكل من لا صاحب له. اجعل لك أصحابًا قبل أن تجعل لك مالًا». حفظتَ كلماتها في صدرك."}
 if(n==="s2"&&s.os){s.m+=40;xt="\n\nعثمان، رفيقك القديم من الصندوق، يعمل معك في السوق ويقتسم عنك العبء."}
 if(n==="w1"&&s.os){s.f=cl(s.f+10);xt="\n\nجاءك عثمان وقال: «أعرف المسالك نحو الحدود، خذ هذا الخبز»."}
 if(n==="bd"&&s.os){s.h=cl(s.h+10);s.f=cl(s.f+10);xt="\n\nوقف عثمان إلى جانبك: «أعرف مسالك الطريق وآباره»."}

 if(n==="p4"&&s.ld2){s.h=cl(s.h+10);xt+="\n\nتغيّر وجه القائد حين رأى اسم المارشال في الصفحة الأولى. صمت، ثم قال بصوت خافت: «من أين لك هذا؟». وبعد منتصف الليل فُتح بابك وحدك وهمس لك حارس: «اخرج قبل أن يغيّر رأيه».\nلم يبقَ الدفتر معك."}
 if(n==="o2"&&s.um){s.p=cl(s.p+10);xt="\n\nفي التكية لمحتَ أم حسن وحفيدها، فصاحت باسمك. لم يبقَ لك أهل... لكن بقي لك جيران."}
 if(n==="o1"&&s.hero){s.f=cl(s.f+10);xt="\n\nمرّ بك سائق عرفك أيام الاعتصام، وناولك كسرة خبز وقال: «من حمل الجرحى لا يُترك»."}
 RE(n);id=n;const sc=S[n];

 render(sc)}

 if(!f2)for(const k in e){if(k==="F")e.F.split(" ").forEach(x=>s[x]=1);else if(k==="C")s.C=e.C;else if(k==="X")s[e.X]=0;else s[k]=k==="m"?s.m+e[k]:cl(s[k]+e[k])}
 s.e=cl(s.e+((e.f||0)+(e.h||0))/2);s.c=cl(s.c+Math.sign(e.p||0)*8+(/sh|um|ys|sl|os|dr|hero|hl|el|sac|fk/.test(e.F||"")?8:0));

function fin(){
 if(s.h<=0)return over("أنهكتك الإصابات والتعب ولم يعد جسدك يحتمل.");

 const ok=s.p>=55&&s.h>=25&&s.f>=15&&!s.b,ok3=s.b&&s.h>=30&&s.f>=15,ok4=ok&&s.bag&&s.sb,ok5=ok&&s.er,ok6=!ok&&!ok3&&s.c<25,ok7=!!s.sac,ok8=!!s.ldg&&(ok||ok3);
 const t=ok7?`<b>النهاية: التضحية</b>\n\nفي الفاشر قدّمتَ دمك لمن لا تعرف. لم يكن الطريق إلى الأمان سهلًا، لكن إنسانًا نجا لأنك كنت هناك. بعض الناس لا يعيشون ليروا السلام؛ يعيشون ليصنعوه لغيرهم.`:ok8?`<b>النهاية: الدفتر</b>\n\nنجوتَ ومعك الدفتر الجلدي الذي سحبتَه طفلًا من سيارة المارشال. في غرفة صغيرة بمنظمة توثيق حقوقية فتحوه: أسماء وتواريخ وأرقام وأوامر وعمولات. جلست الباحثة أمامك صامتة، ثم قالت: «أنت لا تعرف ما حملتَ كل هذه السنين». لأول مرة لم تكن حكايتك ذاكرةً وحدها، بل وثيقة.`:ok4?`<b>النهاية: الشاهد</b>\n\nجاء السلام ناقصًا كما يأتي دائمًا. في المخيم جلستَ مع الناجين، وبدأت تدوّن الأسماء: أسماء من رحلوا ومن بقوا. علّقتَ سبحة أبيك على عمود الخيمة، ووضعتَ حقيبة مريم عند رأسك.\n\nوحين سألك طفل: «من أنت؟» قلتَ: «أنا من قرية قرب الفاشر، وهذه حكايتنا». لم تعد تنجو لأجل نفسك فقط، بل لتحفظ الأسماء كما قال أبوك.`:ok5?`<b>النهاية: غرفة الطوارئ</b>\n\nلم تغادر الخرطوم. بقيتَ مع شباب الحي تفتحون المطبخ الجماعي كل صباح وتكتبون أسماء المحتاجين. حين جاء الهدوء الهشّ، كنتَ أول من فتح الباب لمن عاد منهكًا. لم تستعد بيتك، لكنك صرتَ بيتًا لغيرك.`:ok3?`<b>النهاية: ${BT[s.C||"eg"]}</b>\n\n${BE[s.C||"eg"]}`:ok6?`<b>النهاية: رماد القلب</b>\n\nنجوتَ بجسدك، لكن شيئًا فيك احترق. كل ما فعلته للبقاء لم يترك لك أحدًا تعود إليه، وجلستَ وحيدًا في بيت بلا ضحك. القوة وحدها لا تكفي ما لم يصحبها قلب.`:ok?`<b>النهاية: سلام ينقذك</b>\n\nبعد أسابيع جاء الخبر: اتفاق وهدنة. خرج الناس من بيوتهم المهدّمة يبكون ويحتضنون بعضهم. تلقّفتك أيادٍ طيبة من المطبخ الجماعي، وأعطتك ماءً وخبزًا وبطانية.\n\nفقدت كثيرًا، لكنك حيّ. وفي الصباح التالي، وقفت على الرصيف مرة أخرى، وبدأت من جديد، وأنت تعلم أن من نجا يحمل أمانة من لم ينجُ.`:`<b>النهاية: حرب لا تنتهي</b>\n\nلم يأتِ السلام في الوقت المناسب. طال الحصار وانقطع الغذاء، وكان جسدك قد أُنهك. جلست على رصيف مدينتك، تتذكر أبناءك وضحكة بيتك، وأغمضت عينيك آخر مرة.\n\nكم من الناس ما زالوا هناك، ينتظرون سلامًا يصل متأخرًا؟`;
