d0d:[
["وعدتَ طارق أن تلقاه يومًا. كان وعدًا طفوليًا صغيرًا، لكنه كبر معك وصار من أثقل ما حملت.","You promised Tariq you would meet him one day. It was a small childish promise, but it grew with you and became one of the heaviest things you carried."],
["ابتسمتَ ولم تقل شيئًا. لم تكن تعرف أنها آخر مرة ترى فيها طارق، وأن ابتسامتك ستكون كل ما يبقى في ذاكرتك عنه.","You smiled and said nothing. You didn't know it was the last time you would see Tariq, and that your smile would be all that remained of him in your memory."]
],
d1:[
["ساعدتَ أمك في حمل الخبز والماء قبل الفجر. كان ذلك آخر عمل تقوم به معها، وآخر مرة تلمس فيها يداها الخشنتان يديك.","You helped your mother carry bread and water before dawn. That was the last task you did with her, and the last time her rough hands touched yours."],
["ودّعتَ كلبك الصغير الذي كان يلاحقك كظلّك. لسنوات بعدها، كل كلب تراه في الطريق كان يشبهه، وكان يوقظ فيك شيئًا لا يهدأ.","You said goodbye to your puppy who followed you like a shadow. For years after, every dog you saw on the road resembled him, waking something in you that would not settle."]
],
d2:[
["اختبأتَ خلف الصخرة. بقيتَ هناك ساعة كاملة سمعتَ فيها كل شيء: الصرخات، الطلقات، ثم الصمت الذي جاء بعدها وكان أثقل من كل شيء.","You hid behind the rock. You stayed there a full hour hearing everything: the screams, the shots, then the silence that came after, heavier than everything."],
["تمسّكتَ بيد أمك بقوة، لكن اليد كانت تفلت منك ببطء. لم تكن تعرف أنك تحمل يدها للمرة الأخيرة، وأنك ستقضي عمرك تبحث عن يد تشبهها.","You held your mother's hand tightly, but the hand was slowly slipping from you. You didn't know you were holding her hand for the last time, and that you would spend your life looking for a hand like hers."]
],
d2b:[
["احفظتَ اسم خالك موسى في قلبك كأنه تعويذة. صار الاسم بابًا في جدار لا باب له، وخيطًا في متاهة لا مخرج منها.","You memorized your uncle Musa's name in your heart like a charm. It became a door in a wall without doors, a thread in a maze without exit."],
["قلت لأمك: «لن نضيع». لم تكن تعرف كم ستكون هذه الكلمة ثقيلة، وأنك ستقضي سنوات تحاول أن تُبقيها صحيحة.","You told your mother: 'We won't be lost.' You didn't know how heavy those words would become, and that you would spend years trying to keep them true."]
],
d3:[
["بقيتَ مختبئًا حتى غادر الجميع. حين خرجت، لم يكن هناك شيء يشبه البيت، ولا شيء يشبه تلك الحياة التي عشتها قبل يومين.","You stayed hidden until everyone left. When you came out, nothing resembled home, and nothing resembled the life you had lived two days earlier."],
["ركضتَ نحو الأشجار. لم تنظر خلفك، لكنك سمعتَ كل شيء. صار الركض هو أول قرار كبير في حياتك، وأول هروب من نوع جديد.","You ran toward the trees. You didn't look back, but you heard everything. Running became the first big decision of your life, and the first escape of a new kind."]
],
d3b:[
["استمعتَ لنصيحة آدم وبقيتَ معه ليلة. كان شيخًا هزيلًا يسوق عنزات هزيلة، لكنه كان يعرف الطريق — وكان يعرف كيف يحمي ولدًا لا يعرفه.","You listened to Adam's advice and stayed with him a night. He was a frail old man herding frail goats, but he knew the way — and he knew how to protect a boy he didn't know."],
["شكرتَه وواصلت وحدك. لم تكن تعرف أنك ستحتاج نصيحته قريبًا، وأن الصحراء تعطي دروسها مرة واحدة فقط.","You thanked him and continued alone. You didn't know you would need his advice soon, and that the desert teaches its lessons only once."]
],
d5:[
["شربتَ من قارورة مهملة وأخذت حقيبة إسعاف. صار الماء في جسدك حياة، وصارت الحقيبة في يدك أملًا.","You drank from a discarded bottle and took a first-aid kit. The water in your body became life, and the kit in your hand became hope."],
["صبرت على العطش. في الصندوق المظلم، صار العطش صديقًا يعلّمك الصبر، وأخًا يعلّمك أن الجسد يمكن أن يتجاوز ما تظن.","You endured the thirst. In the dark trunk, thirst became a friend teaching you patience, a brother teaching you that the body can exceed what you think."],
["سحبتَ الدفتر الجلدي من بين الأكياس وأخفيته في ثيابك. لم تكن تعرف أنه سيصير أثمن من المال والذهب، وأنه سيحفظ ما لا تحفظه الذاكرة.","You pulled the leather notebook from between the bags and hid it in your clothes. You didn't know it would become more precious than money and gold, and that it would preserve what memory cannot."]
],
d5b:[
["اقتسمت مع عثمان قربة الماء. صار الماء دمًا بينكما، وصار عثمان أخًا لم تلده أمك.","You shared the water flask with Uthman. The water became blood between you, and Uthman became a brother your mother did not bear."],
["طلبت منه أن يبقى معك رغم أن الماء لم يكن يكفي. كانت الرفقة أولوية أكبر من البقاء، وأنت لم تكن تعرف بعد أن هذا سيكون قانون حياتك.","You asked him to stay with you even though the water was not enough. Companionship was a bigger priority than survival, and you didn't yet know this would become the law of your life."],
["ابتعدت وراقبته بحذر. لم تكن قاسيًا، كنت فقط خائفًا. لكنك تعرف اليوم أن بعض الخوف يترك أثرًا أكبر من بعض الجراح.","You moved away and watched him carefully. You weren't cruel, only afraid. But you know today that some fear leaves a deeper mark than some wounds."]
],
d5c:[
["كتمتَ أنفاسك حتى كاد صدرك ينفجر. سمعت كل شيء: النقود، الضحك، عدّ الخطوات، ووقع الأحذية على الحصى.","You held your breath until your chest nearly burst. You heard everything: the money, the laughter, the counting of steps, and the sound of boots on gravel."],
["اختلستَ النظر من شقّ الصندوق. حفظت الوجوه وحفظت الأصوات. كنتَ تحفظ دليلًا دون أن تعرف أن هذا سيصير واجبك يومًا.","You stole a glance through the crack in the trunk. You memorized the faces and voices. You were preserving evidence without knowing this would one day become your duty."]
],
d5d:[
["بكيتَ بصمت حتى نام عثمان. لم تكن تعرف أن الدموع تستنزف أكثر من العطش، وأن الحزن الجاف أحيانًا يكون أرحم من البكاء.","You wept silently until Uthman slept. You didn't know that tears drain more than thirst, and that dry grief is sometimes kinder than weeping."],
["حفظتَ كل انعطاف، كل توقف، كل صوت. كنتَ ترسم خريطة في رأسك بلا قلم، وكنتَ تحفظ الطريق كما يحفظ الحكماء آياتهم.","You memorized every bend, every stop, every sound. You drew a map in your head without a pen, memorizing the road as the wise memorize their verses."]
],

/* ────── الفصل الثاني: الخرطوم ────── */
m0:[
["تحدّقتَ مذهولًا في إشارة المرور الحمراء. في القرية لم تكن هناك إشارات، ولا هذا الصمت الجماعي، ولا هذا النظام الذي يبدو كأنه يخفي شيئًا.","You stared in astonishment at the red traffic light. In the village there were no signals, no such collective silence, no such order that seemed to hide something."],
["مسحتَ وجهك وبدأت تمشي. المدينة كانت أكبر من أن تحتويك، لكنك كنت أصغر من أن تخاف — أو هكذا ظننت.","You wiped your face and began to walk. The city was too big to contain you, but you were too small to fear — or so you thought."]
],
m1:[
["بدأت تسأل المارة. أعطاك بعضهم، ومعظمهم لم يعطِ. لكنك تعلّمت في ذلك اليوم أن السؤال لا يُذل، وأن الجوع هو الذي يُذل.","You began asking passersby. Some gave, most didn't. But you learned that day that asking does not humiliate, and that hunger is what humiliates."],
["بحثتَ عن عمل. لم يكن في جيبك مال، لكن كان في يديك قوة، وفي قلبك صبر، وفي عينيك حياة لم تُطفأ بعد.","You looked for work. You had no money in your pocket, but you had strength in your hands, patience in your heart, and a life in your eyes not yet extinguished."]
],
m2b:[
["صمتت وتركت الصبي يسرق. لم تكن شريكًا، لكنك كنت شاهدًا. تعلّمت أن الصمت أحيانًا خيار، وأن الشهادة أحيانًا ثمنها ثقيل.","You stayed silent and let the boy steal. You weren't an accomplice, but you were a witness. You learned that silence is sometimes a choice, and that bearing witness sometimes costs much."],
["حذّرت الرجل. نظر إليك الصبي بغضب، لكن الرجل أعطاك جنيهًا وقال: «أنت رجل». لم تفهم في ذلك اليوم كيف يجتمع الغضب والامتنان في قلب واحد.","You warned the man. The boy looked at you angrily, but the man gave you a pound and said: 'You're a man.' That day you didn't understand how anger and gratitude could coexist in one heart."]
],
m3:[
["غسلت الصحون بإخلاص. في نهاية اليوم، أعطاك صاحب المطعم وجبة وجنيهات وقال: «غدًا تأتي». صار الغد وعدًا، وصار الوعد أملًا.","You washed dishes honestly. At day's end, the owner gave you a meal and some pounds and said: 'Come tomorrow.' Tomorrow became a promise, and the promise became hope."],
["غسلت الصحون وخطفت وجبة إضافية. شعرت بذنب صغير، لكن بطنك صمتت أخيرًا. تعلّمت أن بعض الذنوب أخف من الجوع.","You washed dishes and sneaked an extra meal. You felt a small guilt, but your stomach finally quieted. You learned that some sins are lighter than hunger."]
],
m3b:[
["حكيتَ لعمّ إدريس كل شيء — عن دارفور، عن أسرتك، عن الصندوق، عن عثمان. سمعك دون أن يقاطعك، ثم قال: «أنت ابني من اليوم».","You told Uncle Idris everything — about Darfur, your family, the trunk, Uthman. He listened without interrupting, then said: 'You are my son from today.'"],
["قلت إنك يتيم من الأطراف وكفى. لم يكذبك، لكنه عرف أن هناك أكثر لم تقله، وأن بعض الصمت أصدق من كل الكلام.","You said you were just an orphan from the outskirts. He didn't call you a liar, but he knew there was more you weren't saying, and that some silence is truer than all speech."]
],
m3c:[
["شكرت عمّ إدريس. في المساء جاءك بصحن عدس وقال: «غدًا تبدأ معي من الفجر». صار العدس عشاءً، وصار الوعد عائلة.","You thanked Uncle Idris. In the evening he came with a plate of lentils and said: 'Tomorrow you start with me at dawn.' Lentils became dinner, and the promise became family."],
["سألته عن أهله، فحكى عن ابن في الخرطوم لا يراه منذ سنوات. صرتَ تعرف أن كل رجل هنا يحمل حكايته، وأن الخرطوم مدينة من الحكايات المكسورة.","You asked about his family, and he spoke of a son in Khartoum he hadn't seen in years. You came to understand that every man here carries his story, and that Khartoum is a city of broken stories."]
],
m4:[
["غادرت المطعم بصمت. لم تكن تعرف ماذا تفعل، لكنك كنت تعرف أن البكاء في العلن لا يفيد، وأن الرجال الحقيقيين يبتلعون دموعهم مع الخبز.","You left the restaurant in silence. You didn't know what to do, but you knew that weeping in public doesn't help, and that real men swallow their tears with their bread."],
["احتججت، لكنك عرفت أن احتجاجك لن يغيّر شيئًا. طردك صاحب المطعم، وضربك أحد العمال. صار الجرح الأول في الخرطوم جرحًا صغيرًا، لكنه فتح طريقًا لجراح أكبر.","You protested, but you knew your protest would change nothing. The owner expelled you, a worker beat you. The first wound in Khartoum was small, but it opened the way to greater wounds."]
],
m4b:[
["شكرت الرجل وجلست بجانبه تحت الجسر. تعلّمت في تلك الليلة أن الكرامة أحيانًا تكون قطعة بلاستيك تتقي بها المطر، وأن النبل لا يُشترى بالمال.","You thanked the man and sat beside him under the bridge. That night you learned that dignity is sometimes a piece of plastic shielding you from the rain, and that nobility cannot be bought with money."],
["ابتعدت وبحثت عن زاوية خاصة بك. لم تكن تعرف أن الزاوية ستؤلمك أكثر من العراء، وأن الوحدة أحيانًا أشقى من الشارع.","You moved away and found a corner of your own. You didn't know the corner would hurt more than the open, and that loneliness is sometimes harder than the street."]
],
s1:[
["جلستَ قرب المسجد. كان الناس يمرّون، وبعضهم يشتري منك، وكثير منهم يتجاهلك. صار المسجد جارك، وصار الأذان ساعة عملك.","You sat near the mosque. People passed, some buying from you, many ignoring you. The mosque became your neighbor, and the call to prayer your work clock."],
["جُبت الأحياء ببضاعتك. تعبت، لكنك عرفت أن الطريق هو الذي يأتي بالرزق، وأن الأرجل التي تعبت اليوم تستريح غدًا.","You walked the neighborhoods with your goods. You tired, but you learned that the road brings livelihood, and that feet that tire today rest tomorrow."]
],
s1b:[
["اقتسمت مع سلمان كل ما تربحه. صار المال قليلًا، لكن صار لك أخ. تعلّمت أن الفقر مع الرفقة أخف من الغنى في الوحدة.","You shared with Salman whatever you earned. The money grew small, but you gained a brother. You learned that poverty with companionship is lighter than wealth in solitude."],
["احتفظت بمالك. لم تكن تعرف أنك ستحتاجه، لكن الحاجة في الشارع تأتي بلا موعد، وأن الجيب الفارغ أقسى من القلب الفارغ.","You kept your money. You didn't know you would need it, but need on the street comes without appointment, and an empty pocket is harsher than an empty heart."]
],
s1c:[
["قبلت العمل في الورشة. صار لك جدول، وصار لك وجبة يومية، وصار لك شيء يشبه الحياة الطبيعية — رغم أنه لم يكن طبيعيًا.","You accepted work in the workshop. You gained a schedule, a daily meal, and something resembling a normal life — though it was not normal."],
["رفضت العمل المقيّد. بقيتَ حرًا، لكن الحرية في الخرطوم لها ثمن، والثمن كان جوعًا وأنت تعرف أنك ستدفعه.","You refused the restrictive work. You stayed free, but freedom in Khartoum has a price, and the price was hunger — and you knew you would pay it."]
],
s2:[
["ادّخرت المبلغ. كل يوم تضع جنيهًا في جيبك، كل جنيه كان حياة صغيرة، وكل قرش كان وعدًا بأن الغد أفضل.","You saved the money. Every day you put a pound in your pocket; every pound was a small life, every penny a promise that tomorrow would be better."],
["اشتريت بضاعة ووزّعتها على من عرفت. صار لك اسم في الحي، وصار الناس يعرفونك ببائع الفول السوداني — وهذا الاسم صار أغلى من المال.","You bought goods and distributed them to those you knew. You gained a name in the neighborhood, and people knew you as the peanut seller — and that name became more precious than money."]
],
s2b:[
["رفضت القرض بفائدة. لم تكن تعرف أنك بذلك حفظت سنتك القادمة، وأن الديون في الحرب ثقيلة كالحديد.","You refused the interest loan. You didn't know that by doing so you protected your coming year, and that debts in war are heavy as iron."],
["قبلت القرض. توسّعت تجارتك، لكنك كنت تعرف أنك لستَ وحدك في الأرباح. صار للدائن يد في ربحك، ويد في قلبك.","You accepted the loan. Your trade expanded, but you knew you were not alone in the profits. The lender had a hand in your earnings, and a hand in your heart."]
],
u1:[
["حملت بضائع التجار. تعبت، لكنك ربحت. صار التعب صديقًا، وأجرته ثمن الماء، وصار الجسد وسيلةً لا غاية.","You carried the merchants' goods. You tired, but you earned. Fatigue became a friend, its wage the price of water, and the body a means not an end."],
["ساعدت البائعة العجوز، فأعطتك وجبة وكلمة طيبة. تلك الوجبة كانت أحلى ما ذقت في الخرطوم، لأنها جاءت من عطاء لا من أجر.","You helped the old vendor, and she gave you a meal and a kind word. That meal was the sweetest you tasted in Khartoum, because it came from giving not wages."],
["بعتَ المناديل والبخور. صار الزحام سوقك، والعابرون زبائنك، وصار الصوت العالي أداتك الوحيدة للبقاء.","You sold tissues and incense. The crowd became your market, passersby your customers, and the loud voice your only tool for survival."]
],
u2:[
["ادّخرت لشراء دراجة. صار كل قرش خطوة، وصار الانتظار استثمارًا، وصار الصبر طريقًا لا خيارًا.","You saved for a bicycle. Every penny became a step, waiting became investment, and patience became a path, not a choice."],
["أعطيتَ جزءًا من مالك لمن هو أحوج. لم تكن تعرف أن هذا سيصير خبزًا يومًا في بيتك، وأن العطاء يعود بأشكال لا تتوقعها.","You gave part of your money to someone needier. You didn't know it would become bread in your house one day, and that giving returns in forms you don't expect."]
],
u3:[
["اقتسمت الحلوى مع سلمان. ضحك كطفل، وأنت ضحكت كأنك لم تضحك من قبل. صار العيد عيدًا، وصار الشارع بيتًا.","You shared the candy with Salman. He laughed like a child, and you laughed as you hadn't laughed before. Eid became Eid, and the street became home."],
["احتفظت بالحلوى. أكلتها وحدك، لكن طعمها كان أقل حلاوة مما ظننت. تعلّمت أن بعض الأشياء لا تكتمل إلا إذا اقتُسمت.","You kept the candy. You ate it alone, but its taste was less sweet than you expected. You learned that some things are only complete when shared."]
],
u4:[
["تركت بضاعتك وجريت. لم تكن تعرف أن هذا سيصير تدريبًا على أشياء أكبر، وأن الجري في الشارع يعلّمك الجري من الحياة نفسها.","You left your goods and ran. You didn't know this would become training for greater things, and that running in the street teaches you to run from life itself."],
["حملت أكبر ما تستطيع وجريت. تعبت، لكنك لم ترجع فارغ اليدين. صار التعب ثمنًا، وصار الحمل إصرارًا.","You carried as much as you could and ran. You tired, but you didn't return empty-handed. Fatigue became a price, and the load became determination."]
],
s3:[
["عملت ليلًا ونهارًا. تعبت، لكن المال كان يتزايد، والحلم كان يقترب. صار الجسد آلة، وصار الوقت خصمًا لا صديقًا.","You worked night and day. You tired, but money was growing and the dream was approaching. The body became a machine, and time an opponent not a friend."],
["عملت وأخذت قسطًا من الراحة. صحتك تحسنت، والمحفظة كذلك. تعلّمت أن البقاء ماراثون لا سباق سرعة.","You worked and rested. Your health improved, and so did your purse. You learned that survival is a marathon not a sprint."]
],
s3b:[
["اعتنيتَ بالجرح وتوقفت يومين. تعلمت أن الجسد ليس آلة، وأن الأعطال الصغيرة تسبق الانهيارات الكبيرة.","You tended your wound and stopped two days. You learned that the body is not a machine, and that small breakdowns precede great collapses."],
["واصلت العمل رغم الألم. ربحت أكثر، لكن الجرح صار أعمق. صار الألم خبزك، وصار الصبر تجارة.","You kept working despite the pain. You earned more, but the wound grew deeper. Pain became your bread, and patience your trade."]
],
s4:[
["نقلت الناس بإنصاف. سمعت شكرًا كثيرًا، واحتفظت بسمعتك. صار اسمك أغلى من الحافلة، وصار الإنصاف رأس مالك الحقيقي.","You carried people fairly. You heard much thanks and kept your reputation. Your name became more valuable than the bus, and fairness became your real capital."],
["رفعت الأجرة على المضطرين. ربحت أكثر، لكن الناس بدأوا ينظرون إليك بشكل مختلف. صار المال أكثر، وصار القلب أقل.","You raised the fare on the desperate. You earned more, but people began to look at you differently. Money grew, and the heart shrank."]
],
s4b:[
["قطعتَ الزحام بحذر. وصلت المرأة إلى المستشفى، وحين سألت عنك كنت قد ذهبت. لم تكن تعرف أن يدًا ستفتح لك بابًا بعد سنوات بفضل هذا اليوم.","You cut through traffic carefully. You got the woman to the hospital, and when she asked about you, you were gone. You didn't know a hand would open a door for you years later because of this day."],
["سلكت الطريق الخلفي الوعر. وصلت متأخرًا، لكنك وصلت. صار التأخير درسًا، وصار الوصول انتصارًا صغيرًا.","You took the rough back road. You arrived late, but you arrived. Delay became a lesson, and arrival became a small victory."]
],
s4c:[
["رفضت الفاكهة. قالت المرأة: «أنت رجل نادر». لم تفهم لماذا قالت هذا، لكنك احتفظت بالكلمة كأنها شهادة.","You refused the fruit. The woman said: 'You are a rare man.' You didn't understand why she said this, but you kept the words like a certificate."],
["قبلت الفاكهة وابتسمت. بكيتَ في السيارة دون أن تعرف لماذا. بعض الدموع لا تحتاج سببًا، تحتاج فقط نافذة تفتح.","You accepted the fruit and smiled. You wept in the car without knowing why. Some tears need no reason, only a window to open."]
],
s5b:[
["حاورتهم بهدوء: «أنا من دارفور وأعرف الجوع، فخذوا ما شئتم من جيبي واتركوا الحافلة». صار الكلام درعًا، وصار الصدق سلاحًا.","You spoke calmly: 'I am from Darfur and I know hunger. Take what you want from my pocket and leave the bus.' Words became a shield, and honesty a weapon."],
["ضغطت على الوقود. في المرآة رأيتهم يهربون. شعرت بالإثارة والخوف في وقت واحد، وصرت تعرف أن الشجاعة أحيانًا قرار لحظي.","You pressed the accelerator. In the mirror you saw them fleeing. You felt thrill and fear at once, and came to know that courage is sometimes a momentary decision."],
["سلّمت المفاتيح. دخلوا ثم خرجوا، والمرأة الحامل والطفلان لم يُمسّوا بأذى. ربحت أقل، لكنك ربحت نفسك.","You handed over the keys. They entered and left, and the pregnant woman and two children were untouched. You earned less, but you earned yourself."]
],

/* ────── الفصل الثالث: ديسمبر والثورة ────── */
r1:[
["نقلت الجرحى مجانًا. الحافلة صارت مستشفى متحركًا، وشعرت أنك تفعل شيئًا أكبر من العمل — أكبر من الحياة نفسها.","You carried the wounded for free. The bus became a moving hospital, and you felt you were doing something greater than work — greater than life itself."],
["واصلت عملك. الربح كان أهم من السياسة، لكن قلبك كان ينظر إلى الميدان، ويداك كانتا على المقود.","You continued your work. Profit was more important than politics, but your heart was looking at the square, while your hands were on the wheel."]
],
r1b:[
["رسمت شجرة على الجدار. الكل توقف لينظر. كأن الشجرة وعدًا بأن الحياة ستعود، وأن الجذور لا تموت.","You painted a tree on the wall. Everyone stopped to look. As if the tree was a promise that life would return, and that roots do not die."],
["كتبت اسم أبيك بخط عريض. المارة قرأوه بصوت عالٍ، كأنهم يعيدونه للحياة، كأن الأسماء قادرة على البعث.","You wrote your father's name in bold letters. Passersby read it aloud, as if returning him to life, as if names were capable of resurrection."]
],
r2:[
["احتفظت بالأمل. صار الأمل أثقل من الحجر، لكنه كان يحمل سلامًا صغيرًا في داخلك، وصار الأمل مقاومة.","You kept hope. Hope became heavier than stone, but it carried a small peace within you, and hope became resistance."],
["أغلقت قلبك: السياسة لا تطعم أحدًا. صار القلب مغارة، وصار الصمت ملاذًا، وصار الألم عادة تُدفن كل صباح.","You closed your heart: politics feeds no one. The heart became a cave, silence a refuge, and pain a habit buried each morning."]
],
r2b:[
["ابتسمت واعتذرت. رأت فيك أمانة، وتذكرت اسمك حين احتاجت سائقًا. صار الاعتذار بابًا، وصار الباب طريقًا.","You smiled and apologized. She saw honesty in you, and remembered your name when she needed a driver. An apology became a door, and the door became a road."],
["ساعدتها في حمل الأكياس. لم تكن تعرف أنها ستصير أم أولادك، وأن تلك الأكياس كانت بداية أثقل حكاية في حياتك.","You helped her carry the bags. You didn't know she would become the mother of your children, and that those bags were the beginning of the heaviest story of your life."]
],
rev1:[
["انضممت إليهم ورسمت. الطلاء على يديك، والحلم على الجدران. شعرت أنك طفل من جديد، وأن الخوف ليس قدرًا.","You joined them and painted. Paint on your hands, dream on the walls. You felt a child again, and that fear was not destiny."],
["عرضت نقلهم بحافلتك. صارت الحافلة صالة ثورة، وصار كل رحلة قصيدة، وكل مقعد منبرًا.","You offered to transport them in your bus. The bus became a revolutionary hall, every trip a poem, every seat a pulpit."],
["راقبت من بعيد. لم تكن مستعدًا بعد، لكنك كنت تحفظ الوجوه، وكنتَ تعرف أن هذا اليوم سيأتي دورك فيه.","You watched from afar. You weren't ready yet, but you memorized the faces, knowing this day would come to your turn."]
],
rev2:[
["هتفت معهم. صوتك اختلط بآلاف الأصوات، وكأنه صوت واحد. صار الفرد جماعة، وصارت الجماعة إنسانًا واحدًا.","You chanted with them. Your voice mixed with thousands, as if one voice. The individual became a crowd, the crowd a single human."],
["نظّمت الإسعافات. وضعت الماء والضمادات ومساعدة الجرحى. صار الميدان بيتًا، وصار الماء صلاة.","You organized first aid. You placed water, bandages, and aid to the wounded. The square became a home, and water became prayer."],
["حميت سلمى والطيب. أخذتك الانفجارات مرتين، لكنك لم تتركهما. صار الحب قرارًا، والقرار شجاعة، والشجاعة جسدًا.","You shielded Salma and Al-Tayeb. Explosions hit you twice, but you didn't leave them. Love became a decision, the decision courage, and courage a body."]
],
rev3:[
["حملت الطيب الجريح وهربت. لكن الطيب مات بين يديك، وأنت تعرف أنك فعلت ما تستطيع. صار العجز جرحًا، والجرح ذكرى.","You carried the wounded Al-Tayeb and fled. But Al-Tayeb died in your hands, and you know you did what you could. Helplessness became a wound, and the wound a memory."],
["هربت مع سلمى. تركتَ الميدان، لكنك لم تترك قلبك. صار الهروب نجاة، والنجاة عارًا صغيرًا، والعار ذكرى.","You fled with Salma. You left the square, but not your heart. Escape became survival, survival a small shame, and shame a memory."],
["بقيت لتنقذ من تستطيع. رأيت ما لا يُنسى، وأيقنت أن بعض الشجاعة خيار لا شرف، وأن البقاء أحيانًا أشجع من الفرار.","You stayed to save whoever you could. You saw what cannot be forgotten, and became certain that some courage is a choice not an honor, and that staying is sometimes braver than fleeing."]
],
rev4:[
["كتبت أسماء الشهداء. صار الجدار مصحفًا، وصار اسمك شاهدًا على الجدار، وصارت يدك قلمًا لذاكرة الأمة.","You wrote the martyrs' names. The wall became a scripture, your name a witness on the wall, and your hand a pen for the nation's memory."],
["أخذت صورة للجدار وحفظتها. لم تكن تعرف أنها ستصير دليلًا يومًا، وأن صورة صغيرة قد تحفظ حقيقة كبيرة.","You took a photo of the wall and kept it. You didn't know it would become evidence one day, and that a small photo could preserve a great truth."],
["تركت سلمى ومضيت. لم تكن قاسيًا، كنت فقط متعبًا. صار التعب عذرًا، والعذر ثقلًا، والثقل سنواتًا.","You left Salma and walked away. You weren't cruel, only tired. Fatigue became an excuse, the excuse a weight, and the weight years."]
],
rev5:[
["سألتها عن الطيب طفلًا. حكت، وضحكت، وبكت. صرتَ تعرف أن الشهداء كانوا أطفالًا قبل كل شيء، وأن الذاكرة وطن.","You asked her about Al-Tayeb as a child. She spoke, laughed, and wept. You came to know that martyrs were children before anything else, and that memory is a homeland."],
["عرضت المساعدة. رفضت أولًا، ثم قبلت. صار بيتها بيتك، وصارت أم الطيب أمك الثانية.","You offered help. She refused at first, then accepted. Her house became yours, and Umm Al-Tayeb your second mother."],
["صمتّ وشربت القهوة. بعض اللحظات أفضل ما فيها الصمت، وبعض الحزن أشرف من الكلام.","You stayed silent and drank the coffee. Some moments are best served by silence, and some grief is nobler than speech."]
],
rev6:[
["انضممت إلى لجنة مقاومة الحي. توثيق، وتوزيع، ومساعدة. صارت الثورة عملك اليومي، وصار الحي عائلتك الجديدة.","You joined your neighborhood's resistance committee. Documentation, distribution, aid. The revolution became your daily work, and the neighborhood your new family."],
["دعمتهم بالمال. لم تكن في الصفوف الأمامية، لكنك كنت في القلب. صار المال وقودًا، والوقود وعدًا، والوعد حياة.","You supported them with money. You weren't in the front ranks, but you were in the heart. Money became fuel, fuel a promise, and the promise life."],
["اكتفيت بالمشاهدة. لم تكن مستعدًا، لكنك كنت تتعلم. صار الانتظار درسًا، والدرس سنوات، والسنوات جسرًا.","You were content to watch. You weren't ready, but you were learning. Waiting became a lesson, the lesson years, and the years a bridge."]
],
sd2013:[
["نزلت إلى الشارع مع المحتجين. رأيت الشرطة، ورأيت الدم، ورأيت بلدك يغلي. صار الغضب معرفة، والمعرفة جرحًا.","You went down to the street with the protesters. You saw the police, the blood, your country boiling. Anger became knowledge, and knowledge a wound."],
["بقيت في البيت. حميت أسرتك، لكن قلبك كان في الشارع. صار البيت ملجأ، والملجأ قيدًا، والقيد شعورًا دائمًا.","You stayed home. You protected your family, but your heart was in the street. Home became a shelter, the shelter a restraint, and the restraint a constant feeling."],
["ساعدت المصابين في المساجد. كان ذلك أول يوم تتعلم فيه الإسعافات الأولية. صار المسجد مستشفى، والدم درسًا.","You helped the wounded in the mosques. It was the first day you learned first aid. The mosque became a hospital, and blood a lesson."]
],
sd2013b:[
["سألت الشيخ إبراهيم: «وماذا نفعل؟» فأجاب: «اصبر، وتعلم، وانتظر فرصتك». صارت الكلمة خريطة، والخريطة سنوات.","You asked Sheikh Ibrahim: 'So what do we do?' He answered: 'Be patient, learn, wait for your chance.' The words became a map, and the map years."],
["صمتّ وحفظت كلماته. في السنوات التالية، رجعت إليها كثيرًا. صار الصمت خزانة، والخزانة ذاكرة.","You stayed silent and memorized his words. In the following years you returned to them often. Silence became a store, and the store memory."]
],
sd2014:[
["حضرت جلسات الحوار. رأيت كيف تُدار السياسة، وكيف تُكتب الكلمات التي لا تُنفذ. صار الحوار مسرحًا، والمسرح خدعة.","You attended the dialogue sessions. You saw how politics is managed, how words that are not executed are written. Dialogue became theater, and theater a trick."],
["قلت إن الحوار بلا معنى. صار صوتك صوت كثيرين، وكأنهم جميعًا يتحدثون بك. صار الرفض موقفًا، والموقف هوية.","You said the dialogue was meaningless. Your voice became the voice of many, as if they all spoke through you. Refusal became a stance, and the stance an identity."],
["اكتفيت بالمشاهدة. الحوار كان بعيدًا عن الشارع، والشارع كان بعيدًا عن الحوار. صار البعد خريطة، والخريطة بلدًا.","You were content to watch. The dialogue was far from the street, the street far from the dialogue. Distance became a map, and the map a country."]
],
sd2018:[
["انضممت إلى الاحتجاجات. كان ديسمبر باردًا، لكن الشارع كان دافئًا بآلاف الأجساد. صار البرد صلاة، والدفء ثورة.","You joined the protests. December was cold, but the street was warm with thousands of bodies. Cold became prayer, and warmth revolution."],
["ساعدت في نقل الجرحى. صارت سيارتك إسعافًا، وصار دمك ماءً في العروق، وصار الوقت عدوًا تُهزمه بالسرعة.","You helped transport the wounded. Your car became an ambulance, your blood water in the veins, and time an enemy defeated by speed."],
["راقبت من النافذة. لم تكن مستعدًا بعد. صار الانتظار درسًا، والدرس صبرًا، والصبر سنوات.","You watched from the window. You weren't ready yet. Waiting became a lesson, the lesson patience, and patience years."]
],
sd2019:[
["هتفت مع الملايين أمام القيادة العامة. صوتك اختلط بآلاف، وكل صوت كان ثورة صغيرة. صار الفرد جيشًا، والجيش إنسانًا واحدًا.","You chanted with the millions before the General Command. Your voice mixed with thousands, and every voice was a small revolution. The individual became an army, and the army a single human."],
["نظّمت الاعتصام. الماء والخبز والنظافة. صار الميدان بيتًا، وصار البقاء فيه عملًا، وصار الصمود هوية.","You organized the sit-in. Water, bread, cleanliness. The square became a home, staying in it became work, and steadfastness became identity."],
["حملت المصابين إلى المستشفيات. رأيت وجوهًا لا تنسى، وأيادي تمسك بيدك ثم تفلت. صار الجرح ذاكرة، والذاكرة بلدًا.","You carried the wounded to hospitals. You saw faces not to be forgotten, and hands that held yours then slipped away. The wound became memory, and memory a country."]
],
sd2019b:[
["حملت الجرحى وهربت. لم تكن تعرف أن هذا اليوم سيبقى فيك للأبد. صار اليوم جرحًا، والجرح معلمًا.","You carried the wounded and fled. You didn't know this day would remain in you forever. The day became a wound, and the wound a teacher."],
["بقيت في الميدان حتى النهاية. رأيت ما رأيت. لم تخرج كما دخلت. صار الميدان قبرًا، والقبر وطنًا.","You stayed in the square to the end. You saw what you saw. You didn't leave as you entered. The square became a grave, and the grave a homeland."],
["تركت الميدان وذهبت إلى المستشفى. ساعدت من قدرت، لكن قلبك بقي في الميدان. صار القلب أسيرًا، والأسير حيًّا.","You left the square and went to the hospital. You helped who you could, but your heart stayed in the square. The heart became captive, and the captive alive."]
],
sd2020:[
["احتفلت بالسلام. أملت أن يدوم، وعرفتَ أن الأمل وحده لا يكفي. صار الاحتفال درسًا، والدرس حكمة.","You celebrated the peace. You hoped it would last, and you knew hope alone was not enough. Celebration became a lesson, and the lesson wisdom."],
["وزعت المساعدات على النازحين. لم تكن سياسيًا، كنت إنسانًا. صار العطاء هويتك، والهوية وطنًا.","You distributed aid to the displaced. You weren't a politician, you were a human. Giving became your identity, and identity a homeland."],
["قلت إن السلام الحقيقي لم يبدأ. كان صوتك صوت من رأى كثيرًا. صار الصوت حكمة، والحكمة ألمًا.","You said the real peace had not begun. Your voice was the voice of one who had seen much. The voice became wisdom, and wisdom pain."]
],
sd2021:[
["انضممت إلى احتجاجات «لا للانقلاب». كان أكتوبر صعبًا، لكن الشارع كان مصممًا. صار الشارع وطنًا، والوطن مقاومة.","You joined the 'No to the coup' protests. October was hard, but the street was determined. The street became a homeland, and the homeland resistance."],
["ساعدت في توثيق الانتهاكات. صار هاتفك دفترك، وصار الشارع مكتبك، وصار القلم سلاحك.","You helped document the violations. Your phone became your notebook, the street your office, and the pen your weapon."],
["بقيت بعيدًا واحمِ أسرتك. حميت أسرتك، لكن قلبك كان في الشارع. صار القلب أسيرًا، والأسير شاهدًا.","You stayed away and protected your family. You protected your family, but your heart was in the street. The heart became captive, and the captive a witness."]
],
sd2022:[
["استعددت لما هو قادم. خزنت، وحسبت، وانتظرت. صار الاستعداد حكمة، والحكمة نجاة.","You prepared for what was coming. You stored, you calculated, you waited. Preparation became wisdom, and wisdom survival."],
["قلت إن الحرب قادمة. لم يصدقك كثيرون، لكنك كنت تعرف ما يعرفه من رأى الحرب. صار الصوت صادقًا، والصدق مؤلمًا.","You said war was coming. Many didn't believe you, but you knew what those who had seen war know. The voice became truthful, and truthfulness painful."],
["تمنيت أن يكون الاتفاق الإطاري بداية. كان الأمل أجمل من الحقيقة. صار الأمل خبزًا، والخبز وهمًا.","You hoped the Framework Agreement would be a beginning. Hope was more beautiful than the truth. Hope became bread, and bread an illusion."]
],
sd2023:[
["هربت بأسرتك من الخرطوم. تركت البيت، والحافلة، والوثائق. حملت ما تستطيع من قلبك، ونسيت أن القلب أثقل ما يُحمل.","You fled Khartoum with your family. You left the house, the bus, the documents. You carried what you could of your heart, and forgot that the heart is the heaviest burden."],
["بقيت وساعدت الجيران. صارت الحرب جارك، وصار الحي أسرتك، وصار البقاء مقاومة.","You stayed and helped the neighbors. War became your neighbor, the neighborhood your family, and staying resistance."],
["انضممت إلى غرفة طوارئ الحي. صار الماء والخبز عملك، وصار الموت عادة تتعايش معها. صار العطاء وطنًا.","You joined your neighborhood's emergency room. Water and bread became your work, and death a habit you coexist with. Giving became a homeland."]
],
sd2023b:[
["ساعدت في دفن الضحايا. لم تكن تعرف أسماء كل من دُفن، لكنك كنت تعرف أنهم ليسوا أرقامًا. صار التراب شهادة، والشهادة صلاة.","You helped bury the victims. You didn't know all their names, but you knew they were not numbers. Earth became testimony, and testimony prayer."],
["ساعدت الناجين على الهروب. رأيت في عيونهم ما لا يُنسى. صار الخوف معرفة، والمعرفة عبئًا.","You helped survivors escape. You saw in their eyes what cannot be forgotten. Fear became knowledge, and knowledge a burden."],
["صمتّ وحفظت الأسماء. صار لسانك مقبرة، وصار قلبك متحفًا. صار الحفظ عملك، والعمل وطنًا.","You stayed silent and memorized the names. Your tongue became a cemetery, your heart a museum. Preservation became your work, and work a homeland."]
],
sd2023c:[
["هربت مع النازحين نحو القضارف. كان الطريق طويلًا والليل باردًا. صار الطريق وطنًا، والبرد رفيقًا.","You fled with the displaced toward Gedaref. The road was long and the night cold. The road became a homeland, and cold a companion."],
["ساعدت العجوز حتى يلحق بالقافلة. صار تعبك ثمنًا لكرامة رجل لا تعرفه، وصار التعب شرفًا.","You helped the old man until he caught the convoy. Your exhaustion became the price of a stranger's dignity, and exhaustion became honor."],
["بقيت في المدينة وساعدت من بقي. لم تكن تعرف كم سيبقى، لكنك كنت هناك. صار البقاء وعدًا، والوعد حياة.","You stayed in the city and helped those who remained. You didn't know how long it would be, but you were there. Staying became a promise, and the promise life."]
],
sd2024:[
["ساعدت في مطابخ زمزم. صار القدر الكبير صديقك، وصار الخبز عطاءً لا سلعة. صار الجوع عدوًا تُقاومه بالحب.","You helped in the Zamzam kitchens. The big pot became your friend, and bread a gift not a commodity. Hunger became an enemy resisted by love."],
["وزعت الماء على النازحين. صار كل كوب شهادة، وكل جرعة وعدًا. صار الماء أثمن من الذهب.","You distributed water to the displaced. Every cup became testimony, every sip a promise. Water became more precious than gold."],
["حفظت الأسماء. لم تكن تعرف أن هذا سيصير واجبك. صار الاسم هوية، والهوية وطنًا.","You memorized the names. You didn't know this would become your duty. A name became identity, and identity a homeland."]
],
sd2024b:[
["انضممت إلى غرف الطوارئ. صار لك أخوة وأخوات، وصار لك عمل أكبر من نفسك. صار العطاء عائلة، والعائلة وطنًا.","You joined the emergency rooms. You gained brothers and sisters, and work greater than yourself. Giving became family, and family a homeland."],
["دعمتهم بالمال. لم تكن في الصفوف، لكنك كنت في القلب. صار المال وقودًا، والوقود حياة.","You supported them with money. You weren't in the ranks, but you were in the heart. Money became fuel, and fuel life."],
["اكتفيت بالمشاهدة. ثم ندمت. صار الندم معلمًا، والمعلم ثقلًا.","You were content to watch. Then you regretted. Regret became a teacher, and the teacher a weight."]
],
sd2025:[
["ذهبت إلى الفاشر. كان الجرح في عمق الأرض، وأنت كنت تعرف أنك تنتمي إليه. صار الرجوع جذرًا، والجذر دمًا.","You went to Al-Fashir. The wound was in the depth of the earth, and you knew you belonged to it. Returning became a root, and the root blood."],
["بقيت في الخرطوم وساعدت العائدين. صارت العاصمة تكتب من جديد، وأنت كنت قلمًا. صار البقاء إعادة كتابة.","You stayed in Khartoum and helped the returning. The capital began to write anew, and you were a pen. Staying became rewriting."],
["حفظت أسماء ضحايا الفاشر. لم تكن تعرف كم من الأسماء سيأتي. صار الحفظ صلاة، والصلاة وطنًا.","You memorized the names of Al-Fashir's victims. You didn't know how many names would come. Memorizing became prayer, and prayer a homeland."]
],
sd2026:[
["قلت للطفل: «ليس بعد، لكننا سنبقى». كانت الكلمة أكبر من الأمل، أصغر من الوعد. صار البقاء عقيدة.","You told the child: 'Not yet, but we will stay.' The words were bigger than hope, smaller than a promise. Staying became a creed."],
["صمتّ واحتضنته. لم تكن تحتاج كلمة، كنت تحتاج يدًا. صار الصمت حوارًا، والحوار حبًا.","You stayed silent and held him. You didn't need a word, you needed a hand. Silence became dialogue, and dialogue love."],
["قلت الحقيقة: «لا أعرف». صار الصدق معجزة في زمن الحرب. صار الجهل شرفًا، والشرف وطنًا.","You told the truth: 'I don't know.' Honesty became a miracle in wartime. Not knowing became honor, and honor a homeland."]
],

/* ────── الفصل الرابع: قبل الحرب ────── */
s6b:[
["حكيت لها عن دارفور وعن أهلك. بكت معك، ومسحت دمعة لم تكن تعرفها. صار الحكي راحة، والراحة بيتًا.","You told her about Darfur and your family. She wept with you and wiped a tear you didn't know existed. Speaking became rest, and rest a home."],
["غيّرت الحديث: «الماضي ماضٍ». قالت: «حسنًا»، ولم تسأل بعدها. صار الصمت جدارًا، والجدار وطنًا صغيرًا.","You changed the subject: 'The past is past.' She said: 'Alright,' and didn't ask again. Silence became a wall, and the wall a small homeland."]
],
s6c:[
["اشتريت لهم الآيس كريم وعلّمتهم السباحة. صارت ضحكاتهم أثمن من كل شيء، وصار اليوم وطنًا.","You bought them ice cream and taught them to swim. Their laughter became more precious than everything, and the day a homeland."],
["بقيت على العتبة تحسب الديون. لم تكن تعرف أن هذه كانت أجمل أيام عمرك، وأنك تفرّط فيها وأنت تحسب.","You stayed at the threshold counting debts. You didn't know these were the most beautiful days of your life, and that you were squandering them while counting."]
],
s6d:[
["كتبت اسميهما على الجدار. صار الجدار وعدًا بأن ذاكرتهما ستبقى، وأن الأسماء لا تموت.","You wrote their names on the wall. The wall became a promise that their memory would remain, and that names do not die."],
["علّقت سبحة أبيك فوق سريرهما. صار الأب والأب، جنبًا إلى جنب. صار الجد حاضرًا في الجيل الجديد.","You hung your father's prayer beads above their bed. Father and father, side by side. The grandfather became present in the new generation."]
],
q1:[
["خزّنت الماء والطعام والوقود. ضحك الجيران، لكنك كنت تعرف. صار الاستعداد حكمة، والحكمة نجاة.","You stocked water, food, and fuel. The neighbors laughed, but you knew. Preparation became wisdom, and wisdom survival."],
["أعددت عيدًا جميلًا. كانت ضحكة مريم أثمن من كل التخزين في العالم. صار العيد خبزًا، والخبز حبًا.","You prepared a beautiful Eid. Maryam's laughter was more precious than all the stocking in the world. Eid became bread, and bread love."]
],
q1b:[
["تمنيت أن يطول هذا اليوم. لم يطل، لكنه بقي فيك للأبد. صار اليوم ذكرى، والذكرى وطنًا.","You wished the day would last. It didn't, but it remained in you forever. The day became a memory, and memory a homeland."],
["التقطت في ذاكرتك كل الوجوه. بعد أسابيع كنت تحفظها أكثر من اسمك. صار الحفظ وعدًا، والوعد صلاة.","You captured every face in your memory. Weeks later you knew them better than your own name. Memorizing became a promise, and the promise prayer."]
],

/* ────── الفصل الخامس: الحرب ────── */
w1:[
["بقيت مع أسرتك في البيت. كانت الجدران تحمي، أو هكذا بدا. صار البيت وهمًا، والوهم وطنًا مؤقتًا.","You stayed with your family at home. The walls protected, or so it seemed. Home became an illusion, and the illusion a temporary homeland."],
["هربت بهم من الحي. صارت السيارة بيتًا مؤقتًا، وصار الطريق وطنًا. صار الهروب قرارًا، والقرار مصيرًا.","You fled the neighborhood with them. The car became a temporary home, the road a homeland. Escape became a decision, and the decision destiny."]
],
v1:[
["أمسكت بيد آمنة. كانت يدها ترتجف، فمسكتها أكثر. صارت اليد وعدًا، والوعد نجاة.","You held Amina's hand. Her hand trembled, so you held it tighter. The hand became a promise, and the promise survival."],
["تحققت من الأبواب وجمعت الوثائق. لم تكن تعرف أن الوثائق ستكون آخر ما يحمي هويتك. صار الورق درعًا، والدرع وطنًا.","You checked the doors and gathered the documents. You didn't know the documents would be the last thing protecting your identity. Paper became a shield, and the shield a homeland."]
],
v2:[
["فتحت الباب لتحمي الأسرة. كنت تعرف أن يدك لن توقف رصاصة، لكنك كنت تعرف أيضًا أن الصمت لن يحمي. صار الفتح شجاعة، والشجاعة ثمنًا.","You opened the door to protect the family. You knew your hand wouldn't stop a bullet, but you also knew silence wouldn't protect. Opening became courage, and courage a price."],
["اختبأت مع أسرتك في الغرفة الخلفية. سمعت كل شيء. لم يكن هناك شيء آخر تفعله. صار الاختباء انتظارًا، والانتظار سنوات.","You hid with your family in the back room. You heard everything. There was nothing else to do. Hiding became waiting, and waiting years."]
],
w2:[
["قاومت بيدين خاليتين. كانت شجاعتك أكبر من قدرتك. صار الجسد جدارًا، والجدار ركامًا.","You resisted with bare hands. Your courage was greater than your strength. The body became a wall, and the wall rubble."],
["لم تقاوم لتبقى حيًا. فقدت كل شيء، لكنك عشت. صار البقاء عارًا، والعار سنوات.","You didn't resist, to stay alive. You lost everything, but you lived. Survival became shame, and shame years."]
],
v3:[
["قدّمت نفسك. صار لك رفاق، وصار للزنزانة أسماء. صار الاسم وجودًا، والوجود مقاومة.","You introduced yourself. You gained companions, and the cell gained names. A name became existence, and existence resistance."],
["صمت وأبقت عينيك مفتوحتين. حفظت الوجوه وحفظت الأصوات. صار الصمت ذاكرة، والذاكرة سلاحًا.","You stayed silent and kept your eyes open. You memorized faces and voices. Silence became memory, and memory a weapon."]
],
u1:[
["حملت بضائع التجار. تعبت، لكن الجيب امتلأ، والكرامة عادت. صار التعب عملة، والعملة نجاة.","You carried the merchants' goods. You tired, but your pocket filled, and dignity returned. Fatigue became currency, and currency survival."],
["ساعدت البائعة العجوز. أعطتك وجبة وكلمة طيبة. صارت الوجبة أثمن من كل المال، لأنها كانت حبًا.","You helped the old vendor. She gave you a meal and a kind word. The meal became more precious than all money, because it was love."],
["بعت المناديل والبخور. صار الزحام سوقك، والعابرون زبائنك. صار الصوت العالي سلاحك، والصبر تجارتك.","You sold tissues and incense. The crowd became your market, passersby your customers. The loud voice became your weapon, and patience your trade."]
],
u2:[
["ادّخرت. صار القرش خطوة، وصار الانتظار استثمارًا. صار الصبر طريقًا لا خيارًا.","You saved. A penny became a step, waiting became investment. Patience became a path not a choice."],
["أعطيت لمن هو أحوج. لم تكن تعرف أن هذا العطاء سيعود إليك في وقت لا تتوقعه. صار العطاء دائرة، والدائرة قدرًا.","You gave to someone needier. You didn't know this giving would return in an unexpected time. Giving became a circle, and the circle destiny."]
],
g1:[
["وزعت الطعام والماء على البيوت الجريحة. صار الحي عائلتك، وصار الجرح وطنك. صار العطاء هويتك.","You distributed food and water to wounded homes. The neighborhood became your family, the wound your homeland. Giving became your identity."],
["سجّلت الأسماء والأدوية. صار هاتفك مكتبًا، وصار الحبر شهادة. صار التدوين صلاة.","You recorded names and medicines. Your phone became an office, and ink testimony. Recording became prayer."]
],
h1:[
["ساعدت الأطباء. رأيت ما رأيت، ولم تعد كما كنت. صار الجرح معرفة، والمعرفة عبئًا.","You helped the doctors. You saw what you saw, and you did not return as you were. The wound became knowledge, and knowledge a burden."],
["ابتعدت. لم تكن مستعدًا، لكنك عرفت أن فيك شيئًا لم يُكسر بعد. صار الابتعاد إنقاذًا، والإنقاذ ثمنًا.","You stepped away. You weren't ready, but you knew something in you was not yet broken. Stepping away became saving, and saving a price."]
],
h2:[
["أعطيت دواءك للطفل. حرارته انخفضت، وأمه قبلت يديك. صار الدواء حبًا، والحب معجزة.","You gave your medicine to the child. His fever went down, and his mother kissed your hands. Medicine became love, and love a miracle."],
["ساعدت الأم بكمادات. لم يكن هناك دواء، لكن كان هناك يد. صار الكماد صلاة، والصلاة وطنًا.","You helped the mother with compresses. There was no medicine, but there was a hand. The compress became prayer, and prayer a homeland."],
["احتفظت بالدواء. صار في جيبك، وصار في قلبك ثقل. صار الثقل سنواتًا.","You kept the medicine. It stayed in your pocket, and in your heart grew a weight. The weight became years."]
],
e1:[
["شاركتها الماء. صارت أم حسن أختك، وصار البئر دربك. صار الماء قرابة، والقرابة وطنًا.","You shared your water with her. Umm Hasan became your sister, and the well your path. Water became kinship, and kinship a homeland."],
["اعتذرت. لم تكن قاسيًا، كنت جائعًا. لكنك تعرف أن العطش الذي رأيته في عينيها سيرافقك سنوات.","You apologized. You weren't cruel, only hungry. But you know the thirst you saw in her eyes would accompany you for years."],
["انضممت إلى غرفة الطوارئ. صار الماء والخبز عملك، وصار الموت عادة تتعايش معها. صار العطاء وطنًا.","You joined the emergency room. Water and bread became your work, and death a habit you coexist with. Giving became a homeland."]
],
e2:[
["أجبت بهدوء. لم تكن خائفًا، كنت متعبًا. صار الهدوء درعًا، والدرع شجاعة.","You answered calmly. You weren't afraid, only tired. Calm became a shield, and the shield courage."],
["أظهرت وثائقك. صار الورق هويتك، وصار اسمك تذكرة عبور. صار الورق وطنًا.","You showed your documents. Paper became your identity, and your name a passage ticket. Paper became a homeland."],
["رفعت صوتك. لم يحتمل الحاجز احتجاجك. صار الصوت شهيدًا، والشهيد ذكرى.","You raised your voice. The checkpoint could not bear your protest. The voice became a martyr, and the martyr a memory."],
["وقفت بين أم حسن وبينه. لم تكن تعرف أنه سيحترمك، لكنه فعل. صار الوقوف وطنًا.","You stood between Umm Hasan and him. You didn't know he would respect you, but he did. Standing became a homeland."]
],
q2:[
["قلت اسمك واسم قريتك. صار لك اسم، وصار للقرى أسماء. صار الاسم وجودًا، والوجود مقاومة.","You said your name and your village. You had a name, and villages had names. A name became existence, and existence resistance."],
["صمت. صار الصمت أحيانًا هو الحكمة الوحيدة. صار الصمت درعًا، والدرع سنوات.","You stayed silent. Silence is sometimes the only wisdom. Silence became a shield, and the shield years."]
],
q3:[
["ضممته إليك. تحملت الضرب عنه، وتعلمت أن الأبوة ليست دمًا. صار الفتى ابنك، والابن وطنًا.","You took him in. You bore the beating for him, and learned that fatherhood is not blood. The boy became your son, and the son a homeland."],
["ابتعدت. لم تكن قاسيًا، كنت حيًا. لكنك لم تنم تلك الليلة. صار السهاد معلمًا، والمعلم ثقلًا.","You moved away. You weren't cruel, only alive. But you didn't sleep that night. Insomnia became a teacher, and the teacher a weight."]
],
q4:[
["أخرجت الدفتر ووضعته على المكتب. لم تتكلم، والدفتر تكلم. صار الدفتر شاهدًا، والشاهد وطنًا.","You took out the notebook and put it on the desk. You didn't speak; the notebook spoke. The notebook became a witness, and the witness a homeland."],
["أخرجت السبحة وقلت اسم أبيك. رأيت في عينيه شيئًا يشبه الاحترام. صار الاسم درعًا، والدرع كرامة.","You took out the prayer beads and said your father's name. You saw something like respect in his eyes. The name became a shield, and the shield dignity."],
["قلت إنك سائق. صار الكذب درعًا، لكنه كان درعًا ضروريًا. صار الدرع سنوات.","You said you were a driver. The lie became a shield, but a necessary shield. The shield became years."],
["حكيت له عن أبنائك. رأيت في وجهه ما لا يُتوقع: دمعة. صار الجرح جسرًا، والجسر نجاة.","You told him about your children. You saw in his face something unexpected: a tear. The wound became a bridge, and the bridge survival."]
],
q5:[
["طلبت النشرة الكاملة. سمعت أخبارًا هزّت الزنزانة. صار الأمل يدخل في الهواء. صار الهواء وطنًا.","You asked for the full bulletin. You heard news that shook the cell. Hope began to enter the air. Air became a homeland."],
["قلت: «يكفي أملًا مزيّفًا». لم تكن متشائمًا، كنت متعبًا. صار اليأس راحة، والراحة وهمًا.","You said: 'Enough false hope.' You weren't pessimistic, only tired. Despair became rest, and rest an illusion."]
],
q6:[
["ساعدت الطبيب. صار الدم والقمامة أخلاقًا، وصار الجرح صلاة. صار الجسد معبدًا.","You helped the doctor. Blood and scraps became ethics, and the wound prayer. The body became a temple."],
["بقيت بعيدًا. صرت أكثر تعبًا، وأقل رحمة. صار البعد خيارًا، والخيار ثقلًا.","You stayed away. You became more tired and less merciful. Distance became a choice, and the choice a weight."]
],
p1:[
["اقتسمت رغيفك. صار الجريح أخاك، وصار الرغيف رغيفين. صار الجوع قرابة.","You shared your loaf. The wounded man became your brother, and one loaf became two. Hunger became kinship."],
["أكلت رغيفك. لم تكن قاسيًا، كنت جائعًا. لكنك لم تشبع. صار الجوع عادة، والعادة سنوات.","You ate your loaf. You weren't cruel, only hungry. But you didn't feel full. Hunger became a habit, and the habit years."]
],
p2:[
["تطوعت للعمل. صار الخندق صلاتك، وصار التعب رفيقك. صار العمل نجاة.","You volunteered. The trench became your prayer, and fatigue your companion. Work became survival."]
,
["اختبأت. لم تُضرب بشدة، لكن قلبك ضُرب. صار القلب جريحًا، والجريح شاهدًا.","You hid. You weren't beaten badly, but your heart was beaten. The heart became wounded, and the wounded a witness."]
],
p3:[
["حدثته بهدوء. صار الشاب يبكي، وصار الحارس أخًا لجزء منك. صار الكلام يدًا.","You spoke to him calmly. The young man began to weep, and the guard became a brother to part of you. Words became a hand."],
["حاولت سرقة المفتاح. أمسكوا بك. صار الطمع خطأً، والخطأ ثمنًا.","You tried to steal the key. They caught you. Greed became a mistake, and the mistake a price."],
["تظاهرت بالمرض. لم يصدقوك تمامًا، لكنهم تركونك. صار المرض حيلة، والحيلة نجاة صغيرة.","You pretended to be sick. They didn't fully believe you, but they left you. Sickness became a trick, and the trick a small survival."],
["أخرجت السبحة وحكيت عن أبيك. صار الحارس يستمع كطفل. صار الأب حاضرًا، والحضور وطنًا.","You took out the prayer beads and told him about your father. The guard listened like a child. The father became present, and presence a homeland."]
],
p4:[
["هربت. لم تنظر خلفك. صارت الجدران تشبه الأعداء. صار الهروب قرارًا، والقرار مصيرًا.","You escaped. You didn't look back. The walls became like enemies. Escape became a decision, and the decision destiny."],
["انتظرت. خططت مع رفيقين. خرجتم معًا، وصار الهروب أعظم من الحرية. صار التخطيط صلاة.","You waited. You planned with two companions. You left together, and escape became greater than freedom. Planning became prayer."]
],
z0:[
["نمت قليلًا. لم يكن هناك وقت، لكن الجسد كان يحتاج ذلك. صار النوم صلاة صغيرة.","You slept a little. There was no time, but the body needed it. Sleep became a small prayer."],
["واصلت. صار الليل صديقًا، وصار الأفق وعدًا. صار المشي صلاة.","You continued. Night became a friend, and the horizon a promise. Walking became prayer."]
],
o1:[
["ذهبت إلى التكية. أعطوك طعامًا وكلمة. صار الناس عائلتك، وصار الفقر وطنًا. صار العطاء مقاومة.","You went to the communal kitchen. They gave you food and a word. People became your family, and poverty a homeland. Giving became resistance."],
["بحثت في الأنقاض. وجدت شيئًا صغيرًا. لم يكن طعامًا، لكنه كان ذكرى. صار الأنقاض مكتبة، والذكرى طعامًا.","You searched the ruins. You found something small. It wasn't food, but it was a memory. Ruins became a library, and memory food."]
],
o1c:[
["عاهدت نفسك ألا تنسى. صار الحفظ عملًا، وصار النسيان خيانة. صار الحفظ صلاة.","You vowed not to forget. Preservation became work, and forgetting betrayal. Preservation became prayer."],
["قررت أن تطوي الصفحة. كانت الصفحة ثقيلة، لكنك أغلقتها. صار الطي راحة، والراحة نجاة.","You decided to turn the page. The page was heavy, but you closed it. Turning became rest, and rest survival."]
],
o2:[
["ساعدت في التوزيع. صار الماء والخبز صلاتك، وصار الحي أسرتك. صار العطاء وطنًا.","You helped in the distribution. Water and bread became your prayer, and the neighborhood your family. Giving became a homeland."],
["اخترت الحدود. صارت الرحلة طريقًا جديدًا، وصار الهروب بداية. صار العبور قدرًا.","You chose the border. The journey became a new road, and escape a beginning. Crossing became destiny."],
["جلست وانتظرت. لم يكن هناك وقت، لكنك انتظرت. صار الانتظار إيمانًا صغيرًا.","You sat and waited. There was no time, but you waited. Waiting became a small faith."],
["عدت نحو الفاشر. صار القلب يجرّك، والعقل يعترض. صار الرجوع جذرًا، والجذر دمًا.","You returned toward Al-Fashir. The heart dragged you, the mind objected. Returning became a root, and the root blood."]
],

/* ────── الفصل السادس: الخرطوم الجريحة ────── */
k1:[
["فتحت كشك شاي. صار الكشك مكتبك، وصار الشاي تعزية. صار العطاء مقاومة.","You opened a tea stall. The stall became your office, and tea consolation. Giving became resistance."],
["ساعدت الأستاذة هالة. صار الحرف وعدًا، وصار التعليم مقاومة. صار الحرف سلاحًا.","You helped Ustadha Hala. Letters became a promise, and teaching resistance. Letters became a weapon."],
["انتظرت. لم يكن هناك ما تنتظره، لكنك انتظرت. صار الانتظار إيمانًا صغيرًا.","You waited. There was nothing to wait for, but you waited. Waiting became a small faith."]
],
k1b:[
["وزعت الخبز بعدل. صار الخبز عطاءً، وصار العدل أملًا. صار العطاء وطنًا.","You distributed bread fairly. Bread became giving, and fairness hope. Giving became a homeland."],
["احتفظت لأسرة المأوى. صار القليل كثيرًا. صار الاقتصاد حبًا.","You kept some for the shelter family. A little became much. Economy became love."]
],
k2:[

function extendRecapWithLoops(){
  const recapBody = document.querySelector(".recap-body");
  if (!recapBody) return;
  if (typeof s === "undefined" || !s || !Array.isArray(s.log)) return;
  const seal = document.querySelector(".recap-seal");
  if (!seal) return;
  const recapCh = parseInt(seal.textContent);
  if (!recapCh) return;
  const l = _L();
  const seen = {};
  s.log.forEach(l2 => {
    if (l2.ch !== recapCh) return;
    if (!LOOP_PASSAGES[l2.n]) return;
    const beats = LOOP_PASSAGES[l2.n];
    if (!beats[l2.i]) return;
    const key = l2.n + ":" + l2.i;
    if (seen[key]) return;
    seen[key] = 1;
    const text = beats[l2.i][l==="en" ? 1 : 0];
    if (!text) return;
    const p = document.createElement("p");
    p.textContent = text;
    p.style.animationDelay = ((recapBody.children.length) * 80) + "ms";
    recapBody.appendChild(p);
  });
}

  const l = _L();

      <button class="btn pri" onclick="window._enterChapter()">${l==="en"?"Enter":"ادخل"} →</button>
    </div>
  `;
  window.scrollTo({top:0,behavior:"smooth"});
  window._enterChapter = function(){
    window._enterChapter = null;
    if (typeof origContinue === "function") origContinue();
  };
}

/* ─────────── 9) التفاف _continueFromRecap لإضافة الانتقال ─────────── */
function wrapContinueForTransition(){
  if (typeof window._continueFromRecap !== "function") return;
  if (typeof s === "undefined" || !s || !s._ch || s._ch < 2) return;
  const newCh = s._ch;
  if (!TRANSITIONS[newCh]) return;
  const orig = window._continueFromRecap;
  window._continueFromRecap = function(){
    window._continueFromRecap = null;
    showTransition(newCh, orig);
  };
}

/* ─────────── 10) اعتراض renderNode لإضافة التوسيع ─────────── */
const _prevRN = window.renderNode;
window.renderNode = function(nid){
  const result = _prevRN.apply(this, arguments);
  if (document.querySelector(".recap-seal")){
    try { extendRecapWithLoops(); } catch(e){ console.error(e); }
    try { wrapContinueForTransition(); } catch(e){ console.error(e); }
  }
  return result;
};

  if (typeof s === "undefined" || !s || !Array.isArray(s.log)) return 0;

function countPreservation(){
  if (typeof s === "undefined" || !s || !Array.isArray(s.log)) return 0;
  const KEYS = ["rev4:0","rev4:1","sd2023b:2","sd2024:2","sd2025:2","g1:1","q2:0"];

function countCompanions(){

/* ─────────── 12) اعتراض renderEnding لترقية النهايات ─────────── */
const _prevRE = window.renderEnding;
window.renderEnding = function(key){

};

function personalitySummary(traits){
  const l = _L();
  const total = Object.keys(traits).reduce(function(a,k){return a+traits[k];},0);
  if (total === 0){
    return l==="en"
      ? "You walked through the war without marking it, and it left no mark on you either."
      : "مشيتَ في الحرب دون أن تترك فيها أثرًا، ولم تترك فيك أثرًا.";
  }
  const order = Object.keys(traits).sort(function(a,b){ return traits[b]-traits[a]; });
  const SUMMARIES = {
    mercy:{ar:"كنتَ رجلًا رحيمًا. حين كان العالم ينهار، كنت تُمسك بأيدي الآخرين.",
           en:"You were a merciful man. When the world was collapsing, you held others' hands."},
    courage:{ar:"كنتَ شجاعًا. لم تخف من النار حين كان الفرار ممكنًا.",
             en:"You were brave. You did not fear the fire when fleeing was possible."},
    caution:{ar:"كنتَ حذرًا. حافظت على نفسك لتحمي من تحب.",
             en:"You were cautious. You kept yourself to protect those you love."},
    harshness:{ar:"كنتَ قاسيًا أحيانًا. لكن القسوة في الحرب كانت أحيانًا رحمة.",
               en:"You were sometimes harsh. But harshness in war is sometimes mercy."}
  };
  const first = order[0], second = order[1];
  let out = SUMMARIES[first][l];
  if (traits[second] > 0 && traits[second] * 2 > traits[first]){
    out += " " + (l==="en" ? "And beneath that, " : "وتحتها، ")
             + SUMMARIES[second][l].charAt(0).toLowerCase()
             + SUMMARIES[second][l].slice(1);
  }
  return out;
}

function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(/\s+/);
  const lines = [];
  let cur = "";
  for (let i=0; i<words.length; i++){
    const test = cur ? cur + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxWidth && cur){
      lines.push(cur); cur = words[i];
    } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

async function shareStory(mode){

    ctx.fillText(l==="en" ? "A Sudanese story between two wars" : "حكاية سودانية بين حربين", W/2, 235);

    // فاصل
    ctx.strokeStyle = "#b5541c"; ctx.lineWidth = 3;

    if (isEnding && typeof window._currentEndingKey !== "undefined" && window._currentEndingKey){
      const meta = (typeof END_META!=="undefined") && END_META[window._currentEndingKey];
      if (meta) title = l==="en" ? meta.en : meta.ar;
    }
    if (!title && typeof s!=="undefined" && s && s._ch){
      const CH = {1:{ar:"الفصل الأول: دارفور",en:"Chapter 1: Darfur"},
                  2:{ar:"الفصل الثاني: الخرطوم",en:"Chapter 2: Khartoum"},
                  3:{ar:"الفصل الثالث: ديسمبر",en:"Chapter 3: December"},
                  4:{ar:"الفصل الرابع: قبل الحرب",en:"Chapter 4: Before the War"},
                  5:{ar:"الفصل الخامس: الحرب",en:"Chapter 5: War"},
                  6:{ar:"الفصل السادس: الخرطوم الجريحة",en:"Chapter 6: Wounded Khartoum"}};
      if (CH[s._ch]) title = CH[s._ch][l];
    }
    if (title){
      ctx.font = 'bold 52px "Segoe UI","SF Arabic",Tahoma,serif';
      ctx.fillStyle = "#2a2118";
      ctx.fillText(title, W/2, 370);
    }

    // فاصل
    ctx.strokeStyle = "#b5541c"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(280,410); ctx.lineTo(W-280,410); ctx.stroke();

    // نص القصة
    let story = [];
    try{
      if (typeof s!=="undefined" && s && s._ch){
        const ch = isEnding ? s._ch : s._ch;
        if (typeof window.__getStory==="function"){
          story = window.__getStory(ch) || [];
        }
      }
    }catch(e){}

    // إذا فشل، استخدم آخر ما في السجل
    if (!story.length && typeof s!=="undefined" && s && Array.isArray(s.log)){
      const ch = s._ch || 1;
      story = s.log.filter(function(x){return x.ch===ch;}).slice(0,3).map(function(x){return x.ar;});
    }

    ctx.direction = "rtl"; ctx.textAlign = "right";
    ctx.font = '30px "Segoe UI","SF Arabic",Tahoma';
    ctx.fillStyle = "#2a2118";
    let y = 470;
    const maxW = W - 240;
    const lineH = 52;

    const toDraw = story.slice(0, 3);
    for (let i=0; i<toDraw.length; i++){
      const para = toDraw[i];
      if (!para) continue;
      const lines = wrapCanvasText(ctx, para, maxW);
      for (let j=0; j<lines.length; j++){
        if (y > 1150) break;
        ctx.fillText(lines[j], W - 120, y);
        y += lineH;
      }
      y += 22;
      if (y > 1150) break;
    }

    // خطوط إحصائية
    const traits = computeTraits();
    const total = Object.keys(traits).reduce(function(a,k){return a+traits[k];},0);
    y = Math.min(y + 30, 1180);

    if (total > 0){
      ctx.textAlign = "center"; ctx.direction = "rtl";
      ctx.font = 'bold 30px "Segoe UI","SF Arabic",Tahoma';
      ctx.fillStyle = "#b5541c";
      ctx.fillText(l==="en" ? "Your journey in numbers" : "رحلتك في أرقام", W/2, y);

        return TRAITS[k].icon + " " + (l==="en"?TRAITS[k].en:TRAITS[k].ar) + " " + traits[k];
      });
      ctx.fillText(parts.join("   ·   "), W/2, y);
    }

    // تذييل
    ctx.textAlign = "center"; ctx.direction = "ltr";
    ctx.font = 'italic 26px "Segoe UI","SF Arabic",Tahoma';
    ctx.fillStyle = "#7a6a58";

    // تحويل لصورة
    const blob = await new Promise(function(r){ canvas.toBlob(r, "image/png"); });
    const file = new File([blob], "najat-story.png", {type:"image/png"});

    if (navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title: l==="en" ? "Survival" : "النجاة",
          text: l==="en" ? "My journey through the story" : "رحلتي في اللعبة"
        });
        return;
      }catch(e){ if (e && e.name==="AbortError") return; }
    }
    // تحميل
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "najat-story.png"; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    if (typeof toast==="function") toast(l==="en"?"✅ Image saved":"✅ حُفظت الصورة");
  }catch(e){
    console.error(e);
    if (typeof toast==="function") toast(_L()==="en"?"⚠️ Share failed":"⚠️ تعذّرت المشاركة");
  }
}

    md += "**القرارات:** " + ((s && s.log) ? s.log.length : 0) + "  \n";
    if (comps.length) md += "**الرفاق:** " + comps.map(function(k){return COMP[k].ar;}).join("، ") + "  \n";

  for (let c=1; c<=6; c++){
    const labels = (s && s.log) ? s.log.filter(function(x){return x.ch===c;}) : [];
    if (!labels.length) continue;
    md += "## " + CHAPTER_NAMES[c][l] + "\n\n";
    labels.forEach(function(x){
      md += "- " + (x.ar || "") + "\n";
    });

  }

  md += "\n---\n\n## " + (l==="en"?"Ending":"النهاية") + ": " + (l==="en"?meta.en:meta.ar) + "\n\n";
  if (epi && epi.parts){
    epi.parts.forEach(function(p){ md += p + "\n\n"; });

  const traitNames = {mercy:{ar:"الرحمة",en:"Mercy"},courage:{ar:"الشجاعة",en:"Courage"},caution:{ar:"الحذر",en:"Caution"},harshness:{ar:"القسوة",en:"Harshness"}};

  try{

  }catch(e){
    console.error(e);
    if (typeof toast==="function") toast(l==="en"?"⚠️ Export failed":"⚠️ تعذّر التصدير");
  }
}

  }

  /* الفقرة 2: المحطات */
  if (milestones.length > 0){
    const picks = milestones.slice(0, 3);
    if (l==="en"){
      parts.push("You carried with you: " + picks.map(function(x){return x.en;}).join(". And you held: ") + ". Each one a small weight, each one a small monument.");

      parts.push("حملتَ معك: " + picks.map(function(x){return x.ar;}).join(". وحملتَ أيضًا: ") + ". كل واحد منها ثقل صغير، وكل واحد منها نصب صغير.");
    }

    if (l==="en"){
      parts.push("You did not stop to collect memories — you were too busy surviving. But the road remembers every footstep, even when the walker forgets.");
    } else {
      parts.push("لم تتوقف لتجمع الذكريات — كنت مشغولًا بالبقاء. لكن الطريق يحفظ كل خطوة، حتى حين ينسى الماشي.");
    }
  }

  /* الفقرة 3: الرفاق أو الوحدة */
  if (comps.length > 0){
    const names = comps.map(function(k){return l==="en"?COMP[k].en:COMP[k].ar;}).join(l==="en"?", ":"، ");
    if (l==="en"){
      parts.push("You did not walk alone. " + names + " walked with you. Some bonds are not made of blood, but of the road. They are the only wealth the war could not take.");
    } else {
      parts.push("لم تمشِ وحدك. " + names + " مشوا معك. بعض الروابط لا تُصنع من الدم، بل من الطريق. وهي الثروة الوحيدة التي لم تستطع الحرب أن تأخذها.");

    const entry = {
      key: key,
      epitaph: epi.epitaph,
      date: Date.now(),
      decisions: (s.log || []).length,
      chapters: s._ch || 1,
      companions: comps,
      traits: epi.traits
    };
    const isDupe = lane.length > 0 && lane[0].key === key && (Date.now() - lane[0].date) < 60000;
    if (!isDupe){
      lane.unshift(entry);
      if (lane.length > 20) lane.length = 20;
      localStorage.setItem(ML_KEY_V5, JSON.stringify(lane));
    }
  }catch(e){}
}

function openMemoryLaneV5(){
  const l = _L();
  const e = _el("pn");
  const lane = getMemoryLaneV5();
  let html = '<h3>📚 ' + (l==="en"?"Memory Lane":"أرشيف حكاياتي") + '</h3>';
  if (!lane.length){
    html += '<p class="mut">' + (l==="en"?"No completed journeys yet.":"لا رحلات مكتملة بعد.") + '</p>';
  } else {
    html += '<div class="mut" style="margin-bottom:8px">' + (l==="en"?"Last "+lane.length+" journeys":"آخر "+lane.length+" رحلة") + '</div>';
    lane.forEach(function(entry){
      const meta = (typeof END_META!=="undefined" && END_META[entry.key]) ? END_META[entry.key] : {icon:"📖", ar:entry.key, en:entry.key};
      const date = new Date(entry.date);
      const dateStr = date.toLocaleDateString(l==="en"?"en":"ar", {year:"numeric",month:"short",day:"numeric"});
      const compNames = (entry.companions || []).map(function(k){ return COMP[k] ? (l==="en"?COMP[k].en:COMP[k].ar) : ""; }).filter(Boolean).join(l==="en"?", ":"، ");
      html += '<div class="ml-entry">'
        + '<div class="ml-info">'
        + '<b>' + meta.icon + ' ' + (l==="en"?meta.en:meta.ar) + '</b>'
        + '<small>❝ ' + entry.epitaph + ' ❞</small>'
        + '<small>' + dateStr + ' · ' + entry.decisions + (l==="en"?" decisions":" قرار") + (compNames?" · "+compNames:"") + '</small>'
        + '</div></div>';
    });
  }
  html += '<button class="btn pri" onclick="document.getElementById(\'pn\').classList.remove(\'on\')">' + (l==="en"?"Close":"إغلاق") + '</button>';
  e.innerHTML = '<div>' + html + '</div>';
  e.classList.add("on");
}

/* ═══════════════ 8) معرض النهايات ═══════════════ */
function openEndingGalleryV5(){
  const l = _L();
  const e = _el("pn");
  const seen = (function(){ try{ return JSON.parse(localStorage.getItem("najat_eg")||"[]"); }catch(e){ return []; } })();
  const all = Object.keys(EPITAPHS);
  const found = seen.filter(function(x){return all.indexOf(x)!==-1;}).length;
  let html = '<h3>🏁 ' + (l==="en"?"Endings Gallery":"معرض النهايات") + '</h3>';
  html += '<div class="mut" style="margin-bottom:10px">' + (l==="en"?"Discovered "+found+" of "+all.length:"اكتشفتَ "+found+" من "+all.length) + '</div>';
  html += '<div class="end-grid">';
  all.forEach(function(k){
    const meta = (typeof END_META!=="undefined" && END_META[k]) ? END_META[k] : {icon:"📖", ar:k, en:k};
    const isSeen = seen.indexOf(k) !== -1;
    html += '<div class="end-cell' + (isSeen?" seen":"") + '">'
      + '<span class="ic">' + (isSeen ? meta.icon : "❓") + '</span>'
      + '<div class="nm">' + (isSeen ? (l==="en"?meta.en:meta.ar) : (l==="en"?"Undiscovered":"لم تُكتشف")) + '</div>'
      + '</div>';
  });
  html += '</div>';
  if (found < all.length){
    html += '<div class="mut" style="margin-top:12px;font-style:italic;text-align:center">' + (l==="en"?"Every choice opens a door. Some doors you have not yet tried.":"كل قرار يفتح بابًا. بعض الأبواب لم تجرّبها بعد.") + '</div>';
  }
  html += '<button class="btn pri" onclick="document.getElementById(\'pn\').classList.remove(\'on\')">' + (l==="en"?"Close":"إغلاق") + '</button>';
  e.innerHTML = '<div>' + html + '</div>';
  e.classList.add("on");
}

/* ═══════════════ 9) تصدير الحكاية ═══════════════ */
const CHAPTER_NAMES_V5 = {
  1:{ar:"الفصل الأول: دارفور",en:"Chapter 1: Darfur"},
  2:{ar:"الفصل الثاني: الخرطوم",en:"Chapter 2: Khartoum"},
  3:{ar:"الفصل الثالث: ديسمبر",en:"Chapter 3: December"},
  4:{ar:"الفصل الرابع: قبل الحرب",en:"Chapter 4: Before the War"},
  5:{ar:"الفصل الخامس: الحرب",en:"Chapter 5: War"},
  6:{ar:"الفصل السادس: الخرطوم الجريحة",en:"Chapter 6: Wounded Khartoum"}
};

function exportStoryV5(key, epi){
  const l = _L();
  const traits = epi ? epi.traits : computeTraitsV5();
  const comps = (typeof companionsOf === "function") ? companionsOf() : [];
  const meta = (typeof END_META!=="undefined" && END_META[key]) ? END_META[key] : {icon:"📖", ar:key, en:key};
  const dateStr = new Date().toLocaleString(l==="en"?"en":"ar");

  let md = "";
  if (l==="en"){
    md += "# Survival — My Story\n\n";
    md += "**Date:** " + dateStr + "  \n";
    md += "**Chapters:** " + ((s && s._ch) || 1) + "  \n";
    md += "**Decisions:** " + ((s && s.log) ? s.log.length : 0) + "  \n";
    if (comps.length) md += "**Companions:** " + comps.map(function(k){return COMP[k].en;}).join(", ") + "  \n";
    md += "\n---\n\n";
  } else {
    md += "# النجاة — حكايتي\n\n";
    md += "**التاريخ:** " + dateStr + "  \n";
    md += "**الفصول:** " + ((s && s._ch) || 1) + "  \n";
    md += "**القرارات:** " + ((s && s.log) ? s.log.length : 0) + "  \n";
    if (comps.length) md += "**الرفاق:** " + comps.map(function(k){return COMP[k].ar;}).join("، ") + "  \n";
    md += "\n---\n\n";
  }

  for (let c=1; c<=6; c++){
    const labels = (s && s.log) ? s.log.filter(function(x){return x.ch===c;}) : [];
    if (!labels.length) continue;
    md += "## " + CHAPTER_NAMES_V5[c][l] + "\n\n";
    labels.forEach(function(x){ md += "- " + (x.ar || "") + "\n"; });
    md += "\n";
  }

  md += "\n---\n\n## " + (l==="en"?"Ending":"النهاية") + ": " + (l==="en"?meta.en:meta.ar) + "\n\n";
  if (epi && epi.parts){
    epi.parts.forEach(function(p){ md += p + "\n\n"; });
    md += "\n> ❦ **" + epi.epitaph + "** ❦\n\n";
  }

  md += "\n---\n\n## " + (l==="en"?"Traits":"السمات") + "\n\n";
  const traitNames = {mercy:{ar:"الرحمة",en:"Mercy"},courage:{ar:"الشجاعة",en:"Courage"},caution:{ar:"الحذر",en:"Caution"},harshness:{ar:"القسوة",en:"Harshness"}};
  Object.keys(traits).forEach(function(k){
    md += "- " + traitNames[k][l] + ": " + traits[k] + "\n";
  });

  md += "\n---\n\n*" + (l==="en"?"Generated by Survival — an interactive fiction game.":"صُنعت بواسطة النجاة — لعبة قصصية تفاعلية.") + "*\n";

  try{
    const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "najat-story-" + Date.now() + ".md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    if (typeof toast==="function") toast(l==="en"?"✅ Story exported":"✅ صُدّرت الحكاية");
  }catch(e){
    console.error(e);
    if (typeof toast==="function") toast(l==="en"?"⚠️ Export failed":"⚠️ تعذّر التصدير");
  }
}

/* ═══════════════ 10) اعتراض renderEnding ═══════════════ */
const _prevREv5 = window.renderEnding;
window.renderEnding = function(key){
  window._currentEndingKey = key;
  const result = _prevREv5.apply(this, arguments);

  setTimeout(function(){
    try{
      const epi = buildEpilogueV5(key);
      injectEpilogueV5(key, epi);
      saveToMemoryLaneV5(key, epi);

      const endDiv = document.querySelector(".end");
      if (!endDiv || endDiv.querySelector("[data-v5]")) return;
      const priBtn = endDiv.querySelector(".btn.pri");
      if (!priBtn) return;

      const l = _L();
      const btnRow = document.createElement("div");
      btnRow.setAttribute("data-v5","1");
      btnRow.style.marginTop = "12px";

      const btns = [
        {icon:"📚", ar:"أرشيف حكاياتي", en:"Memory Lane", fn:openMemoryLaneV5},
        {icon:"🏁", ar:"معرض النهايات", en:"Endings Gallery", fn:openEndingGalleryV5},
        {icon:"📥", ar:"صدّر الحكاية", en:"Export Story", fn:function(){ exportStoryV5(key, epi); }}
      ];
      btns.forEach(function(b){
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerHTML = b.icon + " " + (l==="en"?b.en:b.ar);
        btn.onclick = b.fn;
        btnRow.appendChild(btn);
      });
      priBtn.insertAdjacentElement("beforebegin", btnRow);
    }catch(e){
      console.error("v5 ending injection failed:", e);
    }
  }, 120);

  return result;
};

/* ═══════════════ 11) إضافة أزرار للقائمة الرئيسية ═══════════════ */
const _prevMenuV5 = window.showMenu;

  const result = _prevMenuV5.apply(this, arguments);

    const app = _el("app");
    if (!app || app.querySelector("[data-v5-menu]")) return result;
    const settingsBtn = Array.from(app.querySelectorAll("button")).find(function(b){
      const t = b.textContent || "";
      return t.indexOf("الإعدادات")!==-1 || t.indexOf("Settings")!==-1;
    });
    if (!settingsBtn) return result;
    const l = _L();
    const wrap = document.createElement("div");
    wrap.setAttribute("data-v5-menu","1");
    wrap.innerHTML = ''
      + '<button class="btn" onclick="window.openEndingGalleryV5()">🏁 ' + (l==="en"?"Endings Gallery":"معرض النهايات") + '</button>'
      + '<button class="btn" onclick="window.openMemoryLaneV5()">📚 ' + (l==="en"?"Memory Lane":"أرشيف حكاياتي") + '</button>';
    settingsBtn.insertAdjacentElement("afterend", wrap);
  }catch(e){}
  return result;
};
