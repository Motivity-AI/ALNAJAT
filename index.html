<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرماد الأخير — The Last Ash</title>
<style>
:root{
  --bg:#050403;--panel:#0f0b08;--panel2:#18110c;--line:#281f15;
  --ink:#f5ebd9;--dim:#9e876a;--amber:#d49742;--red:#a8382e;
  --sand:#c9a227;--blue:#4a7c8c;--green:#5a8a3a;--violet:#7a5c8a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(circle at 50% -20%,#241609 0%,#050403 60%);
  color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  display:flex;justify-content:center;padding:14px 12px 70px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
#particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{position:absolute;width:2px;height:2px;background:var(--amber);border-radius:50%;opacity:0;animation:fall linear infinite;box-shadow:0 0 3px var(--amber)}
@keyframes fall{0%{transform:translateY(-20px);opacity:0}10%{opacity:.4}90%{opacity:.2}100%{transform:translateY(100vh) translateX(30px);opacity:0}}
#app{width:100%;max-width:820px;position:relative;z-index:2}

#topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px;flex-wrap:wrap}
#chapterLabel{font-size:11px;letter-spacing:2px;color:var(--amber);font-weight:700;padding:6px 12px;background:linear-gradient(180deg,#1e1610,#14100c);border:1px solid var(--line);border-radius:20px;white-space:nowrap}
#controls{display:flex;gap:5px;flex-wrap:wrap}
#controls button{background:linear-gradient(180deg,#1c1610,#14100c);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
#controls button:hover{border-color:var(--amber);background:#241a12}
#controls button.off{opacity:.45}

#hud{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
@media(max-width:560px){#hud{grid-template-columns:repeat(3,1fr)}}
.chip{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:9px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:all .3s}
.chip.crit{border-color:var(--red);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,56,46,.4)}50%{box-shadow:0 0 0 6px rgba(168,56,46,0)}}
.chip .lbl{font-size:9px;color:var(--dim);letter-spacing:.3px}
.chip .val{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:#1f1812;border-radius:99px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .55s ease}

#worldMap{background:#0b0806;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:4px;overflow-x:auto}
.map-node{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:3px;white-space:nowrap}
.map-node.active{color:var(--amber);font-weight:700;text-shadow:0 0 6px rgba(212,151,66,.4)}
.map-line{flex:1;height:1px;background:var(--line);min-width:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 55px rgba(0,0,0,.6)}
#sceneImg{width:100%;height:200px;position:relative;border-bottom:1px solid var(--line);overflow:hidden;transition:background 1.1s ease}
#sceneImg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.65))}
#sceneImg .mood-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:54px;opacity:.42;filter:blur(1px);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-56%)}}
@media(max-width:520px){#sceneImg{height:150px}.mood-icon{font-size:38px}}
.avatar{position:absolute;bottom:10px;right:12px;width:46px;height:46px;background:linear-gradient(135deg,#2a1a10,#1a1008);border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2}
.card-body{padding:22px 20px}
#scene{line-height:2.15;font-size:15.5px;min-height:90px}
#scene p{margin:0 0 15px;opacity:0;transform:translateY(6px);transition:all .5s ease}
#scene p:last-child{margin-bottom:0}
.speaker{color:var(--amber);font-weight:700}
.hl{color:var(--sand);font-weight:600}
.warn-txt{color:var(--red);font-weight:600}
.thought{display:block;background:rgba(122,92,138,.08);border-right:2px solid var(--violet);padding:8px 12px;border-radius:0 6px 6px 0;font-style:italic;color:#b8a8c8;font-size:13.5px;margin:8px 0}
[dir="ltr"] .thought{border-right:none;border-left:2px solid var(--violet);border-radius:6px 0 0 6px}
.fact{background:rgba(74,124,140,.06);border-right:2px solid var(--blue);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:#9ab8c8;margin:10px 0;line-height:1.8}
[dir="ltr"] .fact{border-right:none;border-left:2px solid var(--blue);border-radius:6px 0 0 6px}

#choices{display:flex;flex-direction:column;gap:8px}
.choice{width:100%;text-align:right;cursor:pointer;background:linear-gradient(180deg,#1c1610,#14100c);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14.5px;font-family:inherit;line-height:1.6;transition:all .2s;display:flex;align-items:center;gap:10px}
[dir="ltr"] .choice{text-align:left}
.choice:hover{background:linear-gradient(180deg,#281e15,#1b140f);border-color:var(--amber);transform:translateX(-3px)}
[dir="ltr"] .choice:hover{transform:translateX(3px)}
.choice .bullet{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--amber);opacity:.8}
.choice .preview{font-size:10.5px;color:var(--dim);margin-right:auto;padding-right:6px;display:none}
[dir="ltr"] .choice .preview{margin-right:0;margin-left:auto;padding-right:0;padding-left:6px}
.choice:hover .preview{display:inline}
.choice.req{opacity:.5;cursor:not-allowed}

#companionDisplay{margin-bottom:10px;display:none}
.companion-box{background:#130e0a;border:1px solid var(--amber);border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sand)}
.companion-box.wounded{border-color:var(--red);color:#e0a8a8}
.companion-box span{font-size:18px}
.companion-box .status{font-size:10.5px;color:var(--dim);margin-top:2px}

#chapterBanner{position:fixed;inset:0;background:rgba(5,4,3,.95);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;animation:fadeIn .4s ease}
#chapterBanner.show{display:flex}
#chapterBanner h1{color:var(--amber);font-size:24px;margin:0;text-align:center;padding:0 18px;line-height:1.6}
#chapterBanner .num{font-size:11px;color:var(--dim);letter-spacing:3px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;animation:fadeIn .3s ease}
.modal.show{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:600px;width:100%;max-height:82vh;overflow-y:auto}
.modal-content h2{margin:0 0 14px;color:var(--amber);font-size:18px}
.inv-grid,.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.inv-item,.market-item{background:#140e0a;border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.inv-item .icon,.market-item .icon{font-size:22px}
.inv-item .name,.market-item .name{font-size:12px;font-weight:700}
.inv-item .desc,.market-item .desc{font-size:10.5px;color:var(--dim);line-height:1.35}
.inv-item button,.market-item button{margin-top:auto;background:var(--amber);color:#000;border:none;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}
.empty-msg{color:var(--dim);font-size:13px;text-align:center;padding:20px;grid-column:1/-1}
.modal-content button.close-btn{background:#1c1610;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 18px;cursor:pointer;font-family:inherit;margin-top:10px;width:100%}
.modal-content button.close-btn:hover{border-color:var(--amber)}
.diary-entry{border-right:2px solid var(--amber);padding:8px 12px;margin-bottom:8px;font-size:13px;line-height:1.85;color:var(--dim);background:rgba(212,151,66,.02);border-radius:0 7px 7px 0}
[dir="ltr"] .diary-entry{border-right:none;border-left:2px solid var(--amber);border-radius:7px 0 0 7px}
.diary-entry .when{color:var(--amber);font-size:11px;margin-bottom:3px;font-weight:700}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.ach-item{background:#140e0a;border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center}
.ach-item.unlocked{border-color:var(--amber);background:rgba(212,151,66,.06)}
.ach-item.locked{opacity:.4}
.ach-item .ic{font-size:22px;margin-bottom:3px}
.ach-item .tt{font-size:11px;font-weight:700}
.ach-item .ds{font-size:9.5px;color:var(--dim);margin-top:2px}

.eg-grid{display:grid;gap:8px}
.eg-item{background:#140e0a;border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;gap:10px;align-items:center}
.eg-item.found{border-color:var(--amber)}
.eg-item.locked{opacity:.4}
.eg-item .ic{font-size:26px}
.eg-item .tt{font-weight:700;font-size:13px;margin-bottom:2px}
.eg-item .ds{font-size:11px;color:var(--dim)}

.ending-h{font-size:22px;font-weight:700;margin:0 0 12px;line-height:1.5}
.ending-h.peace{color:var(--sand)}
.ending-h.dark{color:var(--red)}
.ending-h.broken{color:#8a7a5a}
.ending-h.martyr{color:var(--green)}
.quote{border-right:3px solid var(--amber);padding:10px 14px;color:var(--dim);font-style:italic;margin:14px 0;background:rgba(212,151,66,.04);border-radius:0 8px 8px 0;line-height:1.75}
[dir="ltr"] .quote{border-right:none;border-left:3px solid var(--amber);border-radius:8px 0 0 8px}
.stats-box{background:#0b0806;border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;font-size:12.5px;line-height:1.9}
.stats-box .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--dim)}
.stats-box .row span:last-child{color:var(--ink);font-weight:600}
.analysis{background:rgba(122,92,138,.06);border:1px solid rgba(122,92,138,.3);border-radius:9px;padding:12px;margin:12px 0;font-size:13px;line-height:1.85;color:#c8b8d8}
.analysis h4{margin:0 0 6px;color:var(--violet);font-size:14px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#18110c;border:1px solid var(--amber);color:var(--ink);padding:10px 18px;border-radius:11px;font-size:12.5px;z-index:150;transition:transform .4s ease;pointer-events:none;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

#achPop{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-120px);background:linear-gradient(135deg,#2a1a10,#1a1008);border:2px solid var(--amber);padding:12px 20px;border-radius:12px;z-index:180;display:flex;align-items:center;gap:10px;box-shadow:0 15px 40px rgba(0,0,0,.7);transition:transform .5s cubic-bezier(.4,0,.2,1);pointer-events:none}
#achPop.show{transform:translateX(-50%) translateY(0)}
#achPop .ic{font-size:28px}
#achPop .tx{font-size:12px}
#achPop .tx strong{display:block;color:var(--amber);font-size:13px}
</style>
</head>
<body dir="rtl">
<div id="particles"></div>
<div id="app">
  <div id="topbar">
    <span id="chapterLabel">الفصل الأول · دارفور</span>
    <div id="controls">
      <button id="langBtn" onclick="toggleLang()">EN</button>
      <button id="invBtn">🎒 (<span id="invCount">0</span>)</button>
      <button id="marketBtn">🛒</button>
      <button id="diaryBtn">📔</button>
      <button id="achBtn">🏆</button>
      <button id="egBtn">🎭</button>
      <button id="saveBtn">💾</button>
      <button id="loadBtn">📂</button>
      <button id="soundBtn">🔊</button>
    </div>
  </div>

  <div id="worldMap">
    <div class="map-node" id="m-darfur">🌄 <span data-i18n="m_darfur">دارفور</span></div>
    <div class="map-line"></div>
    <div class="map-node" id="m-desert">🏜️ <span data-i18n="m_desert">الصحراء</span></div>
    <div class="map-line"></div>
    <div class="map-node" id="m-market">🛒 <span data-i18n="m_market">أم درمان</span></div>
    <div class="map-line"></div>
    <div class="map-node" id="m-khartoum">🏙️ <span data-i18n="m_khartoum">الخرطوم</span></div>
    <div class="map-line"></div>
    <div class="map-node" id="m-fasher">🔥 <span data-i18n="m_fasher">الفاشر</span></div>
    <div class="map-line"></div>
    <div class="map-node" id="m-borders">🚪 <span data-i18n="m_borders">الحدود</span></div>
  </div>

  <div id="companionDisplay"></div>
  <div id="hud"></div>

  <div class="card">
    <div id="sceneImg"><span class="mood-icon"></span><div class="avatar" id="avatarIcon">👦</div></div>
    <div class="card-body"><div id="scene"></div></div>
  </div>
  <div id="choices"></div>
</div>

<div id="chapterBanner"><span class="num" id="chNum"></span><h1 id="chTitle"></h1></div>

<div id="invModal" class="modal"><div class="modal-content">
  <h2 data-i18n="inv_title">🎒 الحقيبة</h2>
  <div id="invList" class="inv-grid"></div>
  <button class="close-btn" onclick="closeModal('invModal')" data-i18n="close">إغلاق</button>
</div></div>

<div id="marketModal" class="modal"><div class="modal-content">
  <h2 data-i18n="market_title">🛒 السوق</h2>
  <div id="marketList" class="market-grid"></div>
  <button class="close-btn" onclick="closeModal('marketModal')" data-i18n="close">إغلاق</button>
</div></div>

<div id="diaryModal" class="modal"><div class="modal-content">
  <h2 data-i18n="diary_title">📔 مذكرات الرحلة</h2>
  <div id="diaryList"></div>
  <button class="close-btn" onclick="closeModal('diaryModal')" data-i18n="close">إغلاق</button>
</div></div>

<div id="achModal" class="modal"><div class="modal-content">
  <h2 data-i18n="ach_title">🏆 الإنجازات</h2>
  <div id="achGrid" class="ach-grid"></div>
  <button class="close-btn" onclick="closeModal('achModal')" data-i18n="close">إغلاق</button>
</div></div>

<div id="egModal" class="modal"><div class="modal-content">
  <h2 data-i18n="eg_title">🎭 معرض النهايات</h2>
  <div id="egGrid" class="eg-grid"></div>
  <button class="close-btn" onclick="closeModal('egModal')" data-i18n="close">إغلاق</button>
</div></div>

<div id="achPop"><span class="ic">🏆</span><div class="tx"><strong data-i18n="ach_pop">إنجاز!</strong><span id="achPopTxt"></span></div></div>
<div id="toast"></div>

<script>
/* ================= i18n & STRINGS ================= */
let lang = 'ar';
const i18n = {
  ar: {
    m_darfur: 'دارفور', m_desert: 'الصحراء', m_market: 'أم درمان', m_khartoum: 'الخرطوم', m_fasher: 'الفاشر', m_borders: 'الحدود',
    inv_title: '🎒 الحقيبة', market_title: '🛒 السوق', diary_title: '📔 مذكرات الرحلة', ach_title: '🏆 الإنجازات', eg_title: '🎭 معرض النهايات',
    close: 'إغلاق', ach_pop: 'إنجاز!', use: 'استخدام', buy: 'شراء', empty_inv: 'الحقيبة فارغة.', empty_diary: 'لم تُدون أي ذكرى بعد.',
    locked: 'مغلق', unknown: '؟؟؟', unselected_eg: 'غير مكتشفة', desc_eg: 'أكمل الرحلة',
    age: 'العمر', water: '💧 ماء', food: '🍲 شبع', health: '❤️ صحة', hope: '✨ أمل',
    chapters: {
      1: 'دارفور · ٢٠٠٣', 2: 'الطريق إلى الخرطوم', 3: 'أم درمان · الرصيف', 4: 'الخرطوم · الصعود', 5: 'البيت والأسرة',
      6: '١٥ أبريل ٢٠٢٣', 7: 'الفاشر · الحصار', 8: 'غرف الطوارئ', 9: 'الحدود', 10: 'الخاتمة'
    }
  },
  en: {
    m_darfur: 'Darfur', m_desert: 'Desert', m_market: 'Omdurman', m_khartoum: 'Khartoum', m_fasher: 'Al-Fashir', m_borders: 'Borders',
    inv_title: '🎒 Inventory', market_title: '🛒 Market', diary_title: '📔 Journal', ach_title: '🏆 Achievements', eg_title: '🎭 Endings Gallery',
    close: 'Close', ach_pop: 'Achievement Unlocked!', use: 'Use', buy: 'Buy', empty_inv: 'Inventory is empty.', empty_diary: 'No entries yet.',
    locked: 'Locked', unknown: '???', unselected_eg: 'Undiscovered', desc_eg: 'Complete the journey',
    age: 'Age', water: '💧 Water', food: '🍲 Food', health: '❤️ Health', hope: '✨ Hope',
    chapters: {
      1: 'Darfur · 2003', 2: 'Road to Khartoum', 3: 'Omdurman · Pavement', 4: 'Khartoum · Rise', 5: 'Home & Family',
      6: 'April 15, 2023', 7: 'Al-Fashir · Siege', 8: 'Emergency Rooms', 9: 'Borders', 10: 'Epilogue'
    }
  }
};

function toggleLang(){
  lang = (lang === 'ar') ? 'en' : 'ar';
  document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  $('langBtn').textContent = (lang === 'ar') ? 'EN' : 'عربي';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if(i18n[lang][k]) el.textContent = i18n[lang][k];
  });
  render();
  updateHUD();
}

/* ================= MOODS ================= */
const MOODS={
  war:{sky1:'#3a0d08',sky2:'#0a0403',icon:'🔥'},
  darfur:{sky1:'#5c2a10',sky2:'#1a0f08',icon:'🌄'},
  attack:{sky1:'#4a1a08',sky2:'#0f0604',icon:'⚠️'},
  desert:{sky1:'#c98e3f',sky2:'#5c3a1a',icon:'🏜️'},
  city:{sky1:'#1a2233',sky2:'#0a0d15',icon:'🏙️'},
  market:{sky1:'#6a3a18',sky2:'#2a1508',icon:'🛒'},
  work:{sky1:'#3a2a1a',sky2:'#15100a',icon:'🔧'},
  home:{sky1:'#4a3a2a',sky2:'#1a120a',icon:'🏠'},
  prison:{sky1:'#1a1a1a',sky2:'#050505',icon:'⛓️'},
  hope:{sky1:'#8a6a2a',sky2:'#2a2010',icon:'✨'},
  peace:{sky1:'#7a9a5a',sky2:'#2a3a1a',icon:'🕊️'},
  dark:{sky1:'#1a1010',sky2:'#050303',icon:'🌑'},
  famine:{sky1:'#5a3a10',sky2:'#1a0f05',icon:'🍂'},
  border:{sky1:'#8a7040',sky2:'#2a2010',icon:'🚪'}
};

const AVATARS={child:'👦',teen:'🧑',adult:'👨',elder:'👴',prisoner:'🧔'};

/* ================= ITEMS ================= */
const ITEMS={
  water:{name:{ar:'قربة ماء',en:'Water Pouch'},icon:'💧',desc:{ar:'+٣٠ ماء. ضرورية للبقاء.',en:'+30 Water. Essential.'},price:40,use:s=>{s.water=Math.min(100,s.water+30);toast(lang==='ar'?'💧 شربت ماءً.. ارتوى جسدك.':'💧 Drank water.. revitalized.')}},
  food:{name:{ar:'كسرة وملاح',en:'Bread & Stew'},icon:'🍲',desc:{ar:'+٣٥ شبع. تسد الجوع.',en:'+35 Food. Fights hunger.'},price:80,use:s=>{s.food=Math.min(100,s.food+35);toast(lang==='ar'?'🍲 أكلت.. سكن جوعك.':'🍲 Ate.. hunger eased.')}},

/* ================= AUDIO ================= */
let audioCtx=null,soundOn=true,amb=[];
function tone(f,d=0.15,t='sine',v=0.035){
  if(!soundOn)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function stopAmb(){amb.forEach(n=>{try{n.o.stop();n.l.stop()}catch(e){}});amb=[]}
function startAmb(m){
  if(!soundOn)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    stopAmb();
    const map={war:[110,165],darfur:[146,220],desert:[164,246],city:[196,294],market:[174,261],work:[130,195],home:[220,330],prison:[98,147],hope:[261,392],peace:[329,440],dark:[110,165],famine:[87,130],border:[164,220]};
    const f=map[m]||map.darfur;
    f.forEach((fr,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),l=audioCtx.createOscillator(),lg=audioCtx.createGain();
      o.type='sine';o.frequency.value=fr;
      g.gain.setValueAtTime(.006,audioCtx.currentTime);
      l.frequency.value=.1+i*.05;lg.gain.value=1.3;
      l.connect(lg);lg.connect(o.frequency);l.start();
      o.connect(g);g.connect(audioCtx.destination);o.start();
      amb.push({o,g,l});
    });
  }catch(e){}
}

const scenes={};

const sceneEl=$('scene'),choicesEl=$('choices'),imgEl=$('sceneImg'),chLabel=$('chapterLabel'),avatarEl=$('avatarIcon');

function setMood(m){
  const x=MOODS[m]||MOODS.darfur;
  imgEl.style.background=`linear-gradient(180deg,${x.sky1} 0%,${x.sky2} 100%)`;
  imgEl.querySelector('.mood-icon').textContent=x.icon;

function showBanner(ch){
  $('chNum').textContent=(lang==='ar'?'الفصل ':'Chapter ')+ch;
  $('chTitle').textContent=i18n[lang].chapters[ch]||'';
  $('chapterBanner').classList.add('show');
  tone(392,.15);setTimeout(()=>tone(523,.18),130);setTimeout(()=>tone(659,.22),280);
  setTimeout(()=>$('chapterBanner').classList.remove('show'),1700);
}

function drain(){
  S.water=Math.max(0,S.water-5);
  S.food=Math.max(0,S.food-4);
  if(S.uthman&&S.uthman.alive){
    S.water=Math.max(0,S.water-3);
    S.food=Math.max(0,S.food-2);
  }
  if(S.water===0){S.health=Math.max(0,S.health-8);toast(lang==='ar'?'⚠️ عطش شديد!':'⚠️ Severe thirst!')}
  if(S.food===0){S.health=Math.max(0,S.health-6);toast(lang==='ar'?'⚠️ جوع قاتل!':'⚠️ Severe hunger!')}
  if(S.uthman&&S.uthman.alive&&S.uthman.wounded){
    S.uthman.bond=Math.max(0,S.uthman.bond-3);
    if(S.uthman.bond<=0){S.uthman.alive=false;toast(lang==='ar'?'💔 مات عثمان.':'💔 Uthman passed away.');unlockAch('uthman_lost')}
  }
}

function render(){
  const sc=scenes[S.node];if(!sc)return;
  if(sc.chapter&&sc.chapter!==S.chapter){S.chapter=sc.chapter;showBanner(S.chapter)}
  chLabel.textContent=(lang==='ar'?'الفصل ':'Chapter ')+S.chapter+' · '+i18n[lang].chapters[S.chapter].split(' · ')[0];
  setMood(sc.mood||'darfur');
  if(sc.map)setMap(sc.map);

  const txt=typeof sc.text==='function'?sc.text(S):(sc.text[lang]||sc.text.ar);
  sceneEl.innerHTML=txt.split('\n').filter(l=>l.trim()).map(l=>`<p>${l}</p>`).join('');
  sceneEl.querySelectorAll('p').forEach((p,i)=>setTimeout(()=>{p.style.opacity='1';p.style.transform='none'},50+i*80));

  choicesEl.innerHTML='';
  sc.choices.forEach(c=>{
    if(c.if&&!c.if(S))return;
    const b=document.createElement('button');
    b.className='choice';
    const dis=c.lock&&c.lock(S);
    if(dis)b.classList.add('req');
    const cText = typeof c.t==='object'?c.t[lang]:c.t;
    const cHint = c.hint? (typeof c.hint==='object'?c.hint[lang]:c.hint):'';
    b.innerHTML=`<span class="bullet"></span><span>${cText}</span><span class="preview">${cHint}</span>`;
    if(!dis)b.onclick=()=>handleChoice(c);
    choicesEl.appendChild(b);
  });

  updateHUD();
}

function handleChoice(c){
  tone(440,.08);
  if(c.do)c.do(S);
  S.stats.choices++;clamp(S);
  if(S.health<=0&&c.to!=='ending'){S.node='death';updateHUD();render();return}
  drain();
  if(S.health<=0){S.node='death';updateHUD();render();return}
  S.node=c.to;
  updateHUD();render();window.scrollTo({top:0,behavior:'smooth'});
}

أمك سحبتك من يدك وغطّت عينيك بكفها الخشنة.
حين سمعت صوت الحوافر والصيحات، نظرت إليك أمك نظرة لن تنسى: <span class="speaker">«اجرِ. لا تلتفت.»</span>`,
  en:`The well is a 15-minute walk. On the way, you saw a fallen body.
Your mother pulled your hand and covered your eyes.
Hearing hooves and shouts, she looked at you unforgettably: <span class="speaker">«Run. Do not look back.»</span>`
},
choices:[
{t:{ar:'تجري بأقصى ما تستطيع',en:'Run as fast as you can'},do:s=>{s.energy-=20;s.water-=10;s.hope-=5},to:'raid',hint:{ar:'طاقة -',en:'Energy -'}},
{t:{ar:'تتجمّد من الخوف',en:'Freeze in fear'},do:s=>{s.hope-=10;s.health-=5},to:'raid',hint:{ar:'أمل --',en:'Hope --'}}]});

def('raid',{chapter:1,mood:'war',map:'m-darfur',
text:{
  ar:`دفعك أبوك من النافذة الخلفية صارخاً: <span class="speaker">«لا تلتفت!»</span>
سمعت خلفك ما لا يوصف. ركضت حتى انقطع نفسك. حين توقفت، كنت وحدك.
<span class="thought">💭 كلمة أبيك الأخيرة في أذنك: لا تلتفت.</span>`,
  en:`Your father pushed you out the back window shouting: <span class="speaker">«Do not look back!»</span>
You heard the unspeakable behind you. You ran until breathless. When you stopped, you were alone.
<span class="thought">💭 Your father's last words ring in your ear: Do not look back.</span>`
},
choices:[
{t:{ar:'تجري في الوادي حتى ينقطع نفسك',en:'Run down the valley'},do:s=>{s.energy-=25;s.health-=5;s.water-=12;s.hope-=10;addDiary(s,lang==='ar'?'تركت قريتي. لم ألتفت.':'Left my village. Didn\'t look back.');unlockAch('survive_darfur')},to:'valley',hint:{ar:'طاقة --',en:'Energy --'}},
{t:{ar:'تختبئ في حفرة تحت شجرة',en:'Hide in a pit'},do:s=>{s.health-=8;s.hope-=6;addDiary(s,lang==='ar'?'اختبأت ساعات.':'Hid for hours.');unlockAch('survive_darfur')},to:'valley',hint:{ar:'صحة -',en:'Health -'}}]});

def('valley',{chapter:2,mood:'desert',map:'m-desert',
text:{
  ar:`مشيت. الليل غطّى الوادي والصمت كان أسوأ من الصوت.
عمرك ٨ سنوات. ليس معك سوى قميص نوم وقربة ماء.
في الصباح، توقفت شاحنة عسكرية قديمة. رجل ضخم نظر إليك:
<span class="speaker">«هذا؟ صغير جداً.»</span>`,
  en:`You walked. Night covered the valley, and silence was worse than sound.
You are 8. Only a nightshirt and water pouch.
In the morning, an old military truck stopped. A huge man looked at you:
<span class="speaker">«This one? Too small.»</span>`
},
choices:[
{t:{ar:'تصعد بصمت وتجلس في المؤخرة',en:'Climb aboard silently'},do:s=>{s.energy-=10;s.hope-=3},to:'marshall',hint:{ar:'طاقة -',en:'Energy -'}},
{t:{ar:'تقول إنك تعرف الطرق',en:'Say you know the roads'},do:s=>{s.flags.useful=true;s.hope+=3},to:'marshall',hint:{ar:'أمل +',en:'Hope +'}}]});

def('marshall',{chapter:2,mood:'desert',map:'m-desert',
text:{
  ar:`تعلّمت أن الرجل يُنادى «المارشال». كان يتحدث عن صفقات وتقارير وشحنات تتجه للخرطوم.
هذا الرجل يمشي في طريقين. والذين يمشون في طريقين يعرفون أشياء كثيرة.
في نقطة التفتيش الأخيرة، سألوه عنك. قال: <span class="speaker">«هذا؟ غنيمتي.»</span>`,
  en:`You learned the man is called "The Marshal". He spoke of deals, reports, and shipments to Khartoum.
This man walks two paths. Those who walk two paths know many things.
At the last checkpoint, they asked about you. He said: <span class="speaker">«This? My spoils.»</span>`
},
choices:[
{t:{ar:'تصمت وتستجمع قوتك',en:'Stay silent & rest'},do:s=>{s.energy+=15;s.health+=3},to:'arrival',hint:{ar:'طاقة +',en:'Energy +'}},
{t:{ar:'تراقب وتتعلم الأسماء',en:'Observe and learn names'},do:s=>{s.flags.observer=true;s.hope+=3},to:'arrival',hint:{ar:'أمل +',en:'Hope +'}}]});

def('arrival',{chapter:3,mood:'city',map:'m-market',
text:{
  ar:`الخرطوم. أول ما أدهشك: لا دخان. لا طائرات.
نساء يضحكن في السوق. أطفال يجرون خلف كرة.
توقفت الشاحنة عند سوق أم درمان (١٩١٧). نزل المارشال وغاب بين الناس.`,
  en:`Khartoum. What struck you most: no smoke, no planes.
Women laughing in the market. Children chasing a ball.
The truck stopped at Omdurman market (1917). The Marshal stepped out and vanished.`
},
choices:[
{t:{ar:'تقفز من الشاحنة فوراً',en:'Jump off immediately'},do:s=>{s.health-=3;unlockAch('reach_khartoum')},to:'market',hint:{ar:'صحة -',en:'Health -'}},
{t:{ar:$ar='تنتظر حتى يغيب ثم تقفز',en:'Wait until he leaves'},do:s=>{s.hope+=2;unlockAch('reach_khartoum')},to:'market',hint:{ar:'أمل +',en:'Hope +'}}]});

def('market',{chapter:3,mood:'market',map:'m-market',
text:{
  ar:`الشارع طويل والوجوه كثيرة. الجوع يمزق أمعاءك.
لأول مرة مددت يدك طلباً للطعام. مرّ العشرات. بعضهم أسرع في الخطو.
واحد فقط توقف، نظر إليك، ثم مشى.`,
  en:`The street is long, faces are endless. Hunger tears at your gut.
For the first time, you held out your hand. Dozens passed. Some quickened their pace.
Only one stopped, looked at you, then walked away.`
},
choices:[
{t:{ar:'تمدّ يدك للمارّة',en:'Beg passersby'},do:s=>{s.hope-=10;s.humanity-=3;s.food-=5;addDiary(s,lang==='ar'?'مددت يدي. لم ينظر إليّ أحد.':'Begged. No one looked.')},to:'beg',hint:{ar:'أمل -',en:'Hope -'}},
{t:{ar:'تبحث عن عمل في مطعم',en:'Find work in a restaurant'},do:s=>{},to:'dishes',hint:{ar:'كرامة',en:'Dignity'}}]});

def('beg',{chapter:3,mood:'market',map:'m-market',
text:{
  ar:`في اليوم الثاني أعطاك عجوز نصف رغيف. في اليوم الثالث، صبي بصندوق أحذية قال: <span class="speaker">«تعال. أعلّمك.»</span>
أنقذ حياتك. في الشهر السادس صار عندك 300 جنيه.`,
  en:`On the second day, an old man gave you half a loaf. On the third day, a boy with a wooden box said: <span class="speaker">«Come. I will teach you.»</span>
He saved your life. By month six, you had 300 pounds.`
},
choices:[
{t:{ar:'تذهب إلى المطعم وتطلب أي عمل',en:'Go to the restaurant for work'},do:s=>{s.hope-=3;s.energy-=10;s.money+=300},to:'dishes',hint:{ar:'طاقة -',en:'Energy -'}}]});

def('dishes',{chapter:3,mood:'work',map:'m-market',
text:{
  ar:`في مطعم الحاج محمود، وقفت وقلت: <span class="speaker">«أنا أغسل الصحون وأنام في المخزن.»</span>
ستة أشهر من العمل الصامت. ثم قال لك ببرود: <span class="speaker">«ما بقى لي شغل ليك.»</span>`,
  en:`At Haj Mahmoud's restaurant, you said: <span class="speaker">«I wash dishes and sleep in the store.»</span>
Six months of silent work. Then he said coldly: <span class="speaker">«I have no more work for you.»</span>`
},
choices:[
{t:{ar:'تحكِ له كل شيء عن دارفور',en:'Tell him everything about Darfur'},do:s=>{s.money+=500;s.hope+=8;s.humanity+=5;addDiary(s,lang==='ar'?'حكيت للحاج محمود قصتي.':'Told Haj Mahmoud my story.')},to:'fired',hint:{ar:'أمل +',en:'Hope +'}},
{t:{ar:'تأخذ أجرك وتمشي بصمت',en:'Take your wage and leave'},do:s=>{s.money+=350;s.hope-=3},to:'fired',hint:{ar:'مال',en:'Money'}}]});

def('fired',{chapter:3,mood:'market',map:'m-market',
text:{
  ar:`اشتريت بالمال صابوناً وخرقة ودلواً. جلست في ركن السوق: «أغسل لك حذاءك؟»
بعد سنتين صار عندك 6000 جنيه.`,
  en:`You bought soap, a rag, and a bucket. Sat in a market corner: «Shall I clean your shoes?»
After two years, you had 6,000 pounds.`
},
choices:[
{t:{ar:'تواصل العمل عامين كاملين',en:'Continue working for 2 years'},do:s=>{s.money+=6000;s.energy-=15;s.age=10;addDiary(s,lang==='ar'?'سنتان على الرصيف.':'Two years on the pavement.');unlockAch('reach_khartoum')},to:'uthman_meet',hint:{ar:'مال ++',en:'Money ++'}}]});

def('uthman_meet',{chapter:3,mood:'market',map:'m-market',
text:{
  ar:`في ليلة باردة، سمعت بكاءً خافتم خلف صندوق خشبي. طفل في الخامسة، يرتجف في ثياب ممزقة. كيس فول سوداني أمامه. لم يبع شيئاً.
قال بصوت مرتجف: <span class="speaker">«اسمي عثمان.»</span>`,
  en:`On a cold night, you heard soft weeping behind a wooden box. A 5-year-old boy shivering in rags, a bag of peanuts before him. He sold nothing.
He whispered: <span class="speaker">«My name is Uthman.»</span>`
},
choices:[
{t:{ar:'تأخذه معك وتطعمه وتعلمه',en:'Take him in, feed & teach him'},do:s=>{
  s.uthman={name:'Uthman',bond:80,wounded:false,alive:true};
  s.hope+=15;s.humanity+=10;s.food-=15;s.water-=10;s.money-=100;
  addDiary(s,lang==='ar'?'وجدت عثمان وأخذته معي.':'Found Uthman and took him in.');
  unlockAch('find_uthman');
},to:'network',hint:{ar:'رفيق 👥',en:'Companion 👥'}},
{t:{ar:'تعطيه نصف رغيفك وتتركه',en:'Give him half your bread & leave'},do:s=>{
  s.food-=5;s.humanity-=5;s.hope-=5;
},to:'network',hint:{ar:'بلا رفيق',en:'Alone'}}]});

def('network',{chapter:4,mood:'work',map:'m-market',
text:function(s){
const c=s.uthman&&s.uthman.alive?(lang==='ar'?'\n\nعثمان بجانبك كل يوم. غدا أخاك الصغير.':'\n\nUthman is by your side every day. He became your little brother.'):'';
return {
  ar:`بعد سنتين، صار في جيبك 12000 جنيه.
وزّعتها على أطفال الطرقات وقلت لهم: <span class="speaker">«كل واحد في ركنه، ونقتسم بالعدل.»</span>${c}`,
  en:`Two years later, you had 12,000 pounds.
Distributed tools to street kids and said: <span class="speaker">«Each in their corner, we share fairly.»</span>${c}`
};},
choices:[
{t:{ar:'تكون عادلاً معهم',en:'Be fair with them'},do:s=>{s.flags.fair=true;s.hope+=15;s.humanity+=12;s.money+=14000},to:'bike',hint:{ar:'ضمير',en:'Conscience'}},
{t:{ar:'تأخذ أكثر مما ينبغي',en:'Take more than your share'},do:s=>{s.flags.harsh=true;s.hope-=12;s.humanity-=15;s.money+=25000},to:'bike',hint:{ar:'مال',en:'Money'}}]});

def('bike',{chapter:4,mood:'work',map:'m-market',
text:{
  ar:`سنة أخرى. اشتريت دراجة. أنت، طفل دارفور الحافي، تبيع التسالي والفول.
الرصيف صار لك.`,
  en:`Another year. Bought a bicycle. You, the barefoot Darfur child, selling peanuts.
The pavement became yours.`
},
choices:[
{t:{ar:'تواصل الادخار بصبر',en:'Save patiently'},do:s=>{s.money+=45000;s.energy-=15;s.age=14},to:'rickshaw',hint:{ar:'مال',en:'Money'}},
{t:{ar:'توسّع في البضاعة بجرأة',en:'Expand boldly'},do:s=>{s.money+=75000;s.energy-=25;s.hope+=4;s.age=14},to:'rickshaw',hint:{ar:'مال +',en:'Money +'}}]});

def('rickshaw',{chapter:4,mood:'city',map:'m-khartoum',
text:{
  ar:`ثم اشتريت ركشة. صرت تنقل الناس، توصّل المريض ليلاً، وتعيد الأطفال للمدارس. أصبحت جزءاً من نبض الخرطوم.`,
  en:`Then you bought a rickshaw. Transporting people, taking patients at night, school children. You became Khartoum's heartbeat.`
},
choices:[
{t:{ar:'تواصل العمل سنوات',en:'Work for years'},do:s=>{s.money+=150000;s.hope+=8;s.age=22},to:'bus',hint:{ar:'تقدم',en:'Progress'}}]});

def('bus',{chapter:4,mood:'work',map:'m-khartoum',
text:{
  ar:`في الـ٢٨، وقفت أمام حافلة «كريز» مستعملة. دفعت ثمنها كاملاً. أسميتها «فجر الأمل».
ثلاثون سنة من صندوق شاحنة إلى مقعد سائق.`,
  en:`At 28, you stood before a used bus. Paid in full. Named it "Dawn of Hope".
30 years from a truck bed to a driver's seat.`
},
choices:[
{t:{ar:'تكمل — امتلكت الحافلة',en:'Own the bus'},do:s=>{s.money+=900000;s.hope+=12;s.humanity+=3;s.age=28;addItem(s,'medicine');unlockAch('build_empire')},to:'house',hint:{ar:'إنجاز',en:'Achievement'}}]});

def('house',{chapter:5,mood:'home',map:'m-khartoum',
text:{
  ar:`بنيت بيتاً في أطراف العاصمة. غرفتان وباب حديدي. أول ليلة نمت فيها، بكيت لا خوفاً، بل طمأنينة.`,
  en:`Built a house on the capital's edge. Two rooms and an iron door. First night, you wept not in fear, but peace.`
},
choices:[
{t:{ar:'تحتفل مع الجيران',en:'Celebrate with neighbors'},do:s=>{s.money+=400000;s.hope+=5},to:'marriage',hint:{ar:'استقرار',en:'Stability'}}]});

def('marriage',{chapter:5,mood:'home',map:'m-khartoum',
text:{
  ar:`تزوجت آمنة. أنجبتما محمد ومريم.
كنت تقول لهما: <span class="speaker">«أبوكم جاء من دارفور في صندوق شاحنة. ولم يعد خائفاً.»</span>`,
  en:`Married Amna. Had Muhammad and Maryam.
You told them: <span class="speaker">«Your father came from Darfur in a truck bed, and is no longer afraid.»</span>`
},
choices:[
{t:{ar:'عش السنوات بهدوء وامتنان',en:'Live peacefully'},do:s=>{s.hope+=15;s.health+=10;s.age=40;unlockAch('family')},to:'dream',hint:{ar:'سلام',en:'Peace'}}]});

def('dream',{chapter:5,mood:'home',map:'m-khartoum',
text:{
  ar:`مرت السنوات بأمان. ذهبت في صباح ١٥ أبريل ٢٠٢٣ لتوقيع أوراق حافلة ثانية.
وفي تلك اللحظة بالذات...`,
  en:`Years passed safely. On April 15, 2023, you went to sign papers for a second bus.
And at that very moment...`
},
choices:[{t:{ar:'...',en:'...'},to:'war'}]});

def('war',{chapter:6,mood:'war',map:'m-khartoum',
text:{
  ar:`١٥ أبريل ٢٠٢٣. طائرات ومدفعية ودخان أسود.
اندلع القتال بين الجيش والدعم السريع. ثلاثون سنة من التعب، راحت في دقائق.`,
  en:`April 15, 2023. Planes, artillery, black smoke.
Fighting erupted between the army and RSF. 30 years of toil vanished in minutes.`
},
choices:[
{t:{ar:'تجري إلى البيت',en:'Rush home'},do:s=>{s.health-=10;s.energy-=20},to:'loot',hint:{ar:'صحة -',en:'Health -'}},
{t:{ar:'تتصل بآمنة أولاً',en:'Call Amna first'},do:s=>{s.hope-=8},to:'loot',hint:{ar:'أمل -',en:'Hope -'}}]});

def('loot',{chapter:6,mood:'attack',map:'m-khartoum',
text:{
  ar:`وصلت والحي دخان. الباب مهشم. الحافلة والبيت وكل ما ملكت نهب.
دخلت الغرفة. خرجت وحدك. صرخت ولم يسمعك أحد.`,
  en:`Arrived to a smoking neighborhood. Door smashed. Bus, house, everything looted.
Entered the room. Emerged alone. Screamed, no one heard.`
},
choices:[
{t:{ar:'...',en:'...'},do:s=>{s.money=0;s.hope-=15;unlockAch('lost_all')},to:'uthman_saves'}]});

def('uthman_saves',{chapter:6,mood:'dark',map:'m-khartoum',
text:function(s){
if(s.uthman&&s.uthman.alive){
  return {
    ar:`بينما كنت تزحف بين الأنقاض، ظهر عثمان (٢٣ عاماً): <span class="speaker">«قمت معي من الشارع. لن أتركك في النار.»</span> سحبك من بين الحطام.`,
    en:`Crawling through rubble, 23-year-old Uthman appeared: <span class="speaker">«You pulled me off the street. I won't leave you in the fire.»</span> He pulled you out.`
  };
}
return {ar:'وبقيْت وحدك في الرماد.',en:'You remained alone in the ash.'};},
choices:[
{t:{ar:'...',en:'...'},do:s=>{if(s.uthman&&s.uthman.alive){s.hope+=10;s.humanity+=5}s.health-=5},to:'fasher_road'}]});

def('fasher_road',{chapter:7,mood:'famine',map:'m-fasher',
text:{
  ar:`لم يكن أمامك سوى الفاشر. الفاشر محاصرة منذ أشهر. لا طعام، لا دواء، مجاعة معلنة.
رأيت أطفالاً يأكلون أوراق الأشجار.`,
  en:`Only Al-Fashir remained. Besieged for months. No food, no medicine, declared famine.
You saw children eating tree leaves.`
},
choices:[
{t:{ar:'تتوجه نحو غرف الطوارئ',en:'Head to Emergency Rooms'},do:s=>{s.hope+=5},to:'err_room',hint:{ar:'أمل +',en:'Hope +'}},
{t:{ar:'تحاول الفرار عبر نقطة تفتيش',en:'Try escaping via checkpoint'},do:s=>{s.money-=200;s.health-=10},to:'checkpoint_bribe',hint:{ar:'خطر',en:'Danger'}}]});

def('err_room',{chapter:8,mood:'hope',map:'m-fasher',
text:{
  ar:`في زقاق ضيق، وجدت «غرفة طوارئ» يدار فيها مطبخ جماعي.
طبيبة شابة قالت: <span class="speaker">«ما معنا مال. معنا بعضنا. تعال.»</span>
تطوعت لتوزيع الطعام ونقل الجرحى.`,
  en:`In a narrow alley, an "Emergency Room" running a community kitchen.
A young doctor said: <span class="speaker">«No money. We have each other. Come.»</span>
You volunteered to distribute food and carry wounded.`
},
choices:[
{t:{ar:'تنضم إليهم وتتبرع بالدم للجرحى',en:'Join & donate blood to wounded'},do:s=>{
  s.humanity+=20;s.hope+=15;s.health-=15;s.flags.joined_err=true;
  unlockAch('err_join');unlockAch('save_someone');
},to:'fasher_fall',hint:{ar:'تضحية كبرى',en:'Great Sacrifice'}},
{t:{ar:'تأخذ طعاماً وترحل',en:'Take food & leave'},do:s=>{s.food+=20;s.humanity-=10},to:'escape_fasher',hint:{ar:'نجاة فردية',en:'Survival'}}]});

def('fasher_fall',{chapter:8,mood:'dark',map:'m-fasher',
text:{
  ar:`سقطت الفاشر. رصدت الأمم المتحدة مؤشرات إبادة جماعية ومجازر مروعة.
خرجت مع عثمان نحو الحدود، لا تحميكما سوى الأقدار.`,
  en:`Al-Fashir fell. UN reported indicators of genocide and horrific massacres.
You escaped with Uthman toward the border, protected only by fate.`
},
choices:[
{t:{ar:'المسير نحو الحدود',en:'March to the border'},do:s=>{s.health-=15},to:'borders'}]});

def('checkpoint_bribe',{chapter:7,mood:'attack',map:'m-fasher',
text:{
  ar:`عند نقطة التفتيش، طلب المسلح مالاً طائلاً. دفعت ما بقي لك لتعبر.`,
  en:`At the checkpoint, a gunman demanded a heavy bribe. You paid your last coins to pass.`
},
choices:[{t:{ar:'العبور',en:'Cross'},to:'escape_fasher'}]});

def('escape_fasher',{chapter:8,mood:'desert',map:'m-fasher',
text:{ar:'هربت نحو الحدود الغربية.',en:'Escaped toward western borders.'},choices:[{t:{ar:'الحدود',en:'Borders'},to:'borders'}]});

def('borders',{chapter:9,mood:'border',map:'m-borders',
text:function(s){
return {
  ar:`وقفت أمام مفترق الطرق الأخير:
🇪🇬 مصر · 🇹🇩 تشاد · 🇸🇸 جنوب السودان. أكثر من ٤ ملايين لاجئ. أي طريق تختار؟`,
  en:`You stood before the final crossroads:
🇪🇬 Egypt · 🇹🇩 Chad · 🇸🇸 South Sudan. Over 4 million refugees. Which path?`
};},
choices:[
{t:{ar:'🇪🇬 شمالاً نحو مصر',en:'🇪🇬 North to Egypt'},do:s=>{s.flags.border='north';s.hope+=20;s.health-=15;addDiary(s,lang==='ar'?'عبرت نحو مصر.':'Crossed to Egypt.')},to:'ending',hint:{ar:'أمان',en:'Safety'}},
{t:{ar:'🇹🇩 غرباً نحو تشاد',en:'🇹🇩 West to Chad'},do:s=>{s.flags.border='west';s.hope+=15;s.health-=20;addDiary(s,lang==='ar'?'عبرت نحو تشاد.':'Crossed to Chad.')},to:'ending',hint:{ar:'جذور',en:'Roots'}},
{t:{ar:'🇸🇸 جنوباً نحو جنوب السودان',en:'🇸🇸 South to South Sudan'},do:s=>{s.flags.border='south';s.hope+=10;s.health-=20;addDiary(s,lang==='ar'?'نزلت جنوباً.':'Headed south.')},to:'ending',hint:{ar:'النيل',en:'Nile'}}]});

/* ============================================================
   ENDINGS
   ============================================================ */
def('ending',{chapter:10,mood:'hope',map:'m-borders',
text:function(s){
  const uthAlive=s.uthman&&s.uthman.alive;
  const score=s.hope+s.humanity+(uthAlive?20:0)+(s.flags.joined_err?15:0);

  const sBox=`<div class="stats-box">
    <div class="row"><span>${lang==='ar'?'القرارات':'Choices'}</span><span>${s.stats.choices}</span></div>
    <div class="row"><span>${lang==='ar'?'عثمان':'Uthman'}</span><span>${uthAlive?(lang==='ar'?'حي':'Alive'):(lang==='ar'?'مفقود':'Lost')}</span></div>
    <div class="row"><span>${lang==='ar'?'غرفة الطوارئ':'ER'}</span><span>${s.flags.joined_err?(lang==='ar'?'نعم':'Yes'):(lang==='ar'?'لا':'No')}</span></div>
    <div class="row"><span>${lang==='ar'?'الأمل':'Hope'}</span><span>${s.hope}%</span></div>
    <div class="row"><span>${lang==='ar'?'الإنسانية':'Humanity'}</span><span>${s.humanity}%</span></div>
  </div>`;

  if(s.flags.sacrifice){
    markEnding('martyr');unlockAch('end_martyr');
    return {
      ar:`<div class="ending-h martyr">🌹 التضحية</div>
        لم تصل إلى الحدود. في غرفة الطوارئ، حين سُئلت عن الدم والجريح، قدمت كل ما تملك.
        ثم سقطت، وعثمان يبكي بجانبك. أنت أنقذت أحداً. هذا يكفي.
        <span class="quote">«بعض الناس لا يعيشون ليروا السلام. يعيشون ليصنعوه لغيرهم.»</span>
        ${sBox}`,
      en:`<div class="ending-h martyr">🌹 The Martyr</div>
        You never reached the border. In the ER, you gave your blood and strength.
        Then you fell, Uthman weeping beside you. You saved someone. That is enough.
        <span class="quote">«Some do not live to see peace. They live to make it for others.»</span>
        ${sBox}`
    };
  }

  if(score>=115&&uthAlive&&s.flags.joined_err){
    markEnding('witness');unlockAch('end_witness');unlockAch('uthman_alive');
    return {
      ar:`<div class="ending-h peace">📖 الشاهد</div>
        عبرت الحدود ومعك عثمان. بدأت تكتب أسماء من فقدت ومن نجا.
        حين سألك طفل: <span class="speaker">«من أنت؟»</span> قلت: <span class="speaker">«أنا من الفاشر. وهذه حكايتنا.»</span>
        <span class="quote">«النجاة ليست أن تبقى حياً فقط. النجاة أن تحفظ الأسماء.»</span>
        ${sBox}`,
      en:`<div class="ending-h peace">📖 The Witness</div>
        You crossed with Uthman. You began writing the names of the lost and saved.
        When a child asked: <span class="speaker">«Who are you?»</span> You said: <span class="speaker">«I am from Al-Fashir. This is our story.»</span>
        <span class="quote">«Survival is not just staying alive. It is keeping the names.»</span>
        ${sBox}`
    };
  }

  if(uthAlive&&score>=70){
    markEnding('renewed');unlockAch('end_renewed');unlockAch('uthman_alive');
    return {
      ar:`<div class="ending-h peace">🌱 من جديد</div>
        عبرت الحدود مع عثمان. بدأت من جديد في المخيم. تعرف كيف تبدأ من الصفر.
        من نجا يحمل أمانة من لم ينجُ.
        <span class="quote">«بعض البشر يولدون مرتين: مرة من أمهاتهم، ومرة من رحم الحروب.»</span>
        ${sBox}`,
      en:`<div class="ending-h peace">🌱 Renewed</div>
        You crossed with Uthman. Started anew in the camp. You know how to rebuild.
        Those who survive carry the duty of those who didn't.
        <span class="quote">«Some are born twice: once from their mothers, once from the womb of war.»</span>
        ${sBox}`
    };
  }

  markEnding('crossing');unlockAch('end_crossing');
  return {
    ar:`<div class="ending-h peace">🚪 العبور</div>
      عبرت الحدود وحدك. بدأت تزرع في أرض الشتات. عثمان في القلب، والوطن في الذاكرة.
      <span class="quote">«الرماد يهطل، لكن تحته نار لا تطفأ.»</span>
      ${sBox}`,
    en:`<div class="ending-h peace">Crossing</div>
      You crossed alone. Began planting in the diaspora. Uthman in your heart, homeland in memory.
      <span class="quote">«Ash falls, but underneath is an unquenchable fire.»</span>
      ${sBox}`
  };
},
choices:[{t:{ar:'ابدأ من جديد',en:'Restart'},do:s=>{Object.assign(s,newState());updateHUD();updateCompUI();},to:'intro'}]});

def('death',{chapter:10,mood:'dark',map:'m-borders',
text:function(s){
  markEnding('ash');unlockAch('end_ash');
  return {
    ar:`<div class="ending-h dark">🥀 الرماد الأخير</div>
      انهار جسدك. سقطت على رمال الطريق. لا أحد كان بجانبك.
      <span class="quote">«تذكرهم. تذكر أنهم كانوا هنا.»</span>`,
    en:`<div class="ending-h dark">🥀 The Last Ash</div>
      Your body collapsed. You fell on the roadside. No one was beside you.
      <span class="quote">«Remember them. Remember they were here.»</span>`
  };
},
choices:[{t:{ar:'حاول مرة أخرى',en:'Try Again'},do:s=>{Object.assign(s,newState());updateHUD();updateCompUI();},to:'intro'}]});

/* ================= INIT ================= */
initParticles();
S=newState();
render();
updateHUD();
updateCompUI();
</script>
